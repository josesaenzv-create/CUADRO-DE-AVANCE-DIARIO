        // ============================================================================
        // 6. COMPONENTES DE GRÁFICOS VECTORIALES CORREGIDOS (NOMBRES CORTOS NOMBRE.A)
        // ============================================================================
        function LienzoSVGLineal({
            titulo, subtitulo = "", etiquetaEjeY, serieActual, serieComparada = null,
            mostrarTendencia = false, mostrarComparativa = false, modoSuperpuesto = false,
            colorPrincipal = "#2563eb", colorComparado = "#f59e0b", altura = 230,
            diaSeleccionado = null, onSelectDia = null
        }) {
            const [hoverIdx, setHoverIdx] = React.useState(null);
            const width = 580;
            const height = altura;
            const padLeft = 74;
            const padRight = 20;
            const padTop = 24;
            const padBottom = 38;
            const plotW = width - padLeft - padRight;
            const plotH = height - padTop - padBottom;

            const nPuntos = serieActual.length || 31;

            const maxValRaw = React.useMemo(() => {
                let m = 1000;
                serieActual.forEach(p => { if (p.valor > m) m = p.valor; });
                if (mostrarComparativa && Array.isArray(serieComparada)) {
                    serieComparada.forEach(p => { if (p.valor > m) m = p.valor; });
                }
                if (m <= 1500) return 1500;
                if (m <= 3000) return 3000;
                if (m <= 6000) return 6000;
                if (m <= 8000) return 8000;
                if (m <= 10000) return 10000;
                if (m <= 15000) return 15000;
                if (m <= 25000) return 25000;
                if (m <= 30000) return 30000;
                return Math.ceil(m / 10000) * 10000;
            }, [serieActual, serieComparada, mostrarComparativa]);

            const getX = (idx) => padLeft + (idx / Math.max(1, nPuntos - 1)) * plotW;
            const getY = (val) => padTop + plotH - (Math.min(maxValRaw, Math.max(0, val)) / maxValRaw) * plotH;

            const puntosActual = serieActual.map((p, i) => `${getX(i).toFixed(1)},${getY(p.valor).toFixed(1)}`).join(" ");
            const areaActual = `${getX(0).toFixed(1)},${(padTop + plotH).toFixed(1)} ${puntosActual} ${getX(nPuntos - 1).toFixed(1)},${(padTop + plotH).toFixed(1)}`;

            const puntosComp = (mostrarComparativa && Array.isArray(serieComparada))
                ? serieComparada.map((p, i) => `${getX(i).toFixed(1)},${getY(p.valor).toFixed(1)}`).join(" ")
                : "";
            const areaComp = puntosComp
                ? `${getX(0).toFixed(1)},${(padTop + plotH).toFixed(1)} ${puntosComp} ${getX(nPuntos - 1).toFixed(1)},${(padTop + plotH).toFixed(1)}`
                : "";

            const lineaTendencia = React.useMemo(() => {
                if (!mostrarTendencia || serieActual.length < 2) return null;
                let ultimoIdxConDatos = 22;
                serieActual.forEach((p, idx) => { if (p.valor > 0) ultimoIdxConDatos = Math.max(ultimoIdxConDatos, idx); });
                const sub = serieActual.slice(0, ultimoIdxConDatos + 1);
                const n = sub.length;
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                sub.forEach((p, i) => {
                    sumX += i;
                    sumY += p.valor;
                    sumXY += i * p.valor;
                    sumXX += i * i;
                });
                const denom = (n * sumXX - sumX * sumX);
                if (denom === 0) return null;
                const slope = (n * sumXY - sumX * sumY) / denom;
                const intercept = (sumY - slope * sumX) / n;
                const yStart = Math.max(0, intercept);
                const yEnd = Math.max(0, slope * (nPuntos - 1) + intercept);
                return { x1: getX(0), y1: getY(yStart), x2: getX(nPuntos - 1), y2: getY(yEnd) };
            }, [serieActual, mostrarTendencia, maxValRaw]);

            const nivelesY = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(maxValRaw * f));

            return (
                <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition relative overflow-hidden">
                    <div className="flex flex-wrap justify-between items-start gap-2 mb-1">
                        <div>
                            <h4 className="text-xs sm:text-sm font-black text-slate-800 uppercase tracking-tight">{titulo}</h4>
                            {subtitulo && <p className="text-[10px] font-bold text-slate-400">{subtitulo}</p>}
                        </div>
                        {hoverIdx !== null && serieActual[hoverIdx] && (
                            <div className="text-[11px] font-black bg-slate-900 text-white px-2.5 py-0.5 rounded-lg shadow">
                                {serieActual[hoverIdx].etiqueta}: <span className="text-emerald-400">{formatShortSoles(serieActual[hoverIdx].valor)}</span>
                                {mostrarComparativa && serieComparada && serieComparada[hoverIdx] && (
                                    <span className="text-amber-300 ml-1.5">| Ant: {formatShortSoles(serieComparada[hoverIdx].valor)}</span>
                                )}
                            </div>
                        )}
                    </div>

                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto select-none">
                        {nivelesY.map((val, idx) => {
                            const yPos = getY(val);
                            return (
                                <g key={idx}>
                                    <line x1={padLeft} y1={yPos} x2={width - padRight} y2={yPos} stroke={idx === 0 ? "#475569" : "#e2e8f0"} strokeWidth={idx === 0 ? "1.5" : "1"} />
                                    <text x={padLeft - 8} y={yPos + 3.5} textAnchor="end" fontSize="10" fontWeight="700" fill="#334155">
                                        {formatShortSoles(val)}
                                    </text>
                                </g>
                            );
                        })}

                        {serieActual.map((p, idx) => {
                            const numDia = idx + 1;
                            const mostrarTick = nPuntos <= 12 || numDia % 5 === 0 || numDia === 1;
                            const xPos = getX(idx);
                            const esDiaMarcado = diaSeleccionado && Number(diaSeleccionado) === numDia && nPuntos >= 28;
                            return (
                                <g key={idx}>
                                    {esDiaMarcado && (
                                        <line x1={xPos} y1={padTop} x2={xPos} y2={padTop + plotH} stroke="#10b981" strokeWidth="2" strokeDasharray="3 2" />
                                    )}
                                    {mostrarTick && (
                                        <>
                                            <line x1={xPos} y1={padTop} x2={xPos} y2={padTop + plotH} stroke="#f1f5f9" strokeWidth="1" />
                                            <text x={xPos} y={padTop + plotH + 15} textAnchor="middle" fontSize="10" fontWeight="700" fill="#1e293b">
                                                {p.tickLabel || numDia}
                                            </text>
                                        </>
                                    )}
                                </g>
                            );
                        })}

                        <text x={12} y={padTop + plotH / 2} transform={`rotate(-90, 12, ${padTop + plotH / 2})`} textAnchor="middle" fontSize="9.5" fontWeight="800" fill="#475569">
                            {etiquetaEjeY}
                        </text>

                        <text x={padLeft + plotW / 2} y={height - 4} textAnchor="middle" fontSize="10" fontWeight="800" fill="#475569">
                            {nPuntos >= 28 ? "DÍA DEL MES (Haz clic en un punto para inspeccionar el día)" : "PERIODO"}
                        </text>

                        {mostrarComparativa && puntosComp && (
                            <g>
                                {modoSuperpuesto && <polygon points={areaComp} fill={colorComparado} fillOpacity="0.22" />}
                                <polyline fill="none" stroke={colorComparado} strokeWidth={modoSuperpuesto ? "2" : "2.2"} strokeDasharray={modoSuperpuesto ? "4 3" : "5 3"} points={puntosComp} />
                            </g>
                        )}

                        <polygon points={areaActual} fill={colorPrincipal} fillOpacity={modoSuperpuesto ? "0.28" : "0.12"} />

                        {lineaTendencia && (
                            <line x1={lineaTendencia.x1} y1={lineaTendencia.y1} x2={lineaTendencia.x2} y2={lineaTendencia.y2} stroke="#93c5fd" strokeWidth="2" />
                        )}

                        <polyline fill="none" stroke={colorPrincipal} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" points={puntosActual} />

                        {serieActual.map((p, idx) => {
                            const cx = getX(idx);
                            const cy = getY(p.valor);
                            const numDia = idx + 1;
                            const esDiaActivo = diaSeleccionado && Number(diaSeleccionado) === numDia && nPuntos >= 28;
                            return (
                                <g
                                    key={idx}
                                    onMouseEnter={() => setHoverIdx(idx)}
                                    onMouseLeave={() => setHoverIdx(null)}
                                    onClick={() => { if (onSelectDia && nPuntos >= 28) onSelectDia(String(numDia)); }}
                                    className="cursor-pointer"
                                >
                                    {(p.valor > 0 || hoverIdx === idx || esDiaActivo) && (
                                        <circle
                                            cx={cx}
                                            cy={cy}
                                            r={esDiaActivo ? "6" : hoverIdx === idx ? "5" : "3"}
                                            fill={esDiaActivo ? "#10b981" : colorPrincipal}
                                            stroke="#ffffff"
                                            strokeWidth="1.5"
                                        />
                                    )}
                                    <rect x={cx - (plotW / nPuntos) / 2} y={padTop} width={plotW / nPuntos} height={plotH} fill="transparent" />
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        }

        function GraficoColumnasVerticalesSVG({
            titulo = "🏆 Cumplimiento de Metas por Asesor de Negocios",
            items = [],
            modoVisual = "MISMO_GRAFICO",
            mostrarComparativa = false,
            labelActual = "MES ACTUAL",
            labelComparado = "MES ANTERIOR",
            tipoUnidad = "PORCENTAJE"
        }) {
            const formatearEtiqueta = (v) => {
                if (tipoUnidad === "PORCENTAJE") return `${parseNum(v).toFixed(1)}%`;
                return formatShortSoles(v);
            };

            const renderizarCanvasColumnas = (lista, tituloCanvas, mostrarDosSeries, esSuperpuesto, usarSerieAnteriorComoUnica = false) => {
                let maxVal = 125;
                if (tipoUnidad === "PORCENTAJE") {
                    lista.forEach(it => {
                        maxVal = Math.max(maxVal, parseNum(it.actualPct), mostrarDosSeries ? parseNum(it.anteriorPct) : 0);
                    });
                    maxVal = Math.ceil(maxVal / 25) * 25;
                } else {
                    maxVal = 10000;
                    lista.forEach(it => {
                        maxVal = Math.max(maxVal, parseNum(it.actualMonto), mostrarDosSeries ? parseNum(it.anteriorMonto) : 0, parseNum(it.meta));
                    });
                    maxVal = Math.ceil(maxVal / 10000) * 10000;
                }

                const niveles = [0, 0.2, 0.4, 0.6, 0.8, 1].map(f => maxVal * f);

                return (
                    <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm overflow-hidden">
                        <div className="flex flex-wrap justify-between items-start gap-2 mb-3">
                            <div>
                                <h4 className="text-xs sm:text-sm font-black text-slate-800 uppercase tracking-tight">{tituloCanvas}</h4>
                                <p className="text-[10px] font-bold text-slate-400">
                                    Eje Vertical: {tipoUnidad === "PORCENTAJE" ? "% de Cumplimiento de Meta" : "Monto Desembolsado (S/.)"}
                                </p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 text-[11px] font-bold">
                                {!usarSerieAnteriorComoUnica && (
                                    <span className="inline-flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-sm bg-[#16bb67] inline-block"></span>
                                        <span>{labelActual}</span>
                                    </span>
                                )}
                                {(mostrarDosSeries || usarSerieAnteriorComoUnica) && (
                                    <span className="inline-flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-sm bg-indigo-500 inline-block"></span>
                                        <span>{labelComparado}</span>
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="overflow-x-auto pb-2">
                            <div style={{ minWidth: `${Math.max(420, lista.length * 72)}px` }} className="relative pl-14 pr-3 pt-7 pb-9">
                                <div className="relative h-60 border-b-2 border-slate-600 flex items-end justify-around gap-2 px-2">
                                    {niveles.map((niv, idx) => {
                                        const bottomPct = (niv / maxVal) * 100;
                                        return (
                                            <div key={idx} style={{ bottom: `${bottomPct}%` }} className="absolute left-0 right-0 border-t border-slate-200 pointer-events-none">
                                                <span className="absolute -left-14 -top-2 w-12 text-right text-[9.5px] font-extrabold text-slate-600">
                                                    {tipoUnidad === "PORCENTAJE" ? `${niv.toFixed(0)}%` : formatShortSoles(niv)}
                                                </span>
                                            </div>
                                        );
                                    })}

                                    {lista.map((it, idx) => {
                                        const vAct = tipoUnidad === "PORCENTAJE" ? parseNum(it.actualPct) : parseNum(it.actualMonto);
                                        const vAnt = tipoUnidad === "PORCENTAJE" ? parseNum(it.anteriorPct) : parseNum(it.anteriorMonto);
                                        const valorPrimario = usarSerieAnteriorComoUnica ? vAnt : vAct;
                                        const diff = vAct - vAnt;

                                        const hActPct = Math.min(100, Math.max(valorPrimario > 0 ? 3 : 1, (valorPrimario / maxVal) * 100));
                                        const hAntPct = Math.min(100, Math.max(vAnt > 0 ? 3 : 1, (vAnt / maxVal) * 100));

                                        return (
                                            <div key={idx} className="flex-1 min-w-[60px] max-w-[100px] h-full flex flex-col justify-end items-center relative z-10 px-0.5">
                                                {mostrarDosSeries && (
                                                    <div className={`mb-1 px-1 py-0.2 rounded text-[8.5px] font-black leading-tight text-center truncate max-w-full ${diff > 0 ? "bg-emerald-100 text-emerald-800" : diff < 0 ? "bg-rose-100 text-rose-700" : "bg-slate-100 text-slate-500"}`}>
                                                        {diff > 0 ? `+${tipoUnidad === "PORCENTAJE" ? diff.toFixed(0) + "%" : formatShortSoles(diff)}` : diff < 0 ? `${tipoUnidad === "PORCENTAJE" ? diff.toFixed(0) + "%" : formatShortSoles(diff)}` : "0%"}
                                                    </div>
                                                )}

                                                {(!mostrarDosSeries || esSuperpuesto) ? (
                                                    <div className="w-full h-full flex items-end justify-center relative">
                                                        {mostrarDosSeries && esSuperpuesto && (
                                                            <div
                                                                style={{ height: `${hAntPct}%` }}
                                                                className="w-10/12 bg-indigo-500/30 border-2 border-dashed border-indigo-600 rounded-t-md absolute bottom-0 transition-all duration-500"
                                                                title={`${labelComparado}: ${formatearEtiqueta(vAnt)}`}
                                                            ></div>
                                                        )}

                                                        <div
                                                            style={{ height: `${hActPct}%` }}
                                                            className={`${esSuperpuesto && mostrarDosSeries ? "w-6/12 z-10 shadow-md" : "w-8/12"} ${usarSerieAnteriorComoUnica ? "bg-indigo-500" : "bg-[#16bb67] hover:bg-[#129e56]"} rounded-t-md transition-all duration-500 relative flex justify-center`}
                                                        >
                                                            <span className={`text-[9.5px] font-black whitespace-nowrap ${hActPct > 82 ? "-top-4 text-[#129e56] absolute" : hActPct > 20 ? "mt-1 text-slate-950" : "-top-4 text-[#129e56] absolute"}`}>
                                                                {formatearEtiqueta(valorPrimario)}
                                                            </span>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="w-full h-full flex items-end justify-center gap-0.5">
                                                        <div style={{ height: `${hActPct}%` }} className="w-5/12 bg-[#16bb67] rounded-t-sm transition-all duration-500 relative flex justify-center" title={`${labelActual}: ${formatearEtiqueta(vAct)}`}>
                                                            <span className="absolute -top-3.5 text-[8.5px] font-black text-emerald-800 whitespace-nowrap">{formatearEtiqueta(vAct)}</span>
                                                        </div>
                                                        <div style={{ height: `${hAntPct}%` }} className="w-5/12 bg-indigo-500 rounded-t-sm transition-all duration-500 relative flex justify-center" title={`${labelComparado}: ${formatearEtiqueta(vAnt)}`}>
                                                            <span className="absolute -top-3.5 text-[8.5px] font-bold text-indigo-700 whitespace-nowrap">{formatearEtiqueta(vAnt)}</span>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="absolute -bottom-6 text-[10px] font-black text-slate-800 uppercase tracking-tight text-center truncate w-full px-0.5" title={it.concepto}>
                                                    {it.concepto}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="text-center text-[10px] font-black text-slate-500 uppercase mt-6">
                                    ASESORES OFICIALES (FORMATO: NOMBRE.A)
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            if (mostrarComparativa && modoVisual === "LADO_A_LADO") {
                return (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {renderizarCanvasColumnas(items, `${titulo} (${labelActual})`, false, false, false)}
                        {renderizarCanvasColumnas(items, `${titulo} (${labelComparado})`, false, false, true)}
                    </div>
                );
            }

            return renderizarCanvasColumnas(items, titulo, mostrarComparativa, modoVisual === "SUPERPUESTO", false);
        }// ============================================================================
        // 6B. PANEL EJECUTIVO DE ESTADÍSTICAS (CONECTADO A LA HOJA OFICIAL "USUARIOS")
        // ============================================================================
        function PanelGraficosEstadisticos({
            movimientos, expedientesCaja, sedesCatalogo, asesoresOficialesVista,
            obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes,
            isGerente, isJefeZonal, isAdmin, isLiderEquipo, isJefeGrupal,
            userSede, sedesPermitidasUsuario, selectedSedeVista, filtroMes,
            filtroEquipo, setFiltroEquipo, filtroJefeAsignado, setFiltroJefeAsignado,
            filtroArea, setFiltroArea, listaJefesAsignados
        }) {
            const mesActualBase = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;
            const [activarComparativa, setActivarComparativa] = React.useState(true);
            const [mesComparar, setMesComparar] = React.useState(() => obtenerMesAnterior(mesActualBase));
            const [modoComparacionVisual, setModoComparacionVisual] = React.useState("MISMO_GRAFICO");
            const [agrupacionTiempo, setAgrupacionTiempo] = React.useState("DIAS");
            const [unidadColumnas, setUnidadColumnas] = React.useState("PORCENTAJE");
            const [incluirColaCaja, setIncluirColaCaja] = React.useState(false);
            const [diaInspeccion, setDiaInspeccion] = React.useState("TODOS");

            React.useEffect(() => {
                if (filtroMes !== "TODOS") {
                    setMesComparar(obtenerMesAnterior(filtroMes));
                }
            }, [filtroMes]);

            const fuenteMovs = React.useMemo(() => {
                return incluirColaCaja ? [...movimientos, ...expedientesCaja] : movimientos;
            }, [movimientos, expedientesCaja, incluirColaCaja]);

            const nombresCortosPermitidos = React.useMemo(() => {
                return new Set(asesoresOficialesVista.map(a => a.nombreCorto));
            }, [asesoresOficialesVista]);

            const movsJerarquia = React.useMemo(() => {
                return fuenteMovs.filter(m => {
                    if (isGerente) {
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else if (isJefeZonal) {
                        if (!sedesPermitidasUsuario.includes("TODAS") && !sedesPermitidasUsuario.includes(m.sede)) return false;
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else {
                        if (m.sede !== userSede) return false;
                    }
                    if (!nombresCortosPermitidos.has(m.asesor)) return false;
                    return true;
                });
            }, [fuenteMovs, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, nombresCortosPermitidos]);

            const datosAgenciaSuperior = React.useMemo(() => {
                const movsAct = movsJerarquia.filter(m => m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion)));
                const movsAnt = movsJerarquia.filter(m => m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion)));

                const movsActMesCompleto = movsJerarquia.filter(m => m.mesRegistro === mesActualBase);
                const movsAntMesCompleto = movsJerarquia.filter(m => m.mesRegistro === mesComparar);

                const haySubfiltroEquipoOJefe = filtroEquipo !== "TODOS" || filtroJefeAsignado !== "TODOS" || filtroArea !== "TODAS";
                let metaTotalVista = 0;

                if (haySubfiltroEquipoOJefe) {
                    metaTotalVista = asesoresOficialesVista.reduce((acc, a) => acc + obtenerMetaAsesorPorMes(a.sedePrincipal, a.nombreCorto, mesActualBase), 0);
                } else {
                    const sedesCalculo = sedesCatalogo.filter(s => {
                        if (isGerente) return selectedSedeVista === "TODAS" || s.nombre === selectedSedeVista;
                        if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre)) && (selectedSedeVista === "TODAS" || s.nombre === selectedSedeVista);
                        return s.nombre === userSede;
                    });
                    metaTotalVista = sedesCalculo.reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, mesActualBase), 0);
                }
                if (metaTotalVista <= 0) metaTotalVista = 300000;

                const avanceTotalSoles = movsAct.reduce((acc, m) => acc + parseNum(m.monto), 0);
                const avanceAnteriorSoles = movsAnt.reduce((acc, m) => acc + parseNum(m.monto), 0);
                const pctAvance = metaTotalVista > 0 ? (avanceTotalSoles / metaTotalVista) * 100 : 0;

                const infoHabiles = calcularDiasHabilesMes(mesActualBase);
                const porDiaHabil = Math.round(avanceTotalSoles / 30);
                const porDiaHMesMeta = Math.round(metaTotalVista / infoHabiles.totalHabilesMes);

                let serieActual = [];
                let serieComparada = [];

                if (agrupacionTiempo === "SEMANAS") {
                    const semRangos = [
                        { label: "Sem 1 (1-7)", tick: "Sem 1", min: 1, max: 7 },
                        { label: "Sem 2 (8-14)", tick: "Sem 2", min: 8, max: 14 },
                        { label: "Sem 3 (15-21)", tick: "Sem 3", min: 15, max: 21 },
                        { label: "Sem 4 (22-28)", tick: "Sem 4", min: 22, max: 28 },
                        { label: "Sem 5 (29-31)", tick: "Sem 5", min: 29, max: 31 }
                    ];
                    serieActual = semRangos.map(r => ({
                        etiqueta: `${r.label} (${mesActualBase})`,
                        tickLabel: r.tick,
                        valor: movsActMesCompleto.filter(m => Number(m.diaSistema) >= r.min && Number(m.diaSistema) <= r.max).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                    serieComparada = semRangos.map(r => ({
                        etiqueta: `${r.label} (${mesComparar})`,
                        tickLabel: r.tick,
                        valor: movsAntMesCompleto.filter(m => Number(m.diaSistema) >= r.min && Number(m.diaSistema) <= r.max).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                } else if (agrupacionTiempo === "MESES") {
                    serieActual = MESES_ANIO.map((mNom) => ({
                        etiqueta: mNom,
                        tickLabel: mNom.slice(0, 3),
                        valor: movsJerarquia.filter(x => x.mesRegistro === mNom).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                    serieComparada = MESES_ANIO.map((mNom) => {
                        const mPrev = obtenerMesAnterior(mNom);
                        return {
                            etiqueta: mPrev,
                            tickLabel: mNom.slice(0, 3),
                            valor: movsJerarquia.filter(x => x.mesRegistro === mPrev).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                } else {
                    serieActual = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesActualBase})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsActMesCompleto.filter(m => Number(m.diaSistema) === d).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                    serieComparada = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesComparar})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAntMesCompleto.filter(m => Number(m.diaSistema) === d).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                }

                return {
                    metaTotalVista, avanceTotalSoles, avanceAnteriorSoles,
                    pctAvance, porDiaHabil, porDiaHMesMeta,
                    serieActual, serieComparada
                };
            }, [movsJerarquia, mesActualBase, mesComparar, diaInspeccion, agrupacionTiempo, filtroEquipo, filtroJefeAsignado, filtroArea, asesoresOficialesVista, sedesCatalogo, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const itemsColumnasConcepto = React.useMemo(() => {
                if (agrupacionTiempo === "SEDES" && (isGerente || isJefeZonal)) {
                    return sedesCatalogo
                        .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                        .map(s => {
                            const metaAct = obtenerMetaOficinaPorMes(s.nombre, mesActualBase);
                            const metaAnt = obtenerMetaOficinaPorMes(s.nombre, mesComparar);
                            const mAct = fuenteMovs.filter(m => m.sede === s.nombre && m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((a, b) => a + parseNum(b.monto), 0);
                            const mAnt = fuenteMovs.filter(m => m.sede === s.nombre && m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((a, b) => a + parseNum(b.monto), 0);
                            return {
                                concepto: s.nombre,
                                actualMonto: mAct,
                                anteriorMonto: mAnt,
                                meta: metaAct,
                                actualPct: metaAct > 0 ? (mAct / metaAct) * 100 : 0,
                                anteriorPct: metaAnt > 0 ? (mAnt / metaAnt) * 100 : 0
                            };
                        });
                }

                return asesoresOficialesVista.map(a => {
                    const metaAct = obtenerMetaAsesorPorMes(a.sedePrincipal, a.nombreCorto, mesActualBase);
                    const metaAnt = obtenerMetaAsesorPorMes(a.sedePrincipal, a.nombreCorto, mesComparar);
                    const mAct = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((s, x) => s + parseNum(x.monto), 0);
                    const mAnt = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((s, x) => s + parseNum(x.monto), 0);

                    return {
                        concepto: a.nombreCorto,
                        actualMonto: mAct,
                        anteriorMonto: mAnt,
                        meta: metaAct,
                        actualPct: metaAct > 0 ? (mAct / metaAct) * 100 : 0,
                        anteriorPct: metaAnt > 0 ? (mAnt / metaAnt) * 100 : 0
                    };
                });
            }, [agrupacionTiempo, isGerente, isJefeZonal, sedesCatalogo, sedesPermitidasUsuario, asesoresOficialesVista, fuenteMovs, movsJerarquia, mesActualBase, mesComparar, diaInspeccion, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const graficosDiariosPorAsesor = React.useMemo(() => {
                return asesoresOficialesVista.map(a => {
                    const movsAseAct = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesActualBase);
                    const movsAseAnt = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesComparar);

                    const serieAct = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesActualBase})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAseAct.filter(m => Number(m.diaSistema) === d).reduce((s, x) => s + parseNum(x.monto), 0)
                        };
                    });

                    const serieAnt = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesComparar})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAseAnt.filter(m => Number(m.diaSistema) === d).reduce((s, x) => s + parseNum(x.monto), 0)
                        };
                    });

                    const totalAct = diaInspeccion === "TODOS"
                        ? serieAct.reduce((s, x) => s + x.valor, 0)
                        : (serieAct[Number(diaInspeccion) - 1]?.valor || 0);
                    const totalAnt = diaInspeccion === "TODOS"
                        ? serieAnt.reduce((s, x) => s + x.valor, 0)
                        : (serieAnt[Number(diaInspeccion) - 1]?.valor || 0);

                    return {
                        key: `${a.sedePrincipal}__${a.nombreCorto}`,
                        asesor: a.nombreCorto,
                        usuarioCompleto: a.usuarioOriginal,
                        sede: a.sedePrincipal,
                        area: a.area,
                        equipo: a.equipo,
                        jefeAsignado: a.jefeAsignado,
                        totalAct, totalAnt, serieAct, serieAnt
                    };
                });
            }, [asesoresOficialesVista, movsJerarquia, mesActualBase, mesComparar, diaInspeccion]);

            return (
                <div className="space-y-6 excel-grid-bg p-2 sm:p-4 rounded-3xl border border-slate-200">
                    <div className="bg-white p-4 rounded-3xl shadow-sm border-2 border-[#59B447]/50 space-y-3">

        // ============================================================================
        // 6C. MÓDULO DE REPORTE DIARIO, MATRIZ SEMANAL Y GENERADOR AMABLE PARA WHATSAPP
        // ============================================================================
        function ModuloReporteDiarioYWhatsApp({
            movimientos, expedientesCaja, tablaAsesores,
            filtroMes, sedeMostrarTitulo, filtroEquipo, filtroJefeAsignado, onVerPlan
        }) {
            const mesActivo = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;

            const ultimoDiaConActividad = React.useMemo(() => {
                const todos = [...movimientos, ...expedientesCaja].filter(m => m.mesRegistro === mesActivo);
                if (todos.length === 0) return new Date().getDate();
                return Math.max(...todos.map(m => Number(m.diaSistema) || 1));
            }, [movimientos, expedientesCaja, mesActivo]);

            const [diaCorteReporte, setDiaCorteReporte] = React.useState(() => ultimoDiaConActividad);
            const [cantidadDiasMatriz, setCantidadDiasMatriz] = React.useState(3);
            const [tipoMensajeWA, setTipoMensajeWA] = React.useState("DIARIO_Y_SEMANAL");
            const [copiadoExito, setCopiadoExito] = React.useState(false);

            React.useEffect(() => {
                setDiaCorteReporte(ultimoDiaConActividad);
            }, [ultimoDiaConActividad, mesActivo]);

            const datosCuadroDelDia = React.useMemo(() => {
                const desembolsadosHoy = movimientos
                    .filter(m => m.mesRegistro === mesActivo && Number(m.diaSistema) === Number(diaCorteReporte))
                    .map(m => ({ ...m, condicionReporte: "DESEMBOLSADO" }));

                const pendientesHoy = expedientesCaja
                    .filter(m => m.mesRegistro === mesActivo && Number(m.diaSistema) === Number(diaCorteReporte))
                    .map(m => {
                        const et = m.etapaPipeline || obtenerEtapaPipeline(m);
                        return {
                            ...m,
                            condicionReporte: et === "POR_PRESENTAR" ? "POR PRESENTAR" : et === "POR_APROBAR" ? "POR APROBAR" : "EN CAJA (POR DESEMB.)"
                        };
                    });

                const todosHoy = [...desembolsadosHoy, ...pendientesHoy];

                const mapaPorAsesor = {};
                todosHoy.forEach(op => {
                    const ase = op.asesor || "SIN ASESOR";
                    if (!mapaPorAsesor[ase]) mapaPorAsesor[ase] = [];
                    mapaPorAsesor[ase].push(op);
                });

                const filas = [];
                let sumaDesembolsado = 0;
                let sumaPorDesembolsar = 0;
                let sumaGeneral = 0;

                Object.keys(mapaPorAsesor).forEach(ase => {
                    const ops = mapaPorAsesor[ase];
                    ops.forEach((op, idx) => {
                        const montoOp = parseNum(op.monto);
                        if (op.condicionReporte === "DESEMBOLSADO") sumaDesembolsado += montoOp;
                        else sumaPorDesembolsar += montoOp;
                        sumaGeneral += montoOp;

                        filas.push({
                            asesor: ase,
                            nroOperacionAsesor: idx + 1,
                            cliente: limpiarNombreExpediente(op.cliente),
                            modalidad: op.modalidad || "INDIVIDUAL",
                            integrantes: Array.isArray(op.integrantes) ? op.integrantes : [],
                            monto: montoOp,
                            condicion: op.condicionReporte,
                            raw: op
                        });
                    });
                });

                return { filas, sumaDesembolsado, sumaPorDesembolsar, sumaGeneral, totalOperaciones: filas.length };
            }, [movimientos, expedientesCaja, mesActivo, diaCorteReporte]);

            const diasRangoMatriz = React.useMemo(() => {
                const fin = Math.max(1, Math.min(31, Number(diaCorteReporte) || 1));
                const inicio = Math.max(1, fin - cantidadDiasMatriz + 1);
                const lista = [];
                for (let d = inicio; d <= fin; d++) {
                    lista.push({ dia: d, tituloColumna: obtenerNombreDiaSemana(mesActivo, d) });
                }
                return lista;
            }, [diaCorteReporte, cantidadDiasMatriz, mesActivo]);

            const matrizSeguimientoAsesores = React.useMemo(() => {
                const filasAsesores = tablaAsesores.map(a => {
                    let opsSemana = 0;
                    let montoSemana = 0;
                    let diasConsecutivosSinDesembolsar = 0;

                    const porDia = diasRangoMatriz.map(dObj => {
                        const movsDia = movimientos.filter(
                            m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesActivo && Number(m.diaSistema) === dObj.dia
                        );
                        const cant = movsDia.length;
                        const mto = movsDia.reduce((s, x) => s + parseNum(x.monto), 0);
                        opsSemana += cant;
                        montoSemana += mto;

                        if (cant === 0) diasConsecutivosSinDesembolsar++;
                        else diasConsecutivosSinDesembolsar = 0;

                        return { dia: dObj.dia, operaciones: cant, monto: mto };
                    });

                    return {
                        key: a.key, asesor: a.asesor, usuarioCompleto: a.usuarioCompleto,
                        sede: a.sede, area: a.area, equipo: a.equipo, jefeAsignado: a.jefeAsignado,
                        metaMes: a.meta, avanceMes: a.desembolsado, avancePctMes: a.avancePct,
                        porDia, opsSemana, montoSemana, diasConsecutivosSinDesembolsar
                    };
                });

                const totalesPorDia = diasRangoMatriz.map(dObj => {
                    let totOps = 0, totMonto = 0;
                    filasAsesores.forEach(f => {
                        const celda = f.porDia.find(p => p.dia === dObj.dia);
                        if (celda) { totOps += celda.operaciones; totMonto += celda.monto; }
                    });
                    return { dia: dObj.dia, totOps, totMonto };
                });

                const granTotalOpsSemana = totalesPorDia.reduce((s, x) => s + x.totOps, 0);
                const granTotalMontoSemana = totalesPorDia.reduce((s, x) => s + x.totMonto, 0);

                return { filasAsesores, totalesPorDia, granTotalOpsSemana, granTotalMontoSemana };
            }, [tablaAsesores, movimientos, diasRangoMatriz, mesActivo]);

        function App() {

                } catch (e) { return {}; }
            });

            const [session, setSession] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("crediban_desembolsos_session");
                    if (!saved) return null;
                    const parsed = JSON.parse(saved);
                    const rol = clasificarRolEstricto(parsed?.usuario?.cargo, parsed?.usuario?.cargoOriginal, parsed?.usuario);
                    if (rol === "ASESOR") {
                        localStorage.removeItem("crediban_desembolsos_session");
                        return null;
                    }
                    return parsed;
                } catch (e) { return null; }
            });

            const guardarOperacionEnServidor = async (etapaPipeline = null) => {
                if (!session?.token) return;
                if (!etapaPipeline && !puedeDesembolsar) {
                    alert("⛔ Solo Caja o Gerencia pueden registrar desembolsos oficiales.");

                const rawAsesor = (formAsesor === "__OTRO__" ? formAsesorManual : formAsesor).trim().toUpperCase();

                const prefijo = etapaPipeline ? construirPrefijoEtapa(etapaPipeline) + " " : "";
                const nombreFinalGuardar = `${prefijo}${nombreLimpio}`;

                const payloadData = {
                    sede: (isGerente || isJefeZonal) ? formSede : userSede,
                    formato: "DESEMBOLSO",
                    mesRegistro: formMes,
                    diaSistema: parseInt(formDiaSistema, 10) || new Date().getDate(),
                    asesor: asesorElegido,
                    modalidad: modalidadCredito,
                    nombreCliente: nombreFinalGuardar,
                    tipoCliente: modalidadCredito === "GRUPAL" ? totalesFormulario.tipoResumenGrupo : formTipoCliente,
                    cantidadCN: totalesFormulario.cantidadCN,
                    monto: totalesFormulario.montoBruto,
                    montoDescuento: totalesFormulario.montoDescuento,
                    frecuencia: parseInt(formFrecuencia, 10) || 14,
                    nroCuotas: parseInt(formCuotas, 10) || 0,
                    tasaTEM: parseNum(formTasaTEM),
                    diasGracia: diasGraciaFinalForm,
                    fechaDesembolsoISO: formFechaISO,
                    integrantes: modalidadCredito === "GRUPAL" ? grupoIntegrantes : []
                };

                setSavingMov(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "registrarMovimiento", token: session.token, data: payloadData })
                    });
                    const result = await res.json();
                    if (result.status === "ok") {
                        const etiquetaEtapa = etapaPipeline === "POR_PRESENTAR"
                            ? "📂 Pendiente por Presentar"
                            : etapaPipeline === "POR_APROBAR"
                                ? "📝 Pendiente por Aprobar"
                                : etapaPipeline === "EN_CAJA"
                                    ? "⏳ Expediente en Caja (Por Desembolsar)"
                                    : "✅ Desembolsado Oficial";
                        alert(`${etiquetaEtapa} registrado con éxito: "${nombreLimpio}" (${formatMoney(totalesFormulario.montoBruto)}).`);
                        setFormNombreCliente("");
                        setFormMonto("");
                        setFormDescuento("0");
                        if (modalidadCredito === "GRUPAL") {
                            setGrupoIntegrantes([
                                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                                { nombre: "", tipoCliente: "CN", monto: "", descuento: "0" }
                            ]);
                        }
                        cargarDatosServidor(session.token);
                    } else {
                        alert("⚠️ " + (result.message || "No se pudo guardar el registro."));
                    }
                } catch (err) {
                    alert("⚠️ Error de red al guardar en el servidor.");
                } finally {
                    setSavingMov(false);
                }
            };

            const handleRegistrarDesembolso = (e) => { e.preventDefault(); guardarOperacionEnServidor(null); };
            const handleRegistrarEtapaPipeline = (e) => { e.preventDefault(); guardarOperacionEnServidor(etapaRegistrarForm); };

            /**
             * Permite mover un expediente entre etapas ("POR_PRESENTAR" -> "POR_APROBAR" -> "EN_CAJA") o pasarlo a DESEMBOLSADO OFICIAL
             */
            const handleMoverEtapaOEjecutarDesembolso = async (exp, nuevaEtapa = null) => {
                if (!nuevaEtapa && !puedeDesembolsar) {
                    alert("⛔ Solo Caja o Gerencia pueden ejecutar el desembolso final.");
                    return;
                }
                const nombreLimpio = limpiarNombreExpediente(exp.cliente);
                const textoDestino = !nuevaEtapa
                    ? "DESEMBOLSADO OFICIAL EN BÓVEDA"
                    : nuevaEtapa === "EN_CAJA"
                        ? "EN CAJA (LISTO POR DESEMBOLSAR)"
                        : "PENDIENTE POR APROBAR";

                if (!confirm(`🔄 ¿Confirmas pasar a "${nombreLimpio}" (${formatMoney(exp.monto)}) al estado: ${textoDestino}?`)) return;

                const nombreGuardar = !nuevaEtapa ? nombreLimpio : `${construirPrefijoEtapa(nuevaEtapa)} ${nombreLimpio}`;

                setLoadingData(true);
                try {
                    const payloadNuevo = {
                        sede: exp.sede, formato: "DESEMBOLSO",
                        mesRegistro: exp.mesRegistro || formMes,
                        diaSistema: parseInt(exp.diaSistema, 10) || new Date().getDate(),
                        asesor: exp.asesor, modalidad: exp.modalidad || "INDIVIDUAL",
                        nombreCliente: nombreGuardar, tipoCliente: exp.tipoCliente || "CR",
                        cantidadCN: parseInt(exp.cantidadCN, 10) || 0,
                        monto: parseNum(exp.monto), montoDescuento: parseNum(exp.montoDescuento),
                        frecuencia: parseInt(exp.frecuencia, 10) || 14,
                        nroCuotas: parseInt(exp.nroCuotas, 10) || 8,
                        tasaTEM: parseNum(exp.tasaTEM) || 21,
                        diasGracia: parseInt(exp.diasGracia, 10) || 0,
                        fechaDesembolsoISO: exp.fechaDesembolsoISO || exp.fechaISO || getTodayISO(),
                        integrantes: Array.isArray(exp.integrantes) ? exp.integrantes : []
                    };

                    const resReg = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "registrarMovimiento", token: session.token, data: payloadNuevo })
                    });
                    const dataReg = await resReg.json();

                    if (dataReg.status === "ok") {
                        await fetch(GAS_DESEMBOLSOS_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify({ action: "eliminarMovimiento", token: session.token, sede: exp.sede, idRegistro: exp.idRegistro, rowNumber: exp.rowNumber })
                        });
                        alert(`✅ "${nombreLimpio}" actualizado a: ${textoDestino}.`);
                        cargarDatosServidor(session.token);
                    }
                } catch (e) {
                    alert("⚠️ Error al actualizar el estado del expediente.");
                } finally {
                    setLoadingData(false);
                }
            };

            const handleEliminarRegistro = async (mov, esExpCaja = false) => {
                if (!puedeVerDetalleAvanzado && !(esExpCaja && puedeRegistrarProyeccion)) return;
                const nomMostrar = limpiarNombreExpediente(mov.cliente);
                if (!confirm(`⚠️ ¿Estás seguro de retirar/anular "${nomMostrar}" por ${formatMoney(mov.monto)} en ${mov.sede}?`)) return;
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "eliminarMovimiento", token: session.token, sede: mov.sede, idRegistro: mov.idRegistro, rowNumber: mov.rowNumber })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === "ok") cargarDatosServidor(session.token);
                } catch (e) {
                    alert("Error al anular registro.");
                }
            };

            const handleCrearNuevaSede = async (e) => {
                e.preventDefault();
                if (!nuevaSedeNombre.trim()) return;
                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "crearSede", token: session.token, nombreSede: nuevaSedeNombre.trim().toUpperCase(), metaOficina: parseNum(nuevaSedeMeta) })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === "ok") { setNuevaSedeNombre(""); cargarDatosServidor(session.token); }
                } catch (e) { alert("Error al crear sede."); } finally { setLoadingData(false); }
            };

            const handleGuardarMetaMensual = async (e) => {
                e.preventDefault();
                const sedeDestino = isGerente ? metaSedeSelect : userSede;
                const nombreBase = metaTipoSelect === "OFICINA" ? "__OFICINA__" : formatearNombreCorto(metaAsesorNombre);
                if (!nombreBase) { alert("Selecciona el asesor oficial."); return; }

                const claveAsesorMes = metaMesSelect === "TODOS" ? nombreBase : `${nombreBase}::${metaMesSelect}`;
                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "guardarMetaAsesor", token: session.token, sede: sedeDestino, asesor: claveAsesorMes, meta: parseNum(metaAsesorMonto), estado: "ACTIVO" })
                    });
                    const data = await res.json();
                    if (data.status === "ok") {
                        alert(`✅ Meta de ${nombreBase} (${metaMesSelect}) guardada en ${formatMoney(metaAsesorMonto)}.`);
                        if (metaTipoSelect === "ASESOR") setMetaAsesorNombre("");
                        cargarDatosServidor(session.token);
                    }
                } catch (e) { alert("Error al actualizar meta."); } finally { setLoadingData(false); }
            };

            const obtenerMetaOficinaPorMes = React.useCallback((nombreSede, mesConsulta) => {
                const sClean = String(nombreSede || "").trim().toUpperCase();
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaOficinaMes = metasParseadas.find(x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === mClean);
                if (metaOficinaMes && metaOficinaMes.meta > 0) return metaOficinaMes.meta;

                const metaOficinaGral = metasParseadas.find(x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === "TODOS");
                if (metaOficinaGral && metaOficinaGral.meta > 0) return metaOficinaGral.meta;

                return METAS_OFICINA_POR_DEFECTO[sClean] || 100000;
            }, [metasAsesores]);

            const obtenerMetaAsesorPorMes = React.useCallback((nombreSede, nombreCortoAsesor, mesConsulta) => {
                const sClean = String(nombreSede || "").trim().toUpperCase();
                const aCorto = formatearNombreCorto(nombreCortoAsesor);
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaEspecificaMes = metasParseadas.find(x => x.sede === sClean && x.asesor === aCorto && x.mes === mClean);
                if (metaEspecificaMes && metaEspecificaMes.meta > 0) return metaEspecificaMes.meta;

                const metaGeneral = metasParseadas.find(x => x.sede === sClean && x.asesor === aCorto && x.mes === "TODOS");
                if (metaGeneral && metaGeneral.meta > 0) return metaGeneral.meta;

                const usuOficial = listaAsesoresOficiales.find(u => u.nombreCorto === aCorto);
                return usuOficial?.metaBase || 45000;
            }, [metasAsesores, listaAsesoresOficiales]);

            const nombresCortosEnVistaSet = React.useMemo(() => {
                return new Set(asesoresOficialesVista.map(a => a.nombreCorto));
            }, [asesoresOficialesVista]);

            const filtrarListaOperaciones = React.useCallback((lista) => {
                return lista.filter(m => {
                    if (!nombresCortosEnVistaSet.has(m.asesor)) return false;
                    if (filtroMes !== "TODOS" && m.mesRegistro !== filtroMes) return false;
                    if (filtroDia !== "TODOS" && Number(m.diaSistema) !== Number(filtroDia)) return false;

                    const fComparar = m.fechaDesembolsoISO || m.fechaISO || "";
                    if (filtroDesde && fComparar && fComparar < filtroDesde) return false;
                    if (filtroHasta && fComparar && fComparar > filtroHasta) return false;

                    if (filtroModalidad !== "TODAS" && (m.modalidad || "INDIVIDUAL") !== filtroModalidad) return false;

                    if (busquedaCliente.trim()) {
                        const q = busquedaCliente.toLowerCase();
                        const matchTitular = String(m.cliente || "").toLowerCase().includes(q);
                        const matchAsesor = String(m.asesor || "").toLowerCase().includes(q);
                        const matchMiembro = Array.isArray(m.integrantes) && m.integrantes.some(i => String(i.nombre || "").toLowerCase().includes(q));
                        if (!matchTitular && !matchAsesor && !matchMiembro) return false;
                    }
                    return true;
                });
            }, [nombresCortosEnVistaSet, filtroMes, filtroDia, filtroDesde, filtroHasta, filtroModalidad, busquedaCliente]);

            const movimientosFiltrados = React.useMemo(() => filtrarListaOperaciones(movimientos), [movimientos, filtrarListaOperaciones]);
            const expedientesFiltrados = React.useMemo(() => filtrarListaOperaciones(expedientesCaja), [expedientesCaja, filtrarListaOperaciones]);

            const resumenAnalitico = React.useMemo(() => {
                const desembolsos = movimientosFiltrados;
                const enPipeline = expedientesFiltrados;
                const sedeActiva = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
                const mesBaseComp = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;

                const mapaAsesores = {};

                asesoresOficialesVista.forEach(u => {
                    const key = `${u.sedePrincipal}__${u.nombreCorto}`;
                    mapaAsesores[key] = {
                        key,
                        sede: u.sedePrincipal,
                        asesor: u.nombreCorto,
                        usuarioCompleto: u.usuarioOriginal,
                        area: u.area,
                        equipo: u.equipo,
                        jefeAsignado: u.jefeAsignado,
                        meta: obtenerMetaAsesorPorMes(u.sedePrincipal, u.nombreCorto, mesBaseComp),
                        desembolsado: 0, cn: 0, descuento: 0, neto: 0, operaciones: 0, grupales: 0,
                        enCajaBruto: 0, enCajaDesc: 0, enCajaNeto: 0, enCajaCN: 0, enCajaOps: 0,
                        porAprobarBruto: 0, porAprobarNeto: 0, porAprobarCN: 0, porAprobarOps: 0,
                        porPresentarBruto: 0, porPresentarNeto: 0, porPresentarCN: 0, porPresentarOps: 0,
                        creditos: [], expedientes: []
                    };
                });

                desembolsos.forEach(d => {
                    const key = `${d.sede}__${d.asesor}`;
                    const item = mapaAsesores[key];
                    if (!item) return;
                    item.desembolsado += parseNum(d.monto);
                    item.cn += (parseInt(d.cantidadCN, 10) || 0);
                    item.descuento += parseNum(d.montoDescuento);
                    item.neto += Math.max(0, parseNum(d.monto) - parseNum(d.montoDescuento));
                    item.operaciones += 1;
                    if (d.modalidad === "GRUPAL") item.grupales += 1;
                    item.creditos.push(d);
                });

                let cajaBruto = 0, cajaDescuento = 0, cajaNeto = 0, cajaCN = 0, cajaOps = 0;
                let porAprobarBruto = 0, porAprobarDescuento = 0, porAprobarNeto = 0, porAprobarCN = 0, porAprobarOps = 0;
                let porPresentarBruto = 0, porPresentarDescuento = 0, porPresentarNeto = 0, porPresentarCN = 0, porPresentarOps = 0;

                enPipeline.forEach(exp => {
                    const key = `${exp.sede}__${exp.asesor}`;
                    const item = mapaAsesores[key];
                    if (!item) return;
                    const mb = parseNum(exp.monto);
                    const md = parseNum(exp.montoDescuento);
                    const mn = Math.max(0, mb - md);
                    const mcn = parseInt(exp.cantidadCN, 10) || 0;
                    const etapa = exp.etapaPipeline || obtenerEtapaPipeline(exp) || "EN_CAJA";

                    if (etapa === "POR_PRESENTAR") {
                        item.porPresentarBruto += mb;
                        item.porPresentarNeto += mn;
                        item.porPresentarCN += mcn;
                        item.porPresentarOps += 1;
                        porPresentarBruto += mb;
                        porPresentarDescuento += md;
                        porPresentarNeto += mn;
                        porPresentarCN += mcn;
                        porPresentarOps += 1;
                    } else if (etapa === "POR_APROBAR") {
                        item.porAprobarBruto += mb;
                        item.porAprobarNeto += mn;
                        item.porAprobarCN += mcn;
                        item.porAprobarOps += 1;
                        porAprobarBruto += mb;
                        porAprobarDescuento += md;
                        porAprobarNeto += mn;
                        porAprobarCN += mcn;
                        porAprobarOps += 1;
                    } else {
                        item.enCajaBruto += mb;
                        item.enCajaDesc += md;
                        item.enCajaNeto += mn;
                        item.enCajaCN += mcn;
                        item.enCajaOps += 1;
                        cajaBruto += mb;
                        cajaDescuento += md;
                        cajaNeto += mn;
                        cajaCN += mcn;
                        cajaOps += 1;
                    }
                    item.expedientes.push(exp);
                });

                const haySubfiltro = filtroEquipo !== "TODOS" || filtroJefeAsignado !== "TODOS" || filtroArea !== "TODAS";
                const metaOficinaTotal = haySubfiltro
                    ? Object.values(mapaAsesores).reduce((acc, a) => acc + a.meta, 0)
                    : sedesCatalogo
                        .filter(s => {
                            if (isGerente) return sedeActiva === "TODAS" || s.nombre === sedeActiva;
                            if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre)) && (sedeActiva === "TODAS" || s.nombre === sedeActiva);
                            return s.nombre === userSede;
                        })
                        .reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, mesBaseComp), 0) || 300000;

                const totalBruto = desembolsos.reduce((acc, d) => acc + parseNum(d.monto), 0);
                const totalDescuento = desembolsos.reduce((acc, d) => acc + parseNum(d.montoDescuento), 0);
                const totalNeto = Math.max(0, totalBruto - totalDescuento);
                const totalCN = desembolsos.reduce((acc, d) => acc + (parseInt(d.cantidadCN, 10) || 0), 0);
                const totalGrupales = desembolsos.filter(d => d.modalidad === "GRUPAL").length;

                // Proyectado solo con lo que está listo en Caja vs Proyectado Integral (Real + En Caja + Por Aprobar + Por Presentar)
                const proyectadoBruto = totalBruto + cajaBruto;
                const proyectadoIntegralBruto = totalBruto + cajaBruto + porAprobarBruto + porPresentarBruto;
                const proyectadoIntegralNeto = totalNeto + cajaNeto + porAprobarNeto + porPresentarNeto;
                const proyectadoIntegralCN = totalCN + cajaCN + porAprobarCN + porPresentarCN;

                const avanceOficinaPct = metaOficinaTotal > 0 ? (totalBruto / metaOficinaTotal) * 100 : 0;
                const avanceProyectadoPct = metaOficinaTotal > 0 ? (proyectadoBruto / metaOficinaTotal) * 100 : 0;
                const avanceProyectadoIntegralPct = metaOficinaTotal > 0 ? (proyectadoIntegralBruto / metaOficinaTotal) * 100 : 0;
                const pctDescuentoGlobal = totalBruto > 0 ? (totalDescuento / totalBruto) * 100 : 0;

                const tablaAsesores = Object.values(mapaAsesores).map(a => {
                    const movsMesComp = movimientos.filter(m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesCompResumen);
                    const desembolsadoMesComp = movsMesComp.reduce((s, x) => s + parseNum(x.monto), 0);
                    const metaMesComp = obtenerMetaAsesorPorMes(a.sede, a.asesor, mesCompResumen);
                    const avancePctMesComp = metaMesComp > 0 ? (desembolsadoMesComp / metaMesComp) * 100 : 0;

                    const avancePct = a.meta > 0 ? (a.desembolsado / a.meta) * 100 : 0;
                    const proyectadoCajaAsesor = a.desembolsado + a.enCajaBruto;
                    const proyectadoTotalAsesor = a.desembolsado + a.enCajaBruto + a.porAprobarBruto + a.porPresentarBruto;
                    const avanceProyectadoAsesorPct = a.meta > 0 ? (proyectadoTotalAsesor / a.meta) * 100 : 0;
                    const porcentualOficina = totalBruto > 0 ? (a.descuento / totalBruto) * 100 : 0;
                    const faltaMeta = Math.max(0, a.meta - a.desembolsado);

                    return {
                        ...a, avancePct, proyectadoCajaAsesor, proyectadoTotalAsesor, avanceProyectadoAsesorPct,
                        porcentualOficina, faltaMeta, desembolsadoMesComp, metaMesComp, avancePctMesComp
                    };
                }).sort((a, b) => b.desembolsado - a.desembolsado);

                const nombresAsesoresUnicos = Array.from(new Set(Object.values(mapaAsesores).map(a => a.asesor)));

                const evolucionDiariaFilas = [];
                const totalesDesembolsoPorAsesor = {};
                const totalesDescuentoPorAsesor = {};
                nombresAsesoresUnicos.forEach(nom => {
                    totalesDesembolsoPorAsesor[nom] = 0;
                    totalesDescuentoPorAsesor[nom] = 0;
                });

                let granTotalDesembolsos = 0, granTotalDescuentos = 0, granTotalNeto = 0;

                for (let dia = 1; dia <= 31; dia++) {
                    const desembolsosPorAsesorDia = {};
                    const descuentosPorAsesorDia = {};
                    nombresAsesoresUnicos.forEach(nom => {
                        desembolsosPorAsesorDia[nom] = 0;
                        descuentosPorAsesorDia[nom] = 0;
                    });

                    let totalDesDia = 0, totalDescDia = 0;

                    desembolsos.filter(d => Number(d.diaSistema) === dia).forEach(d => {
                        const mBruto = parseNum(d.monto);
                        const mDesc = parseNum(d.montoDescuento);
                        const ase = d.asesor;
                        if (ase && desembolsosPorAsesorDia[ase] !== undefined) {
                            desembolsosPorAsesorDia[ase] += mBruto;
                            descuentosPorAsesorDia[ase] += mDesc;
                            totalesDesembolsoPorAsesor[ase] += mBruto;
                            totalesDescuentoPorAsesor[ase] += mDesc;
                        }
                        totalDesDia += mBruto;
                        totalDescDia += mDesc;
                    });

                    const netoDia = Math.max(0, totalDesDia - totalDescDia);
                    granTotalDesembolsos += totalDesDia;
                    granTotalDescuentos += totalDescDia;
                    granTotalNeto += netoDia;

                    evolucionDiariaFilas.push({ dia, desembolsosPorAsesorDia, totalDesDia, descuentosPorAsesorDia, totalDescDia, netoDia });
                }

                const comparativoSedes = sedesCatalogo
                    .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                    .map(s => {
                        const metaS = obtenerMetaOficinaPorMes(s.nombre, mesBaseComp);
                        const desSede = desembolsos.filter(d => d.sede === s.nombre);
                        const expSede = enPipeline.filter(d => d.sede === s.nombre);
                        const brutoS = desSede.reduce((a, b) => a + parseNum(b.monto), 0);
                        const descS = desSede.reduce((a, b) => a + parseNum(b.montoDescuento), 0);
                        const cnS = desSede.reduce((a, b) => a + (parseInt(b.cantidadCN, 10) || 0), 0);
                        const pipelineS = expSede.reduce((a, b) => a + parseNum(b.monto), 0);
                        return {
                            sede: s.nombre, meta: metaS, bruto: brutoS, cajaBruto: pipelineS,
                            proyectado: brutoS + pipelineS,
                            avancePct: metaS > 0 ? (brutoS / metaS) * 100 : 0,
                            avanceProyPct: metaS > 0 ? ((brutoS + pipelineS) / metaS) * 100 : 0,
                            cn: cnS, descuento: descS, neto: Math.max(0, brutoS - descS), operaciones: desSede.length
                        };
                    });

                return {
                    metaOficinaTotal, totalBruto, totalDescuento, totalNeto, totalCN, totalGrupales,
                    cajaBruto, cajaDescuento, cajaNeto, cajaCN, cajaOps,
                    porAprobarBruto, porAprobarDescuento, porAprobarNeto, porAprobarCN, porAprobarOps,
                    porPresentarBruto, porPresentarDescuento, porPresentarNeto, porPresentarCN, porPresentarOps,
                    proyectadoBruto, proyectadoIntegralBruto, proyectadoIntegralNeto, proyectadoIntegralCN,
                    avanceOficinaPct, avanceProyectadoPct, avanceProyectadoIntegralPct, pctDescuentoGlobal,
                    tablaAsesores, nombresAsesoresUnicos, evolucionDiariaFilas,
                    totalesDesembolsoPorAsesor, totalesDescuentoPorAsesor,
                    granTotalDesembolsos, granTotalDescuentos, granTotalNeto, comparativoSedes
                };
            }, [movimientosFiltrados, expedientesFiltrados, movimientos, asesoresOficialesVista, sedesCatalogo, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, filtroEquipo, filtroJefeAsignado, filtroArea, filtroMes, mesCompResumen, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const itemsColumnasEnCuadros = React.useMemo(() => {
                return resumenAnalitico.tablaAsesores.map(a => ({
                    concepto: a.asesor,
                    actualPct: a.avancePct,
                    anteriorPct: a.avancePctMesComp,
                    actualMonto: a.desembolsado,
                    anteriorMonto: a.desembolsadoMesComp,
                    meta: a.meta
                }));
            }, [resumenAnalitico.tablaAsesores]);

            const listaRadarCreditos = React.useMemo(() => {
                return movimientosFiltrados
                    .filter(m => parseInt(m.nroCuotas, 10) > 0 && parseInt(m.frecuencia, 10) > 0)
                    .map(m => {
                        const sim = simularCreditoCrediban({
                            monto: m.monto, frecuencia: m.frecuencia, nroCuotas: m.nroCuotas,
                            tasaTEM: m.tasaTEM, diasGracia: m.diasGracia,
                            fechaDesembolsoISO: m.fechaDesembolsoISO || m.fechaISO
                        });
                        return { ...m, sim };
                    })
                    .filter(m => m.sim.activo);
            }, [movimientosFiltrados]);

            const handleExportarReportePDF = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const sedeTit = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
                const logoB64 = await obtenerLogoCredibanBase64();

                doc.setFillColor(27, 67, 50);
                doc.rect(0, 0, 297, 24, 'F');
                if (logoB64) doc.addImage(logoB64, 'PNG', 10, 2.5, 14, 19);
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.text(`CREDIBAN PERÚ - REPORTE DE AVANCE Y PROYECCIÓN INTEGRAL (${sedeTit})`, 28, 11);
                doc.setFontSize(9);
                doc.text(`empieza a construir tus sueños  |  Mes: ${filtroMes}  |  Generado por: ${session.usuario.nombre} (${userRole})`, 28, 18);

                doc.setTextColor(30, 41, 59);
