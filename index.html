            const obtenerMetaOficinaPorMes = React.useCallback((nombreSede, mesConsulta) => {
                const sClean = quitarTildes(nombreSede || "").trim().toUpperCase();
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaOficinaMes = metasParseadas.find(x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === mClean);
                if (metaOficinaMes && metaOficinaMes.meta > 0) return metaOficinaMes.meta;

                const metaOficinaGral = metasParseadas.find(x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === "TODOS");
                if (metaOficinaGral && metaOficinaGral.meta > 0) return metaOficinaGral.meta;

                return METAS_OFICINA_POR_DEFECTO[sClean] || 100000;
            }, [metasAsesores]);

            const obtenerMetaAsesorPorMes = React.useCallback((nombreSede, nombreCortoAsesor, mesConsulta) => {
                const sClean = quitarTildes(nombreSede || "").trim().toUpperCase();
                const aCorto = formatearNombreCorto(nombreCortoAsesor);
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaEspecificaMes = metasParseadas.find(x => x.sede === sClean && x.asesor === aCorto && x.mes === mClean);
                if (metaEspecificaMes && metaEspecificaMes.meta > 0) return metaEspecificaMes.meta;

                const metaGeneral = metasParseadas.find(x => x.sede === sClean && x.asesor === aCorto && x.mes === "TODOS");
                if (metaGeneral && metaGeneral.meta > 0) return metaGeneral.meta;

                const usuOficial = listaAsesoresOficiales.find(u => u.nombreCorto === aCorto);
                return usuOficial?.metaBase || 45000;
            }, [metasAsesores, listaAsesoresOficiales]);

            const nombresCortosEnVistaSet = React.useMemo(() => {
                return new Set(asesoresOficialesVista.map(a => a.nombreCorto));
            }, [asesoresOficialesVista]);

            const filtrarListaOperaciones = React.useCallback((lista) => {
                return lista.filter(m => {
                    if (!nombresCortosEnVistaSet.has(m.asesor)) return false;
                    if (filtroMes !== "TODOS" && m.mesRegistro !== filtroMes) return false;
                    if (filtroDia !== "TODOS" && Number(m.diaSistema) !== Number(filtroDia)) return false;

                    const fComparar = m.fechaDesembolsoISO || m.fechaISO || "";
                    if (filtroDesde && fComparar && fComparar < filtroDesde) return false;
                    if (filtroHasta && fComparar && fComparar > filtroHasta) return false;

                    if (filtroModalidad !== "TODAS" && (m.modalidad || "INDIVIDUAL") !== filtroModalidad) return false;

                    if (busquedaCliente.trim()) {
                        const q = busquedaCliente.toLowerCase();
                        const matchTitular = String(m.cliente || "").toLowerCase().includes(q);
                        const matchAsesor = String(m.asesor || "").toLowerCase().includes(q);
                        const matchMiembro = Array.isArray(m.integrantes) && m.integrantes.some(i => String(i.nombre || "").toLowerCase().includes(q));
                        if (!matchTitular && !matchAsesor && !matchMiembro) return false;
                    }
                    return true;
                });
            }, [nombresCortosEnVistaSet, filtroMes, filtroDia, filtroDesde, filtroHasta, filtroModalidad, busquedaCliente]);

            const movimientosFiltrados = React.useMemo(() => filtrarListaOperaciones(movimientos), [movimientos, filtrarListaOperaciones]);
            const expedientesFiltrados = React.useMemo(() => filtrarListaOperaciones(expedientesCaja), [expedientesCaja, filtrarListaOperaciones]);

            const resumenAnalitico = React.useMemo(() => {
                const desembolsos = movimientosFiltrados;
                const enPipeline = expedientesFiltrados;
                const sedeActiva = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
                const mesBaseComp = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;

                const mapaAsesores = {};

                asesoresOficialesVista.forEach(u => {
                    const key = `${u.sedePrincipal}__${u.nombreCorto}`;
                    mapaAsesores[key] = {
                        key,
                        sede: u.sedePrincipal,
                        asesor: u.nombreCorto,
                        usuarioCompleto: u.usuarioOriginal,
                        area: u.area,
                        equipo: u.equipo,
                        jefeAsignado: u.jefeAsignado,
                        meta: obtenerMetaAsesorPorMes(u.sedePrincipal, u.nombreCorto, mesBaseComp),
                        desembolsado: 0, cn: 0, descuento: 0, neto: 0, operaciones: 0, grupales: 0,
                        enCajaBruto: 0, enCajaDesc: 0, enCajaNeto: 0, enCajaCN: 0, enCajaOps: 0,
                        porAprobarBruto: 0, porAprobarNeto: 0, porAprobarCN: 0, porAprobarOps: 0,
                        porPresentarBruto: 0, porPresentarNeto: 0, porPresentarCN: 0, porPresentarOps: 0,
                        creditos: [], expedientes: []
                    };
                });

                desembolsos.forEach(d => {
                    const key = `${d.sede}__${d.asesor}`;
                    const item = mapaAsesores[key];
                    if (!item) return;
                    item.desembolsado += parseNum(d.monto);
                    item.cn += (parseInt(d.cantidadCN, 10) || 0);
                    item.descuento += parseNum(d.montoDescuento);
                    item.neto += Math.max(0, parseNum(d.monto) - parseNum(d.montoDescuento));
                    item.operaciones += 1;
                    if (d.modalidad === "GRUPAL") item.grupales += 1;
                    item.creditos.push(d);
                });

                let cajaBruto = 0, cajaDescuento = 0, cajaNeto = 0, cajaCN = 0, cajaOps = 0;
                let porAprobarBruto = 0, porAprobarDescuento = 0, porAprobarNeto = 0, porAprobarCN = 0, porAprobarOps = 0;
                let porPresentarBruto = 0, porPresentarDescuento = 0, porPresentarNeto = 0, porPresentarCN = 0, porPresentarOps = 0;

                enPipeline.forEach(exp => {
                    const key = `${exp.sede}__${exp.asesor}`;
                    const item = mapaAsesores[key];
                    if (!item) return;
                    const mb = parseNum(exp.monto);
                    const md = parseNum(exp.montoDescuento);
                    const mn = Math.max(0, mb - md);
                    const mcn = parseInt(exp.cantidadCN, 10) || 0;
                    const etapa = exp.etapaPipeline || obtenerEtapaPipeline(exp) || "EN_CAJA";

                    if (etapa === "POR_PRESENTAR") {
                        item.porPresentarBruto += mb;
                        item.porPresentarNeto += mn;
                        item.porPresentarCN += mcn;
                        item.porPresentarOps += 1;
                        porPresentarBruto += mb;
                        porPresentarDescuento += md;
                        porPresentarNeto += mn;
                        porPresentarCN += mcn;
                        porPresentarOps += 1;
                    } else if (etapa === "POR_APROBAR") {
                        item.porAprobarBruto += mb;
                        item.porAprobarNeto += mn;
                        item.porAprobarCN += mcn;
                        item.porAprobarOps += 1;
                        porAprobarBruto += mb;
                        porAprobarDescuento += md;
                        porAprobarNeto += mn;
                        porAprobarCN += mcn;
                        porAprobarOps += 1;
                    } else {
                        item.enCajaBruto += mb;
                        item.enCajaDesc += md;
                        item.enCajaNeto += mn;
                        item.enCajaCN += mcn;
                        item.enCajaOps += 1;
                        cajaBruto += mb;
                        cajaDescuento += md;
                        cajaNeto += mn;
                        cajaCN += mcn;
                        cajaOps += 1;
                    }
                    item.expedientes.push(exp);
                });

                const haySubfiltro = filtroEquipo !== "TODOS" || filtroJefeAsignado !== "TODOS" || filtroArea !== "TODAS";
                const metaOficinaTotal = haySubfiltro
                    ? Object.values(mapaAsesores).reduce((acc, a) => acc + a.meta, 0)
                    : sedesCatalogo
                        .filter(s => {
                            if (isGerente) return sedeActiva === "TODAS" || s.nombre === sedeActiva;
                            if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre)) && (sedeActiva === "TODAS" || s.nombre === sedeActiva);
                            return s.nombre === userSede;
                        })
                        .reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, mesBaseComp), 0) || 300000;

                const totalBruto = desembolsos.reduce((acc, d) => acc + parseNum(d.monto), 0);
                const totalDescuento = desembolsos.reduce((acc, d) => acc + parseNum(d.montoDescuento), 0);
                const totalNeto = Math.max(0, totalBruto - totalDescuento);
                const totalCN = desembolsos.reduce((acc, d) => acc + (parseInt(d.cantidadCN, 10) || 0), 0);
                const totalGrupales = desembolsos.filter(d => d.modalidad === "GRUPAL").length;

                const proyectadoBruto = totalBruto + cajaBruto;
                const proyectadoIntegralBruto = totalBruto + cajaBruto + porAprobarBruto + porPresentarBruto;
                const proyectadoIntegralNeto = totalNeto + cajaNeto + porAprobarNeto + porPresentarNeto;
                const proyectadoIntegralCN = totalCN + cajaCN + porAprobarCN + porPresentarCN;

                const avanceOficinaPct = metaOficinaTotal > 0 ? (totalBruto / metaOficinaTotal) * 100 : 0;
                const avanceProyectadoPct = metaOficinaTotal > 0 ? (proyectadoBruto / metaOficinaTotal) * 100 : 0;
                const avanceProyectadoIntegralPct = metaOficinaTotal > 0 ? (proyectadoIntegralBruto / metaOficinaTotal) * 100 : 0;
                const pctDescuentoGlobal = totalBruto > 0 ? (totalDescuento / totalBruto) * 100 : 0;

                const tablaAsesores = Object.values(mapaAsesores).map(a => {
                    const movsMesComp = movimientos.filter(m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesCompResumen);
                    const desembolsadoMesComp = movsMesComp.reduce((s, x) => s + parseNum(x.monto), 0);
                    const metaMesComp = obtenerMetaAsesorPorMes(a.sede, a.asesor, mesCompResumen);
                    const avancePctMesComp = metaMesComp > 0 ? (desembolsadoMesComp / metaMesComp) * 100 : 0;

                    const avancePct = a.meta > 0 ? (a.desembolsado / a.meta) * 100 : 0;
                    const proyectadoCajaAsesor = a.desembolsado + a.enCajaBruto;
                    const proyectadoTotalAsesor = a.desembolsado + a.enCajaBruto + a.porAprobarBruto + a.porPresentarBruto;
                    const avanceProyectadoAsesorPct = a.meta > 0 ? (proyectadoTotalAsesor / a.meta) * 100 : 0;
                    const porcentualOficina = totalBruto > 0 ? (a.descuento / totalBruto) * 100 : 0;
                    const faltaMeta = Math.max(0, a.meta - a.desembolsado);

                    return {
                        ...a, avancePct, proyectadoCajaAsesor, proyectadoTotalAsesor, avanceProyectadoAsesorPct,
                        porcentualOficina, faltaMeta, desembolsadoMesComp, metaMesComp, avancePctMesComp
                    };
                }).sort((a, b) => b.desembolsado - a.desembolsado);

                const nombresAsesoresUnicos = Array.from(new Set(Object.values(mapaAsesores).map(a => a.asesor)));

                const evolucionDiariaFilas = [];
                const totalesDesembolsoPorAsesor = {};
                const totalesDescuentoPorAsesor = {};
                nombresAsesoresUnicos.forEach(nom => {
                    totalesDesembolsoPorAsesor[nom] = 0;
                    totalesDescuentoPorAsesor[nom] = 0;
                });

                let granTotalDesembolsos = 0, granTotalDescuentos = 0, granTotalNeto = 0;

                for (let dia = 1; dia <= 31; dia++) {
                    const desembolsosPorAsesorDia = {};
                    const descuentosPorAsesorDia = {};
                    nombresAsesoresUnicos.forEach(nom => {
                        desembolsosPorAsesorDia[nom] = 0;
                        descuentosPorAsesorDia[nom] = 0;
                    });

                    let totalDesDia = 0, totalDescDia = 0;

                    desembolsos.filter(d => Number(d.diaSistema) === dia).forEach(d => {
                        const mBruto = parseNum(d.monto);
                        const mDesc = parseNum(d.montoDescuento);
                        const ase = d.asesor;
                        if (ase && desembolsosPorAsesorDia[ase] !== undefined) {
                            desembolsosPorAsesorDia[ase] += mBruto;
                            descuentosPorAsesorDia[ase] += mDesc;
                            totalesDesembolsoPorAsesor[ase] += mBruto;
                            totalesDescuentoPorAsesor[ase] += mDesc;
                        }
                        totalDesDia += mBruto;
                        totalDescDia += mDesc;
                    });

                    const netoDia = Math.max(0, totalDesDia - totalDescDia);
                    granTotalDesembolsos += totalDesDia;
                    granTotalDescuentos += totalDescDia;
                    granTotalNeto += netoDia;

                    evolucionDiariaFilas.push({ dia, desembolsosPorAsesorDia, totalDesDia, descuentosPorAsesorDia, totalDescDia, netoDia });
                }

                const comparativoSedes = sedesCatalogo
                    .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                    .map(s => {
                        const metaS = obtenerMetaOficinaPorMes(s.nombre, mesBaseComp);
                        const desSede = desembolsos.filter(d => d.sede === s.nombre);
                        const expSede = enPipeline.filter(d => d.sede === s.nombre);
                        const brutoS = desSede.reduce((a, b) => a + parseNum(b.monto), 0);
                        const descS = desSede.reduce((a, b) => a + parseNum(b.montoDescuento), 0);
                        const cnS = desSede.reduce((a, b) => a + (parseInt(b.cantidadCN, 10) || 0), 0);
                        const pipelineS = expSede.reduce((a, b) => a + parseNum(b.monto), 0);
                        return {
                            sede: s.nombre, meta: metaS, bruto: brutoS, cajaBruto: pipelineS,
                            proyectado: brutoS + pipelineS,
                            avancePct: metaS > 0 ? (brutoS / metaS) * 100 : 0,
                            avanceProyPct: metaS > 0 ? ((brutoS + pipelineS) / metaS) * 100 : 0,
                            cn: cnS, descuento: descS, neto: Math.max(0, brutoS - descS), operaciones: desSede.length
                        };
                    });

                return {
                    metaOficinaTotal, totalBruto, totalDescuento, totalNeto, totalCN, totalGrupales,
                    cajaBruto, cajaDescuento, cajaNeto, cajaCN, cajaOps,
                    porAprobarBruto, porAprobarDescuento, porAprobarNeto, porAprobarCN, porAprobarOps,
                    porPresentarBruto, porPresentarDescuento, porPresentarNeto, porPresentarCN, porPresentarOps,
                    proyectadoBruto, proyectadoIntegralBruto, proyectadoIntegralNeto, proyectadoIntegralCN,
                    avanceOficinaPct, avanceProyectadoPct, avanceProyectadoIntegralPct, pctDescuentoGlobal,
                    tablaAsesores, nombresAsesoresUnicos, evolucionDiariaFilas,
                    totalesDesembolsoPorAsesor, totalesDescuentoPorAsesor,
                    granTotalDesembolsos, granTotalDescuentos, granTotalNeto, comparativoSedes
                };
            }, [movimientosFiltrados, expedientesFiltrados, movimientos, asesoresOficialesVista, sedesCatalogo, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, filtroEquipo, filtroJefeAsignado, filtroArea, filtroMes, mesCompResumen, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const itemsColumnasEnCuadros = React.useMemo(() => {
                return resumenAnalitico.tablaAsesores.map(a => ({
                    concepto: a.asesor,
                    actualPct: a.avancePct,
                    anteriorPct: a.avancePctMesComp,
                    actualMonto: a.desembolsado,
                    anteriorMonto: a.desembolsadoMesComp,
                    meta: a.meta
                }));
            }, [resumenAnalitico.tablaAsesores]);

            const listaRadarCreditos = React.useMemo(() => {
                return movimientosFiltrados
                    .filter(m => parseInt(m.nroCuotas, 10) > 0 && parseInt(m.frecuencia, 10) > 0)
                    .map(m => {
                        const sim = simularCreditoCrediban({
                            monto: m.monto, frecuencia: m.frecuencia, nroCuotas: m.nroCuotas,
                            tasaTEM: m.tasaTEM, diasGracia: m.diasGracia,
                            fechaDesembolsoISO: m.fechaDesembolsoISO || m.fechaISO

                        return { ...m, sim };
                    })
                    .filter(m => m.sim.activo);
            }, [movimientosFiltrados]);

            const handleExportarReportePDF = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const sedeTit = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
                const logoB64 = await obtenerLogoCredibanBase64();

                doc.setFillColor(27, 67, 50);
                doc.rect(0, 0, 297, 24, 'F');
                if (logoB64) doc.addImage(logoB64, 'PNG', 10, 2.5, 14, 19);
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.text(`CREDIBAN PERÚ - REPORTE DE AVANCE Y PROYECCIÓN INTEGRAL (${sedeTit})`, 28, 11);
                doc.setFontSize(9);
                doc.text(`empieza a construir tus sueños  |  Mes: ${filtroMes}  |  Generado por: ${session.usuario.nombre} (${userRole})`, 28, 18);

                doc.setTextColor(30, 41, 59);
                doc.setFontSize(9);
                doc.text(`Meta (${filtroMes}): ${formatMoney(resumenAnalitico.metaOficinaTotal)} | Desemb. Real: ${formatMoney(resumenAnalitico.totalBruto)} | En Caja: ${formatMoney(resumenAnalitico.cajaBruto)} | Por Aprobar: ${formatMoney(resumenAnalitico.porAprobarBruto)} | Por Presentar: ${formatMoney(resumenAnalitico.porPresentarBruto)} | Total Proy.: ${formatMoney(resumenAnalitico.proyectadoIntegralBruto)}`, 14, 31);

                doc.autoTable({
                    startY: 35,
                    head: [['Sede', 'Asesor', `Meta (${filtroMes})`, 'Desemb. Real', '% Real', 'En Caja', 'Por Aprobar', 'Por Presentar', 'Total Proyectado', '% Proy.']],
                    body: [
                        [
                            sedeTit, 'TOTAL OFICINA',
                            formatMoney(resumenAnalitico.metaOficinaTotal),
                            formatMoney(resumenAnalitico.totalBruto),
                            `${resumenAnalitico.avanceOficinaPct.toFixed(2)}%`,
                            formatMoney(resumenAnalitico.cajaBruto),
                            formatMoney(resumenAnalitico.porAprobarBruto),
                            formatMoney(resumenAnalitico.porPresentarBruto),
                            formatMoney(resumenAnalitico.proyectadoIntegralBruto),
                            `${resumenAnalitico.avanceProyectadoIntegralPct.toFixed(2)}%`
                        ],
                        ...resumenAnalitico.tablaAsesores.map(a => [
                            a.sede, a.asesor, formatMoney(a.meta), formatMoney(a.desembolsado),
                            `${a.avancePct.toFixed(2)}%`, formatMoney(a.enCajaBruto),
                            formatMoney(a.porAprobarBruto), formatMoney(a.porPresentarBruto),
                            formatMoney(a.proyectadoTotalAsesor), `${a.avanceProyectadoAsesorPct.toFixed(2)}%`
                        ])
                    ],
                    theme: 'grid',
                    headStyles: { fillColor: [89, 180, 71], fontSize: 7.5 },
                    styles: { fontSize: 7.5 }
                });

                doc.save(`Reporte_Crediban_${sedeTit}_${filtroMes}.pdf`);
            };

            const handleExportarCSV = () => {
                const headers = ["Estado_Operacion", "Sede", "Fecha", "Cajero", "Dia_Sistema", "Mes", "Modalidad", "Integrantes", "Asesor_Oficial", "Cliente_O_Grupo", "Tipo_Cliente", "Cant_CN", "Monto_Bruto", "Descuento", "Monto_Neto", "Frecuencia_Dias", "Cuotas", "Tasa_TEM"];
                const todos = [
                    ...movimientosFiltrados.map(x => ({ ...x, _estado: "DESEMBOLSADO" })),
                    ...expedientesFiltrados.map(x => ({ ...x, _estado: x.etapaPipeline || "EN_CAJA" }))
                ];
                const rows = todos.map(m => [
                    m._estado, m.sede, m.marcaTemporal, m.cajero, m.diaSistema, m.mesRegistro,
                    m.modalidad || "INDIVIDUAL", m.nroIntegrantes || 1, m.asesor,
                    `"${limpiarNombreExpediente(m.cliente).replace(/"/g, '""')}"`, m.tipoCliente, m.cantidadCN,
                    m.monto, m.montoDescuento, m.montoNeto,
                    m.frecuencia || "", m.nroCuotas || "", m.tasaTEM || ""
                ]);
                const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Base_Crediban_${(isGerente || isJefeZonal) ? selectedSedeVista : userSede}_${filtroMes}.csv`;
                a.click();
            };

            if (!session) {
                return <LoginScreen onLoginSuccess={handleLoginSuccess} catalogoUsuariosOficial={catalogoUsuariosOficial} />;
            }

            const sedeMostrarTitulo = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
            const listaExpedientesVistaTabla = expedientesFiltrados.filter(
                e => filtroEtapaPipeline === "TODAS" || (e.etapaPipeline || "EN_CAJA") === filtroEtapaPipeline
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* BARRA SUPERIOR EJECUTIVA CON EFECTO CRISTAL */}
                    <header className="bg-white/95 backdrop-blur-md border-b border-slate-200/90 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
                            <div className="flex items-center gap-3.5">
                                <CredibanLogo size="md" />
                                <div className="hidden sm:block h-9 w-[1px] bg-slate-200"></div>
                                <div>
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="crediban-header-gradient text-white text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider shadow-sm">
                                            {userRole.replace(/_/g, " ")}
                                        </span>
                                        <span className="bg-emerald-50 text-emerald-900 border border-emerald-200 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">
                                            📍 {isGerente ? "Acceso Nacional" : isJefeZonal ? `Zonas: ${sedesPermitidasUsuario.join(", ")}` : `Agencia: ${userSede}`}
                                        </span>
                                        {filtroEquipo !== "TODOS" && (
                                            <span className="bg-purple-100 text-purple-900 border border-purple-300 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">
                                                👥 {filtroEquipo}
                                            </span>
                                        )}
                                        {filtroJefeAsignado !== "TODOS" && (
                                            <span className="bg-amber-100 text-amber-900 border border-amber-300 text-[10px] font-black px-2 py-0.5 rounded-full uppercase">
                                                👔 {filtroJefeAsignado}
                                            </span>
                                        )}
                                    </div>
                                    <div className="text-xs font-extrabold text-slate-700 mt-1 flex items-center gap-1.5">
                                        <span>👤 {formatearNombreCorto(session.usuario.nombre)}</span>
                                        <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.2 rounded-full">
                                            <span className="w-1.5 h-1.5 rounded-full bg-[#59B447] live-dot"></span>
                                            <span>{syncMsg}</span>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex flex-wrap items-center gap-1.5">
                                <button onClick={() => cargarDatosServidor(session.token)} disabled={loadingData} className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 transition shadow-sm">
                                    🔄 {loadingData ? "Cargando..." : "Actualizar"}
                                </button>
                                {puedeVerDetalleAvanzado && (
                                    <>
                                        <button onClick={handleExportarReportePDF} className="bg-rose-600 hover:bg-rose-700 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs shadow-sm transition">
                                            📄 PDF Avance
                                        </button>
                                        <button onClick={handleExportarCSV} className="bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs shadow-sm transition">
                                            📊 Excel CSV
                                        </button>
                                    </>
                                )}
                                <button onClick={handleLogout} className="bg-slate-900 hover:bg-slate-800 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs shadow-sm transition">
                                    🔒 Salir
                                </button>
                            </div>
                        </div>

                        {(isGerente || (isJefeZonal && sedesPermitidasUsuario.length > 1)) && (
                            <div className="crediban-header-gradient text-white px-4 py-1.5">
                                <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        <span className="text-[11px] font-extrabold uppercase text-emerald-300 mr-1">

                                        </span>
                                        {isGerente && (
                                            <button onClick={() => setSelectedSedeVista("TODAS")} className={`px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${selectedSedeVista === "TODAS" ? "bg-[#59B447] text-white shadow" : "bg-white/10 text-emerald-100 hover:bg-white/20"}`}>
                                                TODAS LAS SEDES ({sedesCatalogo.length})
                                            </button>
                                        )}
                                        {sedesCatalogo
                                            .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                                            .map(s => (
                                                <button key={s.nombre} onClick={() => setSelectedSedeVista(s.nombre)} className={`px-2.5 py-1 rounded-lg text-xs font-extrabold transition ${selectedSedeVista === s.nombre ? "bg-[#59B447] text-white shadow" : "bg-white/10 text-emerald-100 hover:bg-white/20"}`}>
                                                    📍 {s.nombre}

                                    </div>

                                        </button>

                                </div>
                            </div>
                        )}

                        {/* BARRA DE NAVEGACIÓN DE LAS 8 PESTAÑAS (DOCK EJECUTIVO FLEX-WRAP — SIEMPRE VISIBLE EN MONITOR) */}
                        <div className="bg-slate-100/90 border-t border-slate-200 px-4 py-2">
                            <div className="max-w-7xl mx-auto flex flex-wrap items-center gap-1.5">
                                {puedeVerDetalleAvanzado && (
                                    <button onClick={() => setActiveTab("ESTADISTICAS")} className={`px-3.5 py-1.5 rounded-xl text-xs font-black transition ${activeTab === "ESTADISTICAS" ? "crediban-btn-primary text-white" : "bg-white text-slate-700 border border-slate-200/90 hover:bg-emerald-50/60"}`}>
                                        📈 1. Gráficos Estadísticos ({sedeMostrarTitulo})
                                    </button>
                                )}

                                {puedeVerDetalleAvanzado && (
                                    <button onClick={() => setActiveTab("REPORTE_WA")} className={`px-3.5 py-1.5 rounded-xl text-xs font-black transition flex items-center gap-1 ${activeTab === "REPORTE_WA" ? "bg-emerald-800 text-white shadow-md" : "bg-emerald-50 text-emerald-950 border border-emerald-300 hover:bg-emerald-100"}`}>
                                        <span>📲 2. Reporte Diario, Semanal y WhatsApp</span>
                                    </button>
                                )}

                                <button onClick={() => setActiveTab("CUADROS")} className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition ${activeTab === "CUADROS" ? "crediban-btn-primary text-white" : "bg-white text-slate-700 border border-slate-200/90 hover:bg-emerald-50/60"}`}>
                                    📊 3. Resumen Desembolsos y Evolución Diaria
                                </button>

                                <button onClick={() => setActiveTab("EXP_CAJA")} className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 ${activeTab === "EXP_CAJA" ? "bg-amber-500 text-slate-950 shadow-md" : "bg-amber-50 text-amber-900 border border-amber-300 hover:bg-amber-100"}`}>
                                    <span>⏳ 4. En Caja, Por Aprobar y Por Presentar</span>

                                </button>

                                {puedeDesembolsar && (
                                    <button onClick={() => setActiveTab("CAJA")} className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition ${activeTab === "CAJA" ? "crediban-btn-primary text-white" : "bg-white text-slate-700 border border-slate-200/90 hover:bg-emerald-50/60"}`}>
                                        💸 5. Registrar Desembolso ({isGerente ? formSede : userSede})
                                    </button>
                                )}

                                                                <option value="Créditos Individuales">Créditos Individuales</option>
                                                                <option value="Créditos Grupales">Créditos Grupales</option>
                                                                <option value="Caja">Caja</option>
                                                            </select>
                                                        </td>
                                                        <td className="p-2.5 text-center">
                                                            <select
                                                                value={u.equipo}
                                                                onChange={e => handleActualizarOverrideUsuario(u.nombreCorto, "equipo", e.target.value)}
                                                                className="border border-purple-300 rounded-lg px-2 py-1 text-[11px] font-black bg-purple-50 text-purple-950"
                                                            >
                                                                <option value="SIN EQUIPO">SIN EQUIPO</option>
                                                                <option value="TODOS">TODOS (Sede/Zona)</option>
                                                                {LETRAS_EQUIPOS.map(l => <option key={l} value={`EQUIPO ${l}`}>EQUIPO {l}</option>)}
                                                            </select>
                                                        </td>
                                                        <td className="p-2.5">
                                                            <input
                                                                type="text"
                                                                value={u.jefeAsignado}
                                                                onChange={e => handleActualizarOverrideUsuario(u.nombreCorto, "jefeAsignado", e.target.value)}
                                                                className="border rounded-lg px-2 py-1 text-[11px] font-bold bg-white w-full"
                                                            />
                                                        </td>
                                                        <td className="p-2.5 text-center">
                                                            <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full text-[10px] font-black">{u.estado}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DEL PLAN DE PAGOS Y SIMULADOR */}
                    {itemDetalleModal && (
                        <ModalDetalleGrupoYSimulador
                            item={itemDetalleModal}
                            onClose={() => setItemDetalleModal(null)}
                        />
                    )}

                    {/* MODAL DE ALERTA DE SEGURIDAD ANTE POSIBLE DESEMBOLSO DUPLICADO EN CAJA */}
                    {alertaDuplicadoModal && (
                        <ModalAlertaDuplicado
                            alertaInfo={alertaDuplicadoModal}
                            onCancel={() => setAlertaDuplicadoModal(null)}
                            onConfirmarDeTodosModos={() => {
                                const etapa = alertaDuplicadoModal.etapaIntentada;
                                setAlertaDuplicadoModal(null);
                                guardarOperacionEnServidor(etapa, true);
                            }}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
