                                <p className="text-[10px] font-bold text-slate-400">
                                    Eje Vertical: {tipoUnidad === "PORCENTAJE" ? "% de Cumplimiento de Meta" : "Monto Desembolsado (S/.)"}
                                </p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 text-[11px] font-bold">
                                {!usarSerieAnteriorComoUnica && (
                                    <span className="inline-flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-sm bg-[#16bb67] inline-block"></span>
                                        <span>{labelActual}</span>
                                    </span>
                                )}
                                {(mostrarDosSeries || usarSerieAnteriorComoUnica) && (
                                    <span className="inline-flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-sm bg-indigo-500 inline-block"></span>
                                        <span>{labelComparado}</span>
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="overflow-x-auto pb-2">
                            <div style={{ minWidth: `${Math.max(420, lista.length * 72)}px` }} className="relative pl-14 pr-3 pt-7 pb-9">
                                <div className="relative h-60 border-b-2 border-slate-600 flex items-end justify-around gap-2 px-2">
                                    {niveles.map((niv, idx) => {
                                        const bottomPct = (niv / maxVal) * 100;
                                        return (
                                            <div key={idx} style={{ bottom: `${bottomPct}%` }} className="absolute left-0 right-0 border-t border-slate-200 pointer-events-none">
                                                <span className="absolute -left-14 -top-2 w-12 text-right text-[9.5px] font-extrabold text-slate-600">
                                                    {tipoUnidad === "PORCENTAJE" ? `${niv.toFixed(0)}%` : formatShortSoles(niv)}
                                                </span>
                                            </div>
                                        );
                                    })}

                                    {lista.map((it, idx) => {
                                        const vAct = tipoUnidad === "PORCENTAJE" ? parseNum(it.actualPct) : parseNum(it.actualMonto);
                                        const vAnt = tipoUnidad === "PORCENTAJE" ? parseNum(it.anteriorPct) : parseNum(it.anteriorMonto);
                                        const valorPrimario = usarSerieAnteriorComoUnica ? vAnt : vAct;
                                        const diff = vAct - vAnt;

                                        const hActPct = Math.min(100, Math.max(valorPrimario > 0 ? 3 : 1, (valorPrimario / maxVal) * 100));
                                        const hAntPct = Math.min(100, Math.max(vAnt > 0 ? 3 : 1, (vAnt / maxVal) * 100));

                                        return (
                                            <div key={idx} className="flex-1 min-w-[60px] max-w-[100px] h-full flex flex-col justify-end items-center relative z-10 px-0.5">
                                                {mostrarDosSeries && (
                                                    <div className={`mb-1 px-1 py-0.2 rounded text-[8.5px] font-black leading-tight text-center truncate max-w-full ${diff > 0 ? "bg-emerald-100 text-emerald-800" : diff < 0 ? "bg-rose-100 text-rose-700" : "bg-slate-100 text-slate-500"}`}>
                                                        {diff > 0 ? `+${tipoUnidad === "PORCENTAJE" ? diff.toFixed(0) + "%" : formatShortSoles(diff)}` : diff < 0 ? `${tipoUnidad === "PORCENTAJE" ? diff.toFixed(0) + "%" : formatShortSoles(diff)}` : "0%"}
                                                    </div>
                                                )}

                                                {(!mostrarDosSeries || esSuperpuesto) ? (
                                                    <div className="w-full h-full flex items-end justify-center relative">
                                                        {mostrarDosSeries && esSuperpuesto && (
                                                            <div
                                                                style={{ height: `${hAntPct}%` }}
                                                                className="w-10/12 bg-indigo-500/30 border-2 border-dashed border-indigo-600 rounded-t-md absolute bottom-0 transition-all duration-500"
                                                                title={`${labelComparado}: ${formatearEtiqueta(vAnt)}`}
                                                            ></div>
                                                        )}

                                                        <div
                                                            style={{ height: `${hActPct}%` }}
                                                            className={`${esSuperpuesto && mostrarDosSeries ? "w-6/12 z-10 shadow-md" : "w-8/12"} ${usarSerieAnteriorComoUnica ? "bg-indigo-500" : "bg-[#16bb67] hover:bg-[#129e56]"} rounded-t-md transition-all duration-500 relative flex justify-center`}
                                                        >
                                                            <span className={`text-[9.5px] font-black whitespace-nowrap ${hActPct > 82 ? "-top-4 text-[#129e56] absolute" : hActPct > 20 ? "mt-1 text-slate-950" : "-top-4 text-[#129e56] absolute"}`}>
                                                                {formatearEtiqueta(valorPrimario)}
                                                            </span>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="w-full h-full flex items-end justify-center gap-0.5">
                                                        <div style={{ height: `${hActPct}%` }} className="w-5/12 bg-[#16bb67] rounded-t-sm transition-all duration-500 relative flex justify-center" title={`${labelActual}: ${formatearEtiqueta(vAct)}`}>
                                                            <span className="absolute -top-3.5 text-[8.5px] font-black text-emerald-800 whitespace-nowrap">{formatearEtiqueta(vAct)}</span>
                                                        </div>
                                                        <div style={{ height: `${hAntPct}%` }} className="w-5/12 bg-indigo-500 rounded-t-sm transition-all duration-500 relative flex justify-center" title={`${labelComparado}: ${formatearEtiqueta(vAnt)}`}>
                                                            <span className="absolute -top-3.5 text-[8.5px] font-bold text-indigo-700 whitespace-nowrap">{formatearEtiqueta(vAnt)}</span>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="absolute -bottom-6 text-[10px] font-black text-slate-800 uppercase tracking-tight text-center truncate w-full px-0.5" title={it.concepto}>
                                                    {it.concepto}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="text-center text-[10px] font-black text-slate-500 uppercase mt-6">
                                    ASESORES OFICIALES (FORMATO: NOMBRE.A)
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            if (mostrarComparativa && modoVisual === "LADO_A_LADO") {
                return (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {renderizarCanvasColumnas(items, `${titulo} (${labelActual})`, false, false, false)}
                        {renderizarCanvasColumnas(items, `${titulo} (${labelComparado})`, false, false, true)}
                    </div>
                );
            }

            return renderizarCanvasColumnas(items, titulo, mostrarComparativa, modoVisual === "SUPERPUESTO", false);
        }
        // ============================================================================
        // 6B. PANEL EJECUTIVO DE ESTADÍSTICAS (CON ANÁLISIS INTERACTIVO POR DÍA)
        // ============================================================================
        function PanelGraficosEstadisticos({
            movimientos, expedientesCaja, sedesCatalogo, metasAsesores,
            obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes,
            userRole, isGerente, isJefeZonal, isAdmin, isLiderEquipo,
            userSede, sedesPermitidasUsuario, selectedSedeVista, filtroMes,
            letraEquipoFiltro, setLetraEquipoFiltro, verificarAsesorEnEquipo
        }) {
            const mesActualBase = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;
            const [activarComparativa, setActivarComparativa] = React.useState(true);
            const [mesComparar, setMesComparar] = React.useState(() => obtenerMesAnterior(mesActualBase));
            const [modoComparacionVisual, setModoComparacionVisual] = React.useState("MISMO_GRAFICO");
            const [agrupacionTiempo, setAgrupacionTiempo] = React.useState("DIAS");
            const [unidadColumnas, setUnidadColumnas] = React.useState("PORCENTAJE");
            const [incluirColaCaja, setIncluirColaCaja] = React.useState(false);

            // Nuevo Estado: Inspector para analizar un Día Específico dentro de los gráficos
            const [diaInspeccion, setDiaInspeccion] = React.useState("TODOS");

            React.useEffect(() => {
                if (filtroMes !== "TODOS") {
                    setMesComparar(obtenerMesAnterior(filtroMes));
                }
            }, [filtroMes]);

            const fuenteMovs = React.useMemo(() => {
                return incluirColaCaja ? [...movimientos, ...expedientesCaja] : movimientos;
            }, [movimientos, expedientesCaja, incluirColaCaja]);

            const filtrarPorJerarquia = React.useCallback((lista) => {
                return lista.filter(m => {
                    if (isGerente) {
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else if (isJefeZonal) {
                        if (!sedesPermitidasUsuario.includes("TODAS") && !sedesPermitidasUsuario.includes(m.sede)) return false;
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else {
                        if (m.sede !== userSede) return false;
                    }

                    if (letraEquipoFiltro !== "TODOS") {
                        if (!verificarAsesorEnEquipo(m.asesor, letraEquipoFiltro)) return false;
                    }
                    return true;
                });
            }, [isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, letraEquipoFiltro, verificarAsesorEnEquipo]);

            const movsJerarquia = React.useMemo(() => filtrarPorJerarquia(fuenteMovs), [fuenteMovs, filtrarPorJerarquia]);

            const asesoresVisibles = React.useMemo(() => {
                const mapa = {};
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                metasParseadas.forEach(m => {
                    if (m.asesor === "__OFICINA__") return;
                    if (isGerente) {
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return;
                    } else if (isJefeZonal) {
                        if (!sedesPermitidasUsuario.includes("TODAS") && !sedesPermitidasUsuario.includes(m.sede)) return;
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return;
                    } else {
                        if (m.sede !== userSede) return;
                    }
                    if (letraEquipoFiltro !== "TODOS" && !verificarAsesorEnEquipo(m.asesor, letraEquipoFiltro)) return;

                    const key = `${m.sede}__${m.asesor}`;
                    if (!mapa[key]) mapa[key] = { key, sede: m.sede, asesor: m.asesor };
                });

                movsJerarquia
                    .filter(m => m.mesRegistro === mesActualBase || m.mesRegistro === mesComparar)
                    .forEach(m => {
                        if (!m.asesor) return;
                        const key = `${m.sede}__${m.asesor}`;
                        if (!mapa[key]) mapa[key] = { key, sede: m.sede, asesor: m.asesor };
                    });

                return Object.values(mapa);
            }, [metasAsesores, movsJerarquia, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, letraEquipoFiltro, verificarAsesorEnEquipo, mesActualBase, mesComparar]);

            const datosAgenciaSuperior = React.useMemo(() => {
                const movsAct = movsJerarquia.filter(m => m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion)));
                const movsAnt = movsJerarquia.filter(m => m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion)));

                const movsActMesCompleto = movsJerarquia.filter(m => m.mesRegistro === mesActualBase);
                const movsAntMesCompleto = movsJerarquia.filter(m => m.mesRegistro === mesComparar);

                let metaTotalVista = 0;
                if (letraEquipoFiltro !== "TODOS") {
                    metaTotalVista = asesoresVisibles.reduce((acc, a) => acc + obtenerMetaAsesorPorMes(a.sede, a.asesor, mesActualBase), 0);
                } else {
                    const sedesCalculo = sedesCatalogo.filter(s => {
                        if (isGerente) return selectedSedeVista === "TODAS" || s.nombre === selectedSedeVista;
                        if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre)) && (selectedSedeVista === "TODAS" || s.nombre === selectedSedeVista);
                        return s.nombre === userSede;
                    });
                    metaTotalVista = sedesCalculo.reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, mesActualBase), 0);
                }
                if (metaTotalVista <= 0) metaTotalVista = 300000;

                const avanceTotalSoles = movsAct.reduce((acc, m) => acc + parseNum(m.monto), 0);
                const avanceAnteriorSoles = movsAnt.reduce((acc, m) => acc + parseNum(m.monto), 0);
                const pctAvance = metaTotalVista > 0 ? (avanceTotalSoles / metaTotalVista) * 100 : 0;

                const infoHabiles = calcularDiasHabilesMes(mesActualBase);
                const porDiaHabil = Math.round(avanceTotalSoles / 30);
                const porDiaHMesMeta = Math.round(metaTotalVista / infoHabiles.totalHabilesMes);

                let serieActual = [];
                let serieComparada = [];

                if (agrupacionTiempo === "SEMANAS") {
                    const semRangos = [
                        { label: "Sem 1 (1-7)", tick: "Sem 1", min: 1, max: 7 },
                        { label: "Sem 2 (8-14)", tick: "Sem 2", min: 8, max: 14 },
                        { label: "Sem 3 (15-21)", tick: "Sem 3", min: 15, max: 21 },
                        { label: "Sem 4 (22-28)", tick: "Sem 4", min: 22, max: 28 },
                        { label: "Sem 5 (29-31)", tick: "Sem 5", min: 29, max: 31 }
                    ];
                    serieActual = semRangos.map(r => ({
                        etiqueta: `${r.label} (${mesActualBase})`,
                        tickLabel: r.tick,
                        valor: movsActMesCompleto.filter(m => Number(m.diaSistema) >= r.min && Number(m.diaSistema) <= r.max).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                    serieComparada = semRangos.map(r => ({
                        etiqueta: `${r.label} (${mesComparar})`,
                        tickLabel: r.tick,
                        valor: movsAntMesCompleto.filter(m => Number(m.diaSistema) >= r.min && Number(m.diaSistema) <= r.max).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                } else if (agrupacionTiempo === "MESES") {
                    serieActual = MESES_ANIO.map((mNom) => ({
                        etiqueta: mNom,
                        tickLabel: mNom.slice(0, 3),
                        valor: movsJerarquia.filter(x => x.mesRegistro === mNom).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                    serieComparada = MESES_ANIO.map((mNom) => {
                        const mPrev = obtenerMesAnterior(mNom);
                        return {
                            etiqueta: mPrev,
                            tickLabel: mNom.slice(0, 3),
                            valor: movsJerarquia.filter(x => x.mesRegistro === mPrev).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                } else {
                    serieActual = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesActualBase})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsActMesCompleto.filter(m => Number(m.diaSistema) === d).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                    serieComparada = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesComparar})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAntMesCompleto.filter(m => Number(m.diaSistema) === d).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                }

                return {
                    metaTotalVista, avanceTotalSoles, avanceAnteriorSoles,
                    pctAvance, porDiaHabil, porDiaHMesMeta,
                    serieActual, serieComparada
                };
            }, [movsJerarquia, mesActualBase, mesComparar, diaInspeccion, agrupacionTiempo, letraEquipoFiltro, asesoresVisibles, sedesCatalogo, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const itemsColumnasConcepto = React.useMemo(() => {
                if (agrupacionTiempo === "SEDES" && (isGerente || isJefeZonal)) {
                    return sedesCatalogo
                        .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                        .map(s => {
                            const metaAct = obtenerMetaOficinaPorMes(s.nombre, mesActualBase);
                            const metaAnt = obtenerMetaOficinaPorMes(s.nombre, mesComparar);
                            const mAct = fuenteMovs.filter(m => m.sede === s.nombre && m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((a, b) => a + parseNum(b.monto), 0);
                            const mAnt = fuenteMovs.filter(m => m.sede === s.nombre && m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((a, b) => a + parseNum(b.monto), 0);
                            return {
                                concepto: s.nombre,
                                actualMonto: mAct,
                                anteriorMonto: mAnt,
                                meta: metaAct,
                                actualPct: metaAct > 0 ? (mAct / metaAct) * 100 : 0,
                                anteriorPct: metaAnt > 0 ? (mAnt / metaAnt) * 100 : 0
                            };
                        });
                }

                return asesoresVisibles.map(a => {
                    const metaAct = obtenerMetaAsesorPorMes(a.sede, a.asesor, mesActualBase);
                    const metaAnt = obtenerMetaAsesorPorMes(a.sede, a.asesor, mesComparar);
                    const mAct = movsJerarquia.filter(m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((s, x) => s + parseNum(x.monto), 0);
                    const mAnt = movsJerarquia.filter(m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((s, x) => s + parseNum(x.monto), 0);

                    return {
                        concepto: (isGerente || isJefeZonal) && selectedSedeVista === "TODAS" ? `${a.asesor} (${a.sede.slice(0, 3)})` : a.asesor,
                        actualMonto: mAct,
                        anteriorMonto: mAnt,
                        meta: metaAct,
                        actualPct: metaAct > 0 ? (mAct / metaAct) * 100 : 0,
                        anteriorPct: metaAnt > 0 ? (mAnt / metaAnt) * 100 : 0

        //     (Versión Ejecutiva de las Imágenes 2 y 3 que envían los Administradores y Jefes de Equipo)
        // ============================================================================
        function ModuloReporteDiarioYWhatsApp({
            movimientos, expedientesCaja, tablaAsesores,
            filtroMes, sedeMostrarTitulo, letraEquipoFiltro, onVerPlan
        }) {
            const mesActivo = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;

            // Detectar automáticamente el último día con actividad en el mes o el día de hoy
            const ultimoDiaConActividad = React.useMemo(() => {
                const todos = [...movimientos, ...expedientesCaja].filter(m => m.mesRegistro === mesActivo);
                if (todos.length === 0) return new Date().getDate();
                return Math.max(...todos.map(m => Number(m.diaSistema) || 1));
            }, [movimientos, expedientesCaja, mesActivo]);

            const [diaCorteReporte, setDiaCorteReporte] = React.useState(() => ultimoDiaConActividad);
            const [cantidadDiasMatriz, setCantidadDiasMatriz] = React.useState(3); // 3 días (como en la foto: Lun, Mar, Mié) o 6 días (Semana completa)
            const [tipoMensajeWA, setTipoMensajeWA] = React.useState("DIARIO_Y_SEMANAL"); // SOLO_DIA | DIARIO_Y_SEMANAL | CIERRE_FIN_SEMANA
            const [copiadoExito, setCopiadoExito] = React.useState(false);

            React.useEffect(() => {
                setDiaCorteReporte(ultimoDiaConActividad);
            }, [ultimoDiaConActividad, mesActivo]);

            // 1. Datos para el CUADRO EJECUTIVO 1: "CRÉDITOS APROBADOS Y DESEMBOLSADOS DEL DÍA" (Imagen 2 y 3)
            const datosCuadroDelDia = React.useMemo(() => {
                const desembolsadosHoy = movimientos
                    .filter(m => m.mesRegistro === mesActivo && Number(m.diaSistema) === Number(diaCorteReporte))
                    .map(m => ({ ...m, condicionReporte: "DESEMBOLSADO" }));

                const porDesembolsarHoy = expedientesCaja
                    .filter(m => m.mesRegistro === mesActivo && Number(m.diaSistema) === Number(diaCorteReporte))
                    .map(m => ({ ...m, condicionReporte: "POR DESEMBOLSAR" }));

                const todosHoy = [...desembolsadosHoy, ...porDesembolsarHoy];

                // Agrupar por Asesor y numerar sus operaciones 1, 2, 3, 4... como en la imagen
                const mapaPorAsesor = {};
                todosHoy.forEach(op => {
                    const ase = op.asesor || "SIN ASESOR";
                    if (!mapaPorAsesor[ase]) mapaPorAsesor[ase] = [];
                    mapaPorAsesor[ase].push(op);
                });

                const filas = [];
                let sumaDesembolsado = 0;
                let sumaPorDesembolsar = 0;
                let sumaGeneral = 0;

                Object.keys(mapaPorAsesor).forEach(ase => {
                    const ops = mapaPorAsesor[ase];
                    ops.forEach((op, idx) => {
                        const montoOp = parseNum(op.monto);
                        if (op.condicionReporte === "DESEMBOLSADO") sumaDesembolsado += montoOp;
                        else sumaPorDesembolsar += montoOp;
                        sumaGeneral += montoOp;

                        filas.push({
                            asesor: ase,
                            nroOperacionAsesor: idx + 1,
                            esPrimeraFilaAsesor: idx === 0,
                            totalOpsAsesor: ops.length,
                            cliente: limpiarNombreExpediente(op.cliente),
                            modalidad: op.modalidad || "INDIVIDUAL",
                            integrantes: Array.isArray(op.integrantes) ? op.integrantes : [],
                            monto: montoOp,
                            condicion: op.condicionReporte,
                            raw: op
                        });
                    });
                });

                return {
                    filas,
                    sumaDesembolsado,
                    sumaPorDesembolsar,
                    sumaGeneral,
                    totalOperaciones: filas.length
                };
            }, [movimientos, expedientesCaja, mesActivo, diaCorteReporte]);

            // 2. Datos para el CUADRO EJECUTIVO 2: "MATRIZ DE SEGUIMIENTO DIARIO Y ACUMULADO SEMANAL" (Imagen 2 inferior)
            const diasRangoMatriz = React.useMemo(() => {
                const fin = Math.max(1, Math.min(31, Number(diaCorteReporte) || 1));
                const inicio = Math.max(1, fin - cantidadDiasMatriz + 1);
                const lista = [];
                for (let d = inicio; d <= fin; d++) {
                    lista.push({
                        dia: d,
                        tituloColumna: obtenerNombreDiaSemana(mesActivo, d)
                    });
                }
                return lista;
            }, [diaCorteReporte, cantidadDiasMatriz, mesActivo]);

            const matrizSeguimientoAsesores = React.useMemo(() => {
                const filasAsesores = tablaAsesores.map(a => {
                    let opsSemana = 0;
                    let montoSemana = 0;
                    let diasConsecutivosSinDesembolsar = 0;

                    const porDia = diasRangoMatriz.map(dObj => {
                        const movsDia = movimientos.filter(
                            m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesActivo && Number(m.diaSistema) === dObj.dia
                        );
                        const cant = movsDia.length;
                        const mto = movsDia.reduce((s, x) => s + parseNum(x.monto), 0);
                        opsSemana += cant;
                        montoSemana += mto;

                        if (cant === 0) diasConsecutivosSinDesembolsar++;
                        else diasConsecutivosSinDesembolsar = 0;

                        return { dia: dObj.dia, operaciones: cant, monto: mto };
                    });

                    return {
                        key: a.key,
                        asesor: a.asesor,
                        sede: a.sede,
                        metaMes: a.meta,
                        avanceMes: a.desembolsado,
                        avancePctMes: a.avancePct,
                        porDia,
                        opsSemana,
                        montoSemana,
                        diasConsecutivosSinDesembolsar
                    };
                });

                const totalesPorDia = diasRangoMatriz.map(dObj => {
                    let totOps = 0;
                    let totMonto = 0;
                    filasAsesores.forEach(f => {
                        const celda = f.porDia.find(p => p.dia === dObj.dia);
                        if (celda) {
                            totOps += celda.operaciones;
                            totMonto += celda.monto;
                        }
                    });
                    return { dia: dObj.dia, totOps, totMonto };
                });

                const granTotalOpsSemana = totalesPorDia.reduce((s, x) => s + x.totOps, 0);
                const granTotalMontoSemana = totalesPorDia.reduce((s, x) => s + x.totMonto, 0);

                return {
                    filasAsesores,
                    totalesPorDia,
                    granTotalOpsSemana,
                    granTotalMontoSemana
                };
            }, [tablaAsesores, movimientos, diasRangoMatriz, mesActivo]);

            // 3. GENERADOR AUTOMÁTICO DE ANÁLISIS AMABLE Y CON EMOJIS PARA WHATSAPP
            const textoWhatsAppGenerado = React.useMemo(() => {
                const fechaTitulo = obtenerNombreDiaSemana(mesActivo, diaCorteReporte);
                const eqTexto = letraEquipoFiltro !== "TODOS" ? ` — *EQUIPO (${letraEquipoFiltro})*` : "";
                const lineas = [];

                lineas.push(`🌟 *CREDIBAN PERÚ — REPORTE EJECUTIVO DE COLOCACIONES* 🍀`);
                lineas.push(`📍 *Agencia / Vista:* ${sedeMostrarTitulo}${eqTexto}`);
                lineas.push(`📅 *Fecha de Corte:* ${fechaTitulo} (${mesActivo})`);
                lineas.push(`━━━━━━━━━━━━━━━━━━━━━━`);

                if (tipoMensajeWA !== "CIERRE_FIN_SEMANA") {
                    lineas.push(`💸 *1. AVANCE DE DESEMBOLSOS DEL DÍA (${fechaTitulo}):*`);
                    if (datosCuadroDelDia.filas.length === 0) {
                        lineas.push(`• Aún no se registran desembolsos cerrados en el corte del día.`);
                    } else {
                        // Agrupar resumen del día por asesor
                        const resumenHoyAse = {};
                        datosCuadroDelDia.filas.forEach(f => {
                            if (!resumenHoyAse[f.asesor]) resumenHoyAse[f.asesor] = { ops: 0, desembolsado: 0, enCaja: 0, clientes: [] };
                            resumenHoyAse[f.asesor].ops += 1;
                            if (f.condicion === "DESEMBOLSADO") resumenHoyAse[f.asesor].desembolsado += f.monto;
                            else resumenHoyAse[f.asesor].enCaja += f.monto;
                            resumenHoyAse[f.asesor].clientes.push(`${f.cliente} (${formatShortSoles(f.monto)})`);
                        });

                        Object.keys(resumenHoyAse).forEach(ase => {
                            const info = resumenHoyAse[ase];
                            lineas.push(`✅ *${ase}:* ${info.ops} op. | Desembolsado: *${formatMoney(info.desembolsado)}*${info.enCaja > 0 ? ` | ⏳ Por Desembolsar: *${formatMoney(info.enCaja)}*` : ""}`);
                            lineas.push(`   ↳ _Clientes:_ ${info.clientes.join(", ")}`);
                        });
                    }
                    lineas.push(``);
                    lineas.push(`💰 *Total Desembolsado Hoy:* ${formatMoney(datosCuadroDelDia.sumaDesembolsado)}`);
                    if (datosCuadroDelDia.sumaPorDesembolsar > 0) {
                        lineas.push(`⏳ *Aprobados por Desembolsar (En Caja):* ${formatMoney(datosCuadroDelDia.sumaPorDesembolsar)}`);
                        lineas.push(`🚀 *Proyectado Total del Día:* ${formatMoney(datosCuadroDelDia.sumaGeneral)}`);
                    }
                    lineas.push(`━━━━━━━━━━━━━━━━━━━━━━`);
                }

                if (tipoMensajeWA === "DIARIO_Y_SEMANAL" || tipoMensajeWA === "CIERRE_FIN_SEMANA") {
                    const rangoTexto = diasRangoMatriz.length > 0
                        ? `del ${diasRangoMatriz[0].tituloColumna} al ${diasRangoMatriz[diasRangoMatriz.length - 1].tituloColumna}`
                        : "";
                    lineas.push(`📊 *2. RESUMEN ACUMULADO DEL PERIODO (${rangoTexto}):*`);

                    matrizSeguimientoAsesores.filasAsesores.forEach(f => {
                        const icono = f.montoSemana >= 10000 ? "🏆" : f.opsSemana > 0 ? "👏" : "💪";
                        lineas.push(`${icono} *${f.asesor}:* ${f.opsSemana} op. en el tramo (*${formatMoney(f.montoSemana)}*) | Avance Mes: *${f.avancePctMes.toFixed(1)}%*`);
                    });
                    lineas.push(``);
                    lineas.push(`📈 *Total Acumulado del Tramo:* ${matrizSeguimientoAsesores.granTotalOpsSemana} operaciones por *${formatMoney(matrizSeguimientoAsesores.granTotalMontoSemana)}*`);
                    lineas.push(`━━━━━━━━━━━━━━━━━━━━━━`);
                }

                // Reconocimiento positivo y mensaje amable de seguimiento
                const destacados = matrizSeguimientoAsesores.filasAsesores.filter(f => f.opsSemana > 0).sort((a, b) => b.montoSemana - a.montoSemana);
                const sinDesembolsosRecientes = matrizSeguimientoAsesores.filasAsesores.filter(f => f.diasConsecutivosSinDesembolsar >= 2);

                lineas.push(`✨ *ANÁLISIS Y MENSAJE PARA EL EQUIPO:*`);
                if (destacados.length > 0) {
                    const nombresTop = destacados.slice(0, 3).map(d => `*${d.asesor}* (${formatShortSoles(d.montoSemana)})`).join(", ");
                    lineas.push(`🎉 ¡Muchas felicidades a ${nombresTop} por el excelente ritmo y compromiso demostrados! Sigamos sumando con esa misma energía. 🚀`);
                }

                if (sinDesembolsosRecientes.length > 0) {
                    const nombresAnimar = sinDesembolsosRecientes.map(s => `*${s.asesor}*`).join(", ");
                    lineas.push(``);
                    lineas.push(`🤝 Un saludo especial y todo nuestro respaldo para ${nombresAnimar}: sabemos del esfuerzo que vienen realizando en campo; revisemos juntos sus propuestas en evaluación para destrabarlas y lograr que mañana mismo salgan sus desembolsos. ¡Confiamos plenamente en su capacidad para revertir el marcador y fortalecer su cartera! 💪😊🍀`);
                } else {
                    lineas.push(`🤝 ¡Excelente trabajo en equipo! Sigamos enfocados en nuestras metas diarias, empezando a construir sueños juntos. 😊🍀`);
                }

                return lineas.join("\n");
            }, [mesActivo, diaCorteReporte, letraEquipoFiltro, sedeMostrarTitulo, tipoMensajeWA, datosCuadroDelDia, diasRangoMatriz, matrizSeguimientoAsesores]);

            const [textoEditableWA, setTextoEditableWA] = React.useState(textoWhatsAppGenerado);
            React.useEffect(() => {
                setTextoEditableWA(textoWhatsAppGenerado);
            }, [textoWhatsAppGenerado]);

            const copiarAlPortapapeles = () => {
                navigator.clipboard.writeText(textoEditableWA).then(() => {
                    setCopiadoExito(true);
                    setTimeout(() => setCopiadoExito(false), 3000);
                });
            };

            return (
                <div className="space-y-6">
                    {/* BARRA DE CONFIGURACIÓN DEL REPORTE DIARIO Y SEMANAL */}
                    <div className="bg-white p-4 rounded-3xl shadow-sm border-2 border-[#59B447] flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <span className="bg-[#59B447] text-white text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">
                                📲 Generador Ejecutivo de Cuadros Diarios, Semanales y WhatsApp
                            </span>
                            <h2 className="text-sm sm:text-base font-black text-slate-900 mt-1">
                                Reporte Diario de Créditos Aprobados/Desembolsados y Matriz de Seguimiento por Asesor
                            </h2>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <div className="bg-slate-50 px-3 py-1.5 rounded-2xl border border-slate-200">
                                <label className="text-[10px] font-extrabold text-slate-500 uppercase block">📅 Día de Corte:</label>
                                <select
                                    value={diaCorteReporte}
                                    onChange={e => setDiaCorteReporte(Number(e.target.value))}
                                    className="font-black text-xs bg-transparent text-slate-900 outline-none"
                                >
                                    {Array.from({ length: 31 }, (_, i) => i + 1).map(d => (
                                        <option key={d} value={d}>{obtenerNombreDiaSemana(mesActivo, d)}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="bg-slate-50 px-3 py-1.5 rounded-2xl border border-slate-200">
                                <label className="text-[10px] font-extrabold text-slate-500 uppercase block">📆 Rango Matriz Seguimiento:</label>
                                <select
                                    value={cantidadDiasMatriz}
                                    onChange={e => setCantidadDiasMatriz(Number(e.target.value))}
                                    className="font-black text-xs bg-transparent text-slate-900 outline-none"
                                >
                                    <option value={3}>Últimos 3 Días (Ej: Lun, Mar, Mié)</option>
                                    <option value={4}>Últimos 4 Días</option>
                                    <option value={6}>Semana Completa (6 Días)</option>
                                    <option value={7}>7 Días Calendario</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        {/* COLUMNA IZQUIERDA (7 cols): LOS 2 CUADROS EJECUTIVOS MEJORADOS (IMAGEN 2 Y 3) */}
                        <div className="lg:col-span-7 space-y-6">

                            {/* CUADRO EJECUTIVO 1: CRÉDITOS APROBADOS Y DESEMBOLSADOS DEL DÍA (Versión Profesional de tus Imágenes 2 y 3) */}
                            <div className="bg-white rounded-3xl shadow-sm border-2 border-slate-300 overflow-hidden">
                                <div className="bg-gradient-to-r from-[#1b4332] to-slate-900 text-white px-5 py-3.5 flex flex-wrap justify-between items-center gap-2">
                                    <div>
                                        <div className="text-[10px] font-black text-emerald-300 uppercase tracking-wider">
                                            📋 CUADRO OFICIAL DEL DÍA — {obtenerNombreDiaSemana(mesActivo, diaCorteReporte)}
                                        </div>
                                        <h3 className="text-sm font-black uppercase">
                                            CRÉDITOS APROBADOS Y AVANCE DE DESEMBOLSOS ({sedeMostrarTitulo})
                                        </h3>
                                    </div>
                                    <span className="bg-white/15 px-3 py-1 rounded-full text-xs font-black">
                                        {datosCuadroDelDia.totalOperaciones} Operaciones
                                    </span>
                                </div>

                                {datosCuadroDelDia.filas.length === 0 ? (
                                    <div className="p-8 text-center text-slate-500 text-xs font-bold">
                                        No hay créditos registrados en el Día {diaCorteReporte} de {mesActivo}. Selecciona otro día arriba en "Día de Corte".
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-[#c5e0b4] text-slate-950 uppercase font-black border-b-2 border-slate-700">
                                                    <th className="p-2.5 text-left border-r border-slate-400">ASESOR DE NEGOCIOS</th>
                                                    <th className="p-2.5 text-center border-r border-slate-400 w-10">N°</th>
                                                    <th className="p-2.5 text-left border-r border-slate-400">CLIENTES / GRUPO</th>
                                                    <th className="p-2.5 text-right border-r border-slate-400">MONTO</th>
                                                    <th className="p-2.5 text-center">CONDICIÓN</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-300 font-bold">
                                                {datosCuadroDelDia.filas.map((f, idx) => {
                                                    const esDesembolsado = f.condicion === "DESEMBOLSADO";
                                                    return (
                                                        <tr
                                                            key={idx}
                                                            onClick={() => onVerPlan && onVerPlan(f.raw)}
                                                            className={`cursor-pointer transition ${esDesembolsado ? "bg-[#f8cbad]/65 hover:bg-[#f8cbad]" : "bg-white hover:bg-amber-50"}`}
                                                        >
                                                            <td className="p-2.5 font-black text-slate-900 border-r border-slate-300">
                                                                {f.asesor}
                                                            </td>
                                                            <td className="p-2.5 text-center font-black text-slate-800 border-r border-slate-300">
                                                                {f.nroOperacionAsesor}
                                                            </td>
                                                            <td className="p-2.5 font-extrabold text-slate-900 border-r border-slate-300">
                                                                <div>{f.cliente}</div>
                                                                {f.modalidad === "GRUPAL" && f.integrantes.length > 0 && (
                                                                    <div className="text-[10px] text-slate-700 font-semibold pl-2 border-l-2 border-slate-500 mt-0.5">
                                                                        {f.integrantes.map(i => `${i.nombre} (${formatShortSoles(i.monto)})`).join(" • ")}
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="p-2.5 text-right font-black text-slate-950 border-r border-slate-300">
                                                                {f.monto.toLocaleString('es-PE', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}
                                                            </td>
                                                            <td className="p-2.5 text-center">
                                                                {esDesembolsado ? (
                                                                    <span className="bg-emerald-800 text-white px-2.5 py-0.5 rounded-md text-[10px] font-black tracking-wide">
                                                                        DESEMBOLSADO
                                                                    </span>
                                                                ) : (
                                                                    <span className="bg-amber-100 text-amber-900 border border-amber-400 px-2.5 py-0.5 rounded-md text-[10px] font-black">
                                                                        POR DESEMBOLSAR
                                                                    </span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}

                                                {/* FILAS DE TOTALES DEL CUADRO 1 */}
                                                {datosCuadroDelDia.sumaPorDesembolsar > 0 && (
                                                    <>
                                                        <tr className="bg-emerald-50 font-black text-emerald-950 border-t-2 border-slate-600">
                                                            <td colSpan="3" className="p-2 text-right uppercase border-r border-slate-300">SUBTOTAL DESEMBOLSADO:</td>
                                                            <td className="p-2 text-right border-r border-slate-300">{formatMoney(datosCuadroDelDia.sumaDesembolsado)}</td>
                                                            <td className="p-2 text-center text-[10px]">EN BÓVEDA</td>
                                                        </tr>
                                                        <tr className="bg-amber-50 font-black text-amber-950">
                                                            <td colSpan="3" className="p-2 text-right uppercase border-r border-slate-300">SUBTOTAL POR DESEMBOLSAR (EN CAJA):</td>
                                                            <td className="p-2 text-right border-r border-slate-300">{formatMoney(datosCuadroDelDia.sumaPorDesembolsar)}</td>
                                                            <td className="p-2 text-center text-[10px]">PENDIENTE</td>
                                                        </tr>
                                                    </>
                                                )}
                                                <tr className="bg-[#f8cbad] font-black text-slate-950 text-sm border-t-2 border-slate-800">
                                                    <td colSpan="3" className="p-2.5 text-right uppercase border-r border-slate-400">TOTAL DEL DÍA ({obtenerNombreDiaSemana(mesActivo, diaCorteReporte)}):</td>
                                                    <td className="p-2.5 text-right border-r border-slate-400">{formatMoney(datosCuadroDelDia.sumaGeneral)}</td>
                                                    <td className="p-2.5 text-center text-xs">{datosCuadroDelDia.totalOperaciones} CRÉD.</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>

                            {/* CUADRO EJECUTIVO 2: MATRIZ DE SEGUIMIENTO DIARIO Y ACUMULADO SEMANAL (Versión Ejecutiva del cuadro Lun/Mar/Mié) */}
                            <div className="bg-white rounded-3xl shadow-sm border-2 border-slate-300 overflow-hidden">
                                <div className="bg-slate-900 text-white px-5 py-3.5 flex flex-wrap justify-between items-center gap-2">
                                    <div>
                                        <span className="text-[10px] font-black text-amber-300 uppercase">
                                            📊 SEGUIMIENTO DE PRODUCTIVIDAD DIARIA Y CIERRE DE SEMANA
                                        </span>
                                        <h3 className="text-sm font-black uppercase">
                                            OPERACIONES Y MONTOS POR DÍA + ACUMULADO SEMANAL
                                        </h3>
                                    </div>
                                    <span className="text-[11px] font-bold text-slate-300">
                                        🟨 Amarillo = Destacado (≥S/ 10,000) | 🟥 Rojo suave = Día sin desembolso (0)
                                    </span>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-[11px] border-collapse">
                                        <thead>
                                            <tr className="bg-[#a9d08e] text-slate-950 font-black uppercase border-b border-slate-500">
                                                <th rowSpan="2" className="p-2.5 text-left border-r border-slate-500 sticky left-0 bg-[#a9d08e] z-10">
                                                    ASESOR DE NEGOCIOS
                                                </th>
                                                {diasRangoMatriz.map(dObj => (
                                                    <th key={dObj.dia} colSpan="2" className="p-2 text-center border-r border-slate-500 whitespace-nowrap">
                                                        {dObj.tituloColumna}
                                                    </th>
                                                ))}
                                                <th colSpan="2" className="p-2 text-center bg-emerald-800 text-white whitespace-nowrap">
                                                    ACUMULADO TRAMO
                                                </th>
                                            </tr>
                                            <tr className="bg-[#fff2cc] text-slate-900 font-black uppercase border-b-2 border-slate-600 text-[10px]">
                                                {diasRangoMatriz.map(dObj => (
                                                    <React.Fragment key={`sub_${dObj.dia}`}>
                                                        <th className="py-1.5 px-2 text-center border-r border-slate-300">OPERACIÓN</th>
                                                        <th className="py-1.5 px-2 text-right border-r border-slate-500">MONTO</th>
                                                    </React.Fragment>
                                                ))}
                                                <th className="py-1.5 px-2 text-center bg-emerald-100 text-emerald-950 border-r border-emerald-300">OP.</th>
                                                <th className="py-1.5 px-2 text-right bg-emerald-100 text-emerald-950">TOTAL S/</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-300 font-bold">
                                            {matrizSeguimientoAsesores.filasAsesores.map(f => (
                                                <tr key={f.key} className="hover:bg-slate-50">
                                                    <td className="p-2 font-black text-slate-950 bg-[#c5e0b4] border-r border-slate-500 sticky left-0 whitespace-nowrap">
                                                        <div className="flex items-center justify-between gap-1.5">
                                                            <span>{f.asesor}</span>
                                                            {f.diasConsecutivosSinDesembolsar >= 2 && (
                                                                <span className="bg-rose-600 text-white text-[9px] px-1.5 py-0.2 rounded-full" title={`${f.diasConsecutivosSinDesembolsar} días seguidos sin desembolsar`}>
                                                                    {f.diasConsecutivosSinDesembolsar}d en 0
                                                                </span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    {f.porDia.map(celda => {
                                                        const esCero = celda.operaciones === 0;
                                                        const esRecord = celda.monto >= 10000;
                                                        const esBuenOps = celda.operaciones >= 3;
                                                        return (
                                                            <React.Fragment key={`${f.key}_${celda.dia}`}>
                                                                <td className={`p-2 text-center border-r border-slate-300 font-black ${esCero ? "bg-rose-500 text-white" : esBuenOps ? "bg-amber-300 text-slate-950" : "bg-white text-slate-900"}`}>
                                                                    {celda.operaciones}
                                                                </td>
                                                                <td className={`p-2 text-right border-r border-slate-500 font-black whitespace-nowrap ${esCero ? "bg-rose-500 text-white" : esRecord ? "bg-[#ffff00] text-slate-950" : "bg-white text-slate-900"}`}>
                                                                    {celda.monto.toLocaleString('es-PE', { maximumFractionDigits: 0 })}
                                                                </td>
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                    <td className="p-2 text-center font-black bg-emerald-50 text-emerald-950 border-r border-emerald-200">
                                                        {f.opsSemana}
                                                    </td>
                                                    <td className="p-2 text-right font-black bg-emerald-50 text-emerald-950 whitespace-nowrap">
                                                        {formatShortSoles(f.montoSemana)}
                                                    </td>
                                                </tr>
                                            ))}

                                            {/* FILA DE TOTALES POR DÍA EN LA MATRIZ */}
                                            <tr className="bg-slate-100 font-black text-slate-950 border-t-2 border-slate-700">
                                                <td className="p-2.5 bg-[#a9d08e] border-r border-slate-500 sticky left-0 uppercase">
                                                    TOTAL DIARIO

        // ============================================================================
        // 7. APLICACIÓN PRINCIPAL CON JERARQUÍAS (GERENTE, ZONAL, ADMIN, LÍDER A-J Y CAJA)
        // ============================================================================
        function App() {
            const [usersDirectory, setUsersDirectory] = React.useState([]);

            const [session, setSession] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("crediban_desembolsos_session");
                    if (!saved) return null;
                    const parsed = JSON.parse(saved);
                    const rol = clasificarRolEstricto(parsed?.usuario?.cargo, parsed?.usuario?.cargoOriginal, parsed?.usuario);
                    if (rol === "ASESOR" || !["GERENTE", "JEFE_ZONAL", "ADMINISTRADOR", "LIDER_EQUIPO", "CAJERO"].includes(rol)) {
                        localStorage.removeItem("crediban_desembolsos_session");
                        return null;
                    }
                    return parsed;
                } catch (e) { return null; }
            });

            const [loadingData, setLoadingData] = React.useState(false);
            const [syncMsg, setSyncMsg] = React.useState("");

            const [metasAsesores, setMetasAsesores] = React.useState([]);
            const [movimientos, setMovimientos] = React.useState([]);
