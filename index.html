            const [asignacionEquiposManual, setAsignacionEquiposManual] = React.useState(() => {
                try {
                    const s = localStorage.getItem("crediban_equipos_aj");
                    return s ? JSON.parse(s) : {};
                } catch (e) { return {}; }
            });

            // PESTAÑA INICIAL POR DEFECTO: ESTADISTICAS para Administradores, Gerentes, Zonales y Líderes; CAJA para Cajeros
            const [activeTab, setActiveTab] = React.useState("ESTADISTICAS");

            const [asesorDesplegadoKey, setAsesorDesplegadoKey] = React.useState(null);
            const [mostrarDescuentosDetalle, setMostrarDescuentosDetalle] = React.useState(false);

            const [activarCompEnCuadros, setActivarCompEnCuadros] = React.useState(false);
            const [modoGraficoResumen, setModoGraficoResumen] = React.useState("MISMO_GRAFICO");
            const [mesCompResumen, setMesCompResumen] = React.useState(() => obtenerMesAnterior(MESES_ANIO[new Date().getMonth()]));
            const [unidadGraficoResumen, setUnidadGraficoResumen] = React.useState("PORCENTAJE");

            // Filtros Globales
            const [selectedSedeVista, setSelectedSedeVista] = React.useState("TODAS");
            const [letraEquipoFiltro, setLetraEquipoFiltro] = React.useState("TODOS");
            const [filtroMes, setFiltroMes] = React.useState(() => MESES_ANIO[new Date().getMonth()]);
            const [filtroDia, setFiltroDia] = React.useState("TODOS");
            const [filtroDesde, setFiltroDesde] = React.useState("");
            const [filtroHasta, setFiltroHasta] = React.useState("");
            const [filtroAsesor, setFiltroAsesor] = React.useState("TODOS");
            const [filtroModalidad, setFiltroModalidad] = React.useState("TODAS");
            const [busquedaCliente, setBusquedaCliente] = React.useState("");

            const [itemDetalleModal, setItemDetalleModal] = React.useState(null);

            const [modalidadCredito, setModalidadCredito] = React.useState("INDIVIDUAL");
            const [formSede, setFormSede] = React.useState("HUACHO");
            const [formMes, setFormMes] = React.useState(() => MESES_ANIO[new Date().getMonth()]);
            const [formDiaSistema, setFormDiaSistema] = React.useState(() => new Date().getDate());
            const [formFechaISO, setFormFechaISO] = React.useState(() => getTodayISO());
            const [formAsesor, setFormAsesor] = React.useState("");
            const [formAsesorManual, setFormAsesorManual] = React.useState("");
            const [formNombreCliente, setFormNombreCliente] = React.useState("");
            const [formTipoCliente, setFormTipoCliente] = React.useState("CR");
            const [formMonto, setFormMonto] = React.useState("");
            const [formDescuento, setFormDescuento] = React.useState("0");

            const [formFrecuencia, setFormFrecuencia] = React.useState("14");
            const [formCuotas, setFormCuotas] = React.useState("8");
            const [formTasaTEM, setFormTasaTEM] = React.useState("21");
            const [formDiasGracia, setFormDiasGracia] = React.useState("0");
            const [formGraciaNegativa, setFormGraciaNegativa] = React.useState(false);

            const [grupoIntegrantes, setGrupoIntegrantes] = React.useState([
                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                { nombre: "", tipoCliente: "CN", monto: "", descuento: "0" }
            ]);
            const [savingMov, setSavingMov] = React.useState(false);

            const [nuevaSedeNombre, setNuevaSedeNombre] = React.useState("");
            const [nuevaSedeMeta, setNuevaSedeMeta] = React.useState("80000");

            const [metaSedeSelect, setMetaSedeSelect] = React.useState("HUACHO");
            const [metaMesSelect, setMetaMesSelect] = React.useState(() => MESES_ANIO[new Date().getMonth()]);
            const [metaTipoSelect, setMetaTipoSelect] = React.useState("ASESOR");
            const [metaAsesorNombre, setMetaAsesorNombre] = React.useState("");
            const [metaAsesorMonto, setMetaAsesorMonto] = React.useState("45000");

            React.useEffect(() => {
                fetch(`${GAS_USUARIOS_URL}?action=getActiveUsers`)
                    .then(r => r.json())
                    .then(data => {
                        if (data && Array.isArray(data.usuarios)) {
                            setUsersDirectory(data.usuarios);
                        }
                    })
                    .catch(() => {});
            }, []);

            const mapaEquiposAutomatico = React.useMemo(() => {
                const mapa = { ...asignacionEquiposManual };
                usersDirectory.forEach(u => {
                    const letra = extraerLetraEquipo(u);
                    if (letra) {
                        const nom1 = limpiarNombreAsesor(u.usuario);
                        const nom2 = limpiarNombreAsesor(u.nombre);
                        if (nom1) mapa[nom1] = letra;
                        if (nom2) mapa[nom2] = letra;
                        if (nom2 && nom2.includes(" ")) {
                            mapa[nom2.split(" ")[0]] = letra;
                        }
                    }
                    if (u.asesores || u.asesoresAsignados) {
                        const lLider = extraerLetraEquipo(u);
                        if (lLider) {
                            String(u.asesores || u.asesoresAsignados).split(/[,;|/]+/).forEach(aNom => {
                                const limpio = limpiarNombreAsesor(aNom);
                                if (limpio) mapa[limpio] = lLider;
                            });
                        }
                    }
                });
                return mapa;
            }, [usersDirectory, asignacionEquiposManual]);

            const verificarAsesorEnEquipo = React.useCallback((nombreAsesor, letraBuscada) => {
                if (!letraBuscada || letraBuscada === "TODOS") return true;
                const limpio = limpiarNombreAsesor(nombreAsesor);
                if (!limpio) return false;
                if (mapaEquiposAutomatico[limpio] === letraBuscada) return true;
                const primerNombre = limpio.split(" ")[0];
                if (mapaEquiposAutomatico[primerNombre] === letraBuscada) return true;
                if (extraerLetraEquipo({ nombre: nombreAsesor }) === letraBuscada) return true;
                return false;
            }, [mapaEquiposAutomatico]);

            const userRole = clasificarRolEstricto(session?.usuario?.cargo, session?.usuario?.cargoOriginal, session?.usuario);
            const userSede = String(session?.usuario?.sede || "HUACHO").trim().toUpperCase();
            const userLetraEquipo = session?.usuario?.letraEquipo || extraerLetraEquipo(session?.usuario) || "";

            const isGerente = userRole === "GERENTE";
            const isJefeZonal = userRole === "JEFE_ZONAL";
            const isAdmin = userRole === "ADMINISTRADOR";
            const isLiderEquipo = userRole === "LIDER_EQUIPO";
            const isCajero = userRole === "CAJERO";

            const sedesPermitidasUsuario = React.useMemo(() => {
                if (isGerente) return ["TODAS", ...sedesCatalogo.map(s => s.nombre)];
                if (isJefeZonal) return extraerSedesZonal(session?.usuario?.sede, session?.usuario?.zona);
                return [userSede];
            }, [isGerente, isJefeZonal, sedesCatalogo, session, userSede]);

            const puedeDesembolsar = isCajero || isGerente;
            const puedeVerDetalleAvanzado = isGerente || isJefeZonal || isAdmin || isLiderEquipo;

            React.useEffect(() => {
                if (filtroMes !== "TODOS") {
                    setMesCompResumen(obtenerMesAnterior(filtroMes));
                }
            }, [filtroMes]);

            const cargarDatosServidor = React.useCallback(async (tokenToUse) => {
                const tk = tokenToUse || session?.token;
                if (!tk) return;
                setLoadingData(true);
                setSyncMsg("Sincronizando bóveda...");
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "getSystemData", token: tk })
                    });
                    const data = await res.json();

                    if (data.status === "unauthorized") {
                        alert(data.message || "Sesión expirada.");
                        handleLogout();
                        return;
                    }

                    if (data.status === "ok") {
                        if (Array.isArray(data.sedes) && data.sedes.length > 0) setSedesCatalogo(data.sedes);
                        if (Array.isArray(data.metasAsesores)) setMetasAsesores(data.metasAsesores);
                        if (Array.isArray(data.movimientos)) {
                            const soloDesembolsosReales = data.movimientos.filter(
                                m => m.formato === "DESEMBOLSO" && !esRegistroExpedienteCaja(m)
                            );
                            const soloExpedientesEnCola = data.movimientos.filter(
                                m => esRegistroExpedienteCaja(m)
                            );
                            setMovimientos(soloDesembolsosReales);
                            setExpedientesCaja(soloExpedientesEnCola);
                        }
                        setSyncMsg("Conectado en vivo ✅");
                    } else {
                        setSyncMsg("⚠️ " + (data.message || "Error al sincronizar"));
                    }
                } catch (e) {
                    setSyncMsg("⚠️ Error de red al consultar datos");
                } finally {
                    setLoadingData(false);
                }
            }, [session]);

            React.useEffect(() => {
                if (session && session.token) {
                    const rol = clasificarRolEstricto(session.usuario.cargo, session.usuario.cargoOriginal, session.usuario);
                    const letEq = session.usuario.letraEquipo || extraerLetraEquipo(session.usuario);

                    if (rol === "GERENTE") {
                        setSelectedSedeVista("TODAS");
                    } else if (rol === "JEFE_ZONAL") {
                        const zonas = extraerSedesZonal(session.usuario.sede, session.usuario.zona);
                        setSelectedSedeVista(zonas[0] || "HUACHO");
                    } else {
                        setSelectedSedeVista(session.usuario.sede || "HUACHO");
                    }

                    if (rol === "LIDER_EQUIPO" && letEq) {
                        setLetraEquipoFiltro(letEq);
                    } else {
                        setLetraEquipoFiltro("TODOS");
                    }

                    const sedeBase = (session.usuario.sede === "TODAS" || !session.usuario.sede) ? "HUACHO" : session.usuario.sede.split(",")[0].trim();
                    setFormSede(sedeBase);
                    setMetaSedeSelect(sedeBase);

                    setActiveTab(rol === "CAJERO" ? "CAJA" : "ESTADISTICAS");
                    cargarDatosServidor(session.token);
                }
            }, [session]);

            const handleLoginSuccess = (sessionData, remember) => {
                setSession(sessionData);
                if (remember) {
                    localStorage.setItem("crediban_desembolsos_session", JSON.stringify(sessionData));
                }
            };

            const handleLogout = () => {
                localStorage.removeItem("crediban_desembolsos_session");
                setSession(null);
                setMovimientos([]);
                setExpedientesCaja([]);
            };

            const handleAsignarEquipoManual = (nombreAsesor, letra) => {
                const limpio = limpiarNombreAsesor(nombreAsesor);
                const nuevo = { ...asignacionEquiposManual, [limpio]: letra };
                setAsignacionEquiposManual(nuevo);
                localStorage.setItem("crediban_equipos_aj", JSON.stringify(nuevo));
            };

            const asesoresDeSedeForm = React.useMemo(() => {
                const sedeTarget = isGerente ? formSede : userSede;
                const deMetas = metasAsesores
                    .map(parsearRegistroMeta)
                    .filter(m => m.sede === sedeTarget && m.estado === "ACTIVO" && m.asesor !== "__OFICINA__")
                    .map(m => m.asesor);
                const deMovs = [...movimientos, ...expedientesCaja]
                    .filter(m => m.sede === sedeTarget && m.asesor)
                    .map(m => m.asesor);
                return Array.from(new Set([...deMetas, ...deMovs])).filter(Boolean);
            }, [metasAsesores, movimientos, expedientesCaja, formSede, isGerente, userSede]);

            React.useEffect(() => {
                if (asesoresDeSedeForm.length > 0 && !asesoresDeSedeForm.includes(formAsesor)) {
                    setFormAsesor(asesoresDeSedeForm[0]);
                }
            }, [asesoresDeSedeForm, formSede]);

            const totalesFormulario = React.useMemo(() => {
                if (modalidadCredito === "GRUPAL") {
                    let sumaMonto = 0, sumaDesc = 0, cantCN = 0, cantCR = 0, miembrosValidos = 0;
                    grupoIntegrantes.forEach(m => {
                        const mMonto = parseNum(m.monto);
                        const mDesc = m.tipoCliente === "CR" ? parseNum(m.descuento) : 0;
                        if (m.nombre.trim() && mMonto > 0) miembrosValidos++;
                        sumaMonto += mMonto;
                        sumaDesc += mDesc;
                        if (m.tipoCliente === "CN") cantCN++;
                        else cantCR++;
                    });
                    const tipoRes = cantCN > 0 && cantCR > 0 ? "MIXTO" : (cantCN > 0 ? "CN" : "CR");
                    return {
                        montoBruto: sumaMonto, montoDescuento: sumaDesc,
                        efectivoNeto: Math.max(0, sumaMonto - sumaDesc),
                        cantidadCN: cantCN, cantidadCR: cantCR,
                        tipoResumenGrupo: tipoRes, nroIntegrantes: miembrosValidos
                    };
                } else {
                    const mBruto = parseNum(formMonto);
                    const mDesc = formTipoCliente === "CR" ? parseNum(formDescuento) : 0;
                    return {
                        montoBruto: mBruto, montoDescuento: mDesc,
                        efectivoNeto: Math.max(0, mBruto - mDesc),
                        cantidadCN: formTipoCliente === "CN" ? 1 : 0,
                        cantidadCR: formTipoCliente === "CR" ? 1 : 0,
                        tipoResumenGrupo: formTipoCliente, nroIntegrantes: 1
                    };
                }
            }, [modalidadCredito, grupoIntegrantes, formMonto, formDescuento, formTipoCliente]);

            const diasGraciaFinalForm = (parseInt(formDiasGracia, 10) || 0) * (formGraciaNegativa ? -1 : 1);
            const simulacionEnVivo = React.useMemo(() => {
                return simularCreditoCrediban({
                    monto: totalesFormulario.montoBruto, frecuencia: formFrecuencia,
                    nroCuotas: formCuotas, tasaTEM: formTasaTEM,
                    diasGracia: diasGraciaFinalForm, fechaDesembolsoISO: formFechaISO
                });
            }, [totalesFormulario.montoBruto, formFrecuencia, formCuotas, formTasaTEM, diasGraciaFinalForm, formFechaISO]);

            const handleUpdateMiembroGrupo = (index, field, value) => {
                setGrupoIntegrantes(prev => prev.map((item, idx) => idx === index ? { ...item, [field]: value } : item));
            };

            const handleAddMiembroGrupo = () => {
                setGrupoIntegrantes(prev => [...prev, { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" }]);
            };

            const handleRemoveMiembroGrupo = (index) => {
                if (grupoIntegrantes.length <= 2) {
                    alert("Un crédito grupal requiere al menos 2 o 3 integrantes.");
                    return;
                }
                setGrupoIntegrantes(prev => prev.filter((_, idx) => idx !== index));
            };

            const guardarOperacionEnServidor = async (esExpedientePendiente = false) => {
                if (!session?.token || !puedeDesembolsar) {
                    alert("⛔ Tu rol no tiene permisos para registrar en Caja.");
                    return;
                }

                const asesorElegido = (formAsesor === "__OTRO__" ? formAsesorManual : formAsesor).trim().toUpperCase();
                if (!asesorElegido) { alert("Selecciona o escribe el nombre del Asesor."); return; }
                if (!formNombreCliente.trim()) { alert("Ingresa el Nombre del Cliente o Grupo."); return; }
                if (totalesFormulario.montoBruto <= 0) { alert("El monto debe ser mayor a S/ 0.00"); return; }

                const nombreLimpio = limpiarNombreExpediente(formNombreCliente.trim().toUpperCase());
                const nombreFinalGuardar = esExpedientePendiente ? `[EN CAJA] ${nombreLimpio}` : nombreLimpio;

                const payloadData = {
                    sede: isGerente ? formSede : userSede,
                    formato: "DESEMBOLSO",
                    mesRegistro: formMes,
                    diaSistema: parseInt(formDiaSistema, 10) || new Date().getDate(),
                    asesor: asesorElegido,
                    modalidad: modalidadCredito,
                    nombreCliente: nombreFinalGuardar,
                    tipoCliente: modalidadCredito === "GRUPAL" ? totalesFormulario.tipoResumenGrupo : formTipoCliente,
                    cantidadCN: totalesFormulario.cantidadCN,
                    monto: totalesFormulario.montoBruto,
                    montoDescuento: totalesFormulario.montoDescuento,
                    frecuencia: parseInt(formFrecuencia, 10) || 14,
                    nroCuotas: parseInt(formCuotas, 10) || 0,
                    tasaTEM: parseNum(formTasaTEM),
                    diasGracia: diasGraciaFinalForm,
                    fechaDesembolsoISO: formFechaISO,
                    integrantes: modalidadCredito === "GRUPAL" ? grupoIntegrantes : []
                };

                setSavingMov(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "registrarMovimiento", token: session.token, data: payloadData })
                    });
                    const result = await res.json();
                    if (result.status === "ok") {
                        alert(esExpedientePendiente
                            ? `⏳ Expediente en Caja registrado para proyección: "${nombreLimpio}" (${formatMoney(totalesFormulario.montoBruto)}).`
                            : result.message
                        );
                        setFormNombreCliente("");
                        setFormMonto("");
                        setFormDescuento("0");
                        if (modalidadCredito === "GRUPAL") {
                            setGrupoIntegrantes([
                                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                                { nombre: "", tipoCliente: "CN", monto: "", descuento: "0" }
                            ]);
                        }
                        cargarDatosServidor(session.token);
                    } else {
                        alert("⚠️ " + (result.message || "No se pudo guardar el registro."));
                    }
                } catch (err) {
                    alert("⚠️ Error de red al guardar en el servidor.");
                } finally {
                    setSavingMov(false);
                }
            };

            const handleRegistrarDesembolso = (e) => { e.preventDefault(); guardarOperacionEnServidor(false); };
            const handleRegistrarExpedienteCaja = (e) => { e.preventDefault(); guardarOperacionEnServidor(true); };

            const handleDesembolsarExpedientePendiente = async (exp) => {
                if (!puedeDesembolsar) return;
                const nombreLimpio = limpiarNombreExpediente(exp.cliente);
                if (!confirm(`✅ ¿Confirmas que el expediente de "${nombreLimpio}" por ${formatMoney(exp.monto)} ya fue DESEMBOLSADO en Caja?`)) return;

                setLoadingData(true);
                try {
                    const payloadReal = {
                        sede: exp.sede, formato: "DESEMBOLSO",
                        mesRegistro: exp.mesRegistro || formMes,
                        diaSistema: parseInt(exp.diaSistema, 10) || new Date().getDate(),
                        asesor: exp.asesor, modalidad: exp.modalidad || "INDIVIDUAL",
                        nombreCliente: nombreLimpio, tipoCliente: exp.tipoCliente || "CR",
                        cantidadCN: parseInt(exp.cantidadCN, 10) || 0,
                        monto: parseNum(exp.monto), montoDescuento: parseNum(exp.montoDescuento),
                        frecuencia: parseInt(exp.frecuencia, 10) || 14,
                        nroCuotas: parseInt(exp.nroCuotas, 10) || 8,
                        tasaTEM: parseNum(exp.tasaTEM) || 21,
                        diasGracia: parseInt(exp.diasGracia, 10) || 0,
                        fechaDesembolsoISO: exp.fechaDesembolsoISO || exp.fechaISO || getTodayISO(),
                        integrantes: Array.isArray(exp.integrantes) ? exp.integrantes : []
                    };

                    const resReg = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "registrarMovimiento", token: session.token, data: payloadReal })
                    });
                    const dataReg = await resReg.json();

                    if (dataReg.status === "ok") {
                        await fetch(GAS_DESEMBOLSOS_URL, {
                            method: "POST",
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify({ action: "eliminarMovimiento", token: session.token, sede: exp.sede, idRegistro: exp.idRegistro, rowNumber: exp.rowNumber })
                        });
                        alert(`🎉 ¡Listo! "${nombreLimpio}" pasó a Desembolsos Oficiales.`);
                        cargarDatosServidor(session.token);
                    }
                } catch (e) {
                    alert("⚠️ Error al procesar el expediente.");
                } finally {
                    setLoadingData(false);
                }
            };

            const handleEliminarRegistro = async (mov, esExpCaja = false) => {
                if (!puedeVerDetalleAvanzado && !(esExpCaja && puedeDesembolsar)) return;
                const nomMostrar = limpiarNombreExpediente(mov.cliente);
                if (!confirm(`⚠️ ¿Estás seguro de retirar/anular "${nomMostrar}" por ${formatMoney(mov.monto)} en ${mov.sede}?`)) return;
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "eliminarMovimiento", token: session.token, sede: mov.sede, idRegistro: mov.idRegistro, rowNumber: mov.rowNumber })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === "ok") cargarDatosServidor(session.token);
                } catch (e) {
                    alert("Error al anular registro.");
                }
            };

            const handleCrearNuevaSede = async (e) => {
                e.preventDefault();
                if (!nuevaSedeNombre.trim()) return;
                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "crearSede", token: session.token, nombreSede: nuevaSedeNombre.trim().toUpperCase(), metaOficina: parseNum(nuevaSedeMeta) })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === "ok") { setNuevaSedeNombre(""); cargarDatosServidor(session.token); }
                } catch (e) { alert("Error al crear sede."); } finally { setLoadingData(false); }
            };

            const handleGuardarMetaMensual = async (e) => {
                e.preventDefault();
                const sedeDestino = isGerente ? metaSedeSelect : userSede;
                const nombreBase = metaTipoSelect === "OFICINA" ? "__OFICINA__" : metaAsesorNombre.trim().toUpperCase();
                if (!nombreBase) { alert("Ingresa el nombre del asesor."); return; }

                const claveAsesorMes = metaMesSelect === "TODOS" ? nombreBase : `${nombreBase}::${metaMesSelect}`;
                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "guardarMetaAsesor", token: session.token, sede: sedeDestino, asesor: claveAsesorMes, meta: parseNum(metaAsesorMonto), estado: "ACTIVO" })
                    });
                    const data = await res.json();
                    if (data.status === "ok") {
                        alert(`✅ Meta guardada en ${formatMoney(metaAsesorMonto)}.`);
                        if (metaTipoSelect === "ASESOR") setMetaAsesorNombre("");
                        cargarDatosServidor(session.token);
                    }
                } catch (e) { alert("Error al actualizar meta."); } finally { setLoadingData(false); }
            };

            const obtenerMetaOficinaPorMes = React.useCallback((nombreSede, mesConsulta) => {
                const sClean = String(nombreSede || "").trim().toUpperCase();
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaOficinaMes = metasParseadas.find(x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === mClean);
                if (metaOficinaMes && metaOficinaMes.meta > 0) return metaOficinaMes.meta;
                if (HISTORIAL_METAS_BASE[mClean]?.oficinas?.[sClean]) return HISTORIAL_METAS_BASE[mClean].oficinas[sClean];

                const metaOficinaGral = metasParseadas.find(x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === "TODOS");
                if (metaOficinaGral && metaOficinaGral.meta > 0) return metaOficinaGral.meta;

                const sedeCat = sedesCatalogo.find(s => s.nombre === sClean);
                return sedeCat ? parseNum(sedeCat.metaOficina) : 100000;
            }, [metasAsesores, sedesCatalogo]);

            const obtenerMetaAsesorPorMes = React.useCallback((nombreSede, nombreAsesor, mesConsulta) => {
                const sClean = String(nombreSede || "").trim().toUpperCase();
                const aClean = String(nombreAsesor || "").trim().toUpperCase();
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaEspecificaMes = metasParseadas.find(x => x.sede === sClean && x.asesor === aClean && x.mes === mClean);
                if (metaEspecificaMes && metaEspecificaMes.meta > 0) return metaEspecificaMes.meta;

                const keyHist = `${sClean}__${aClean}`;
                if (HISTORIAL_METAS_BASE[mClean]?.asesores?.[keyHist]) return HISTORIAL_METAS_BASE[mClean].asesores[keyHist];

                const metaGeneral = metasParseadas.find(x => x.sede === sClean && x.asesor === aClean && x.mes === "TODOS");
                if (metaGeneral && metaGeneral.meta > 0) return metaGeneral.meta;

                return 45000;
            }, [metasAsesores]);

            const filtrarListaOperaciones = React.useCallback((lista) => {
                return lista.filter(m => {
                    if (isGerente) {
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else if (isJefeZonal) {
                        if (!sedesPermitidasUsuario.includes("TODAS") && !sedesPermitidasUsuario.includes(m.sede)) return false;
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else {
                        if (m.sede !== userSede) return false;
                    }

                    if (letraEquipoFiltro !== "TODOS" && !verificarAsesorEnEquipo(m.asesor, letraEquipoFiltro)) return false;
                    if (filtroMes !== "TODOS" && m.mesRegistro !== filtroMes) return false;
                    if (filtroDia !== "TODOS" && Number(m.diaSistema) !== Number(filtroDia)) return false;

                    const fComparar = m.fechaDesembolsoISO || m.fechaISO || "";
                    if (filtroDesde && fComparar && fComparar < filtroDesde) return false;
                    if (filtroHasta && fComparar && fComparar > filtroHasta) return false;

                    if (filtroAsesor !== "TODOS" && m.asesor !== filtroAsesor) return false;
                    if (filtroModalidad !== "TODAS" && (m.modalidad || "INDIVIDUAL") !== filtroModalidad) return false;

                    if (busquedaCliente.trim()) {
                        const q = busquedaCliente.toLowerCase();
                        const matchTitular = String(m.cliente || "").toLowerCase().includes(q);
                        const matchAsesor = String(m.asesor || "").toLowerCase().includes(q);
                        const matchMiembro = Array.isArray(m.integrantes) && m.integrantes.some(i => String(i.nombre || "").toLowerCase().includes(q));
                        if (!matchTitular && !matchAsesor && !matchMiembro) return false;
                    }
                    return true;
                });
            }, [isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, letraEquipoFiltro, verificarAsesorEnEquipo, filtroMes, filtroDia, filtroDesde, filtroHasta, filtroAsesor, filtroModalidad, busquedaCliente]);

            const movimientosFiltrados = React.useMemo(() => filtrarListaOperaciones(movimientos), [movimientos, filtrarListaOperaciones]);
            const expedientesFiltrados = React.useMemo(() => filtrarListaOperaciones(expedientesCaja), [expedientesCaja, filtrarListaOperaciones]);

            const resumenAnalitico = React.useMemo(() => {
                const desembolsos = movimientosFiltrados;
                const enCaja = expedientesFiltrados;
                const sedeActiva = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
                const mesBaseComp = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;

                const mapaAsesores = {};
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                metasParseadas
                    .filter(m => {
                        if (m.asesor === "__OFICINA__") return false;
                        if (isGerente) return sedeActiva === "TODAS" || m.sede === sedeActiva;
                        if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(m.sede)) && (sedeActiva === "TODAS" || m.sede === sedeActiva);
                        return m.sede === userSede;
                    })
                    .forEach(m => {
                        if (m.mes !== "TODOS" && filtroMes !== "TODOS" && m.mes !== filtroMes) return;
                        if (letraEquipoFiltro !== "TODOS" && !verificarAsesorEnEquipo(m.asesor, letraEquipoFiltro)) return;
                        const key = `${m.sede}__${m.asesor}`;
                        if (!mapaAsesores[key]) {
                            mapaAsesores[key] = {
                                key, sede: m.sede, asesor: m.asesor,
                                meta: obtenerMetaAsesorPorMes(m.sede, m.asesor, mesBaseComp),
                                desembolsado: 0, cn: 0, descuento: 0, neto: 0, operaciones: 0, grupales: 0,
                                enCajaBruto: 0, enCajaDesc: 0, enCajaNeto: 0, enCajaCN: 0, enCajaOps: 0,
                                creditos: [], expedientes: []
                            };
                        }
                    });

                desembolsos.forEach(d => {
                    if (!d.asesor) return;
                    const key = `${d.sede}__${d.asesor}`;
                    if (!mapaAsesores[key]) {
                        mapaAsesores[key] = {
                            key, sede: d.sede, asesor: d.asesor,
                            meta: obtenerMetaAsesorPorMes(d.sede, d.asesor, mesBaseComp),
                            desembolsado: 0, cn: 0, descuento: 0, neto: 0, operaciones: 0, grupales: 0,
                            enCajaBruto: 0, enCajaDesc: 0, enCajaNeto: 0, enCajaCN: 0, enCajaOps: 0,
                            creditos: [], expedientes: []
                        };
                    }
                    const item = mapaAsesores[key];
                    item.desembolsado += parseNum(d.monto);
                    item.cn += (parseInt(d.cantidadCN, 10) || 0);
                    item.descuento += parseNum(d.montoDescuento);
                    item.neto += Math.max(0, parseNum(d.monto) - parseNum(d.montoDescuento));
                    item.operaciones += 1;
                    if (d.modalidad === "GRUPAL") item.grupales += 1;
                    item.creditos.push(d);
                });

                enCaja.forEach(exp => {
                    if (!exp.asesor) return;
                    const key = `${exp.sede}__${exp.asesor}`;
                    if (!mapaAsesores[key]) {
                        mapaAsesores[key] = {
                            key, sede: exp.sede, asesor: exp.asesor,
                            meta: obtenerMetaAsesorPorMes(exp.sede, exp.asesor, mesBaseComp),
                            desembolsado: 0, cn: 0, descuento: 0, neto: 0, operaciones: 0, grupales: 0,
                            enCajaBruto: 0, enCajaDesc: 0, enCajaNeto: 0, enCajaCN: 0, enCajaOps: 0,
                            creditos: [], expedientes: []
                        };
                    }
                    const item = mapaAsesores[key];
                    const mb = parseNum(exp.monto);
                    const md = parseNum(exp.montoDescuento);
                    item.enCajaBruto += mb;
                    item.enCajaDesc += md;
                    item.enCajaNeto += Math.max(0, mb - md);
                    item.enCajaCN += (parseInt(exp.cantidadCN, 10) || 0);
                    item.enCajaOps += 1;
                    item.expedientes.push(exp);
                });

                const metaOficinaTotal = letraEquipoFiltro !== "TODOS"
                    ? Object.values(mapaAsesores).reduce((acc, a) => acc + a.meta, 0)
                    : sedesCatalogo
                        .filter(s => {
                            if (isGerente) return sedeActiva === "TODAS" || s.nombre === sedeActiva;
                            if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre)) && (sedeActiva === "TODAS" || s.nombre === sedeActiva);
                            return s.nombre === userSede;
                        })
                        .reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, mesBaseComp), 0) || 300000;

                const totalBruto = desembolsos.reduce((acc, d) => acc + parseNum(d.monto), 0);
                const totalDescuento = desembolsos.reduce((acc, d) => acc + parseNum(d.montoDescuento), 0);
                const totalNeto = Math.max(0, totalBruto - totalDescuento);
                const totalCN = desembolsos.reduce((acc, d) => acc + (parseInt(d.cantidadCN, 10) || 0), 0);
                const totalGrupales = desembolsos.filter(d => d.modalidad === "GRUPAL").length;

                const cajaBruto = enCaja.reduce((acc, d) => acc + parseNum(d.monto), 0);
                const cajaDescuento = enCaja.reduce((acc, d) => acc + parseNum(d.montoDescuento), 0);
                const cajaNeto = Math.max(0, cajaBruto - cajaDescuento);
                const cajaCN = enCaja.reduce((acc, d) => acc + (parseInt(d.cantidadCN, 10) || 0), 0);
                const cajaGrupales = enCaja.filter(d => d.modalidad === "GRUPAL").length;

                const proyectadoBruto = totalBruto + cajaBruto;
                const proyectadoDescuento = totalDescuento + cajaDescuento;
                const proyectadoNeto = totalNeto + cajaNeto;
                const proyectadoCN = totalCN + cajaCN;

                const avanceOficinaPct = metaOficinaTotal > 0 ? (totalBruto / metaOficinaTotal) * 100 : 0;
                const avanceProyectadoPct = metaOficinaTotal > 0 ? (proyectadoBruto / metaOficinaTotal) * 100 : 0;
                const pctDescuentoGlobal = totalBruto > 0 ? (totalDescuento / totalBruto) * 100 : 0;

                const tablaAsesores = Object.values(mapaAsesores).map(a => {
                    const movsMesComp = movimientos.filter(m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesCompResumen);
                    const desembolsadoMesComp = movsMesComp.reduce((s, x) => s + parseNum(x.monto), 0);
                    const metaMesComp = obtenerMetaAsesorPorMes(a.sede, a.asesor, mesCompResumen);
                    const avancePctMesComp = metaMesComp > 0 ? (desembolsadoMesComp / metaMesComp) * 100 : 0;

                    const avancePct = a.meta > 0 ? (a.desembolsado / a.meta) * 100 : 0;
                    const proyectadoTotalAsesor = a.desembolsado + a.enCajaBruto;
                    const avanceProyectadoAsesorPct = a.meta > 0 ? (proyectadoTotalAsesor / a.meta) * 100 : 0;
                    const porcentualOficina = totalBruto > 0 ? (a.descuento / totalBruto) * 100 : 0;
                    const faltaMeta = Math.max(0, a.meta - a.desembolsado);

                    return {
                        ...a, avancePct, proyectadoTotalAsesor, avanceProyectadoAsesorPct,
                        porcentualOficina, faltaMeta, desembolsadoMesComp, metaMesComp, avancePctMesComp
                    };
                }).sort((a, b) => b.desembolsado - a.desembolsado);

                const nombresAsesoresUnicos = Array.from(new Set(Object.values(mapaAsesores).map(a => a.asesor)));

                const evolucionDiariaFilas = [];
                const totalesDesembolsoPorAsesor = {};
                const totalesDescuentoPorAsesor = {};
                nombresAsesoresUnicos.forEach(nom => {
                    totalesDesembolsoPorAsesor[nom] = 0;
                    totalesDescuentoPorAsesor[nom] = 0;
                });

                let granTotalDesembolsos = 0, granTotalDescuentos = 0, granTotalNeto = 0;

                for (let dia = 1; dia <= 31; dia++) {
                    const desembolsosPorAsesorDia = {};
                    const descuentosPorAsesorDia = {};
                    nombresAsesoresUnicos.forEach(nom => {
                        desembolsosPorAsesorDia[nom] = 0;
                        descuentosPorAsesorDia[nom] = 0;
                    });

                    let totalDesDia = 0, totalDescDia = 0;

                    desembolsos.filter(d => Number(d.diaSistema) === dia).forEach(d => {
                        const mBruto = parseNum(d.monto);
                        const mDesc = parseNum(d.montoDescuento);
                        const ase = d.asesor;
                        if (ase && desembolsosPorAsesorDia[ase] !== undefined) {
                            desembolsosPorAsesorDia[ase] += mBruto;
                            descuentosPorAsesorDia[ase] += mDesc;
                            totalesDesembolsoPorAsesor[ase] += mBruto;
                            totalesDescuentoPorAsesor[ase] += mDesc;
                        }
                        totalDesDia += mBruto;
                        totalDescDia += mDesc;
                    });

                    const netoDia = Math.max(0, totalDesDia - totalDescDia);
                    granTotalDesembolsos += totalDesDia;
                    granTotalDescuentos += totalDescDia;
                    granTotalNeto += netoDia;

                    evolucionDiariaFilas.push({ dia, desembolsosPorAsesorDia, totalDesDia, descuentosPorAsesorDia, totalDescDia, netoDia });
                }

                const comparativoSedes = sedesCatalogo
                    .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                    .map(s => {
                        const metaS = obtenerMetaOficinaPorMes(s.nombre, mesBaseComp);
                        const desSede = desembolsos.filter(d => d.sede === s.nombre);
                        const expSede = enCaja.filter(d => d.sede === s.nombre);
                        const brutoS = desSede.reduce((a, b) => a + parseNum(b.monto), 0);
                        const descS = desSede.reduce((a, b) => a + parseNum(b.montoDescuento), 0);
                        const cnS = desSede.reduce((a, b) => a + (parseInt(b.cantidadCN, 10) || 0), 0);
                        const cajaBrutoS = expSede.reduce((a, b) => a + parseNum(b.monto), 0);
                        return {
                            sede: s.nombre, meta: metaS, bruto: brutoS, cajaBruto: cajaBrutoS,
                            proyectado: brutoS + cajaBrutoS,
                            avancePct: metaS > 0 ? (brutoS / metaS) * 100 : 0,
                            avanceProyPct: metaS > 0 ? ((brutoS + cajaBrutoS) / metaS) * 100 : 0,
                            cn: cnS, descuento: descS, neto: Math.max(0, brutoS - descS), operaciones: desSede.length
                        };
                    });

                return {
                    metaOficinaTotal, totalBruto, totalDescuento, totalNeto, totalCN, totalGrupales,
                    cajaBruto, cajaDescuento, cajaNeto, cajaCN, cajaGrupales,
                    proyectadoBruto, proyectadoDescuento, proyectadoNeto, proyectadoCN,
                    avanceOficinaPct, avanceProyectadoPct, pctDescuentoGlobal,
                    tablaAsesores, nombresAsesoresUnicos, evolucionDiariaFilas,
                    totalesDesembolsoPorAsesor, totalesDescuentoPorAsesor,
                    granTotalDesembolsos, granTotalDescuentos, granTotalNeto, comparativoSedes
                };
            }, [movimientosFiltrados, expedientesFiltrados, movimientos, sedesCatalogo, metasAsesores, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, letraEquipoFiltro, verificarAsesorEnEquipo, filtroMes, mesCompResumen, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const itemsColumnasEnCuadros = React.useMemo(() => {
                return resumenAnalitico.tablaAsesores.map(a => ({
                    concepto: (isGerente || isJefeZonal) && selectedSedeVista === "TODAS" ? `${a.asesor} (${a.sede.slice(0, 3)})` : a.asesor,
                    actualPct: a.avancePct,
                    anteriorPct: a.avancePctMesComp,
                    actualMonto: a.desembolsado,
                    anteriorMonto: a.desembolsadoMesComp,
                    meta: a.meta
                }));
            }, [resumenAnalitico.tablaAsesores, isGerente, isJefeZonal, selectedSedeVista]);

            const listaRadarCreditos = React.useMemo(() => {
                return movimientosFiltrados
                    .filter(m => parseInt(m.nroCuotas, 10) > 0 && parseInt(m.frecuencia, 10) > 0)
                    .map(m => {
                        const sim = simularCreditoCrediban({
                            monto: m.monto, frecuencia: m.frecuencia, nroCuotas: m.nroCuotas,
                            tasaTEM: m.tasaTEM, diasGracia: m.diasGracia,
                            fechaDesembolsoISO: m.fechaDesembolsoISO || m.fechaISO
                        });
                        return { ...m, sim };
                    })
                    .filter(m => m.sim.activo);
            }, [movimientosFiltrados]);

            const handleExportarReportePDF = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const sedeTit = (isGerente || isJefeZonal) ? selectedSedeVista : userSede;
                const logoB64 = await obtenerLogoCredibanBase64();

                doc.setFillColor(27, 67, 50);
                doc.rect(0, 0, 297, 24, 'F');
                if (logoB64) doc.addImage(logoB64, 'PNG', 10, 2.5, 14, 19);
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(15);
                doc.text(`CREDIBAN PERÚ - REPORTE DE AVANCE, PROYECCIÓN DE CAJA Y EVOLUCIÓN (${sedeTit})`, 28, 11);
                doc.setFontSize(9);

                                            <div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Cuotas</label>
                                                <input type="number" value={formCuotas} onChange={e => setFormCuotas(e.target.value)} className="w-full border rounded-xl px-2 py-1.5 text-xs font-black bg-white" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Tasa TEM (%)</label>
                                                <input type="number" step="0.01" value={formTasaTEM} onChange={e => setFormTasaTEM(e.target.value)} className="w-full border rounded-xl px-2 py-1.5 text-xs font-black text-[#59B447] bg-white" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Gracia (d)</label>
                                                <input type="number" value={formDiasGracia} onChange={e => setFormDiasGracia(e.target.value)} className="w-full border rounded-xl px-2 py-1.5 text-xs font-black bg-white" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <button type="submit" disabled={savingMov} className="w-full py-3.5 rounded-2xl font-black text-white text-xs uppercase bg-[#59B447] hover:bg-[#4a9c3a] shadow-lg">
                                                ✅ 1. Guardar como Desembolsado
                                            </button>
                                            <button type="button" disabled={savingMov} onClick={handleRegistrarExpedienteCaja} className="w-full py-3.5 rounded-2xl font-black text-slate-950 text-xs uppercase bg-amber-400 hover:bg-amber-300 border-2 border-amber-500 shadow-lg">
                                                ⏳ 2. Guardar como Expediente en Caja
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div className="lg:col-span-5">
                                    <div className="bg-gradient-to-br from-[#1b4332] to-slate-900 text-white rounded-3xl p-5 shadow-lg space-y-4">
                                        <h3 className="text-sm font-black border-b border-white/15 pb-2">Simulador en Vivo CREDIBAN</h3>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="bg-white/10 p-3 rounded-2xl">
                                                <div className="text-[10px] text-emerald-300 font-bold uppercase">Efectivo Neto</div>
                                                <div className="text-xl font-black">{formatMoney(totalesFormulario.efectivoNeto)}</div>
                                            </div>
                                            <div className="bg-white/10 p-3 rounded-2xl">
                                                <div className="text-[10px] text-emerald-300 font-bold uppercase">Cuota Sistema</div>
                                                <div className="text-xl font-black text-amber-300">{simulacionEnVivo.activo ? formatMoney(simulacionEnVivo.cuota) : "S/ 0.00"}</div>
                                            </div>
                                            <div className="bg-blue-500/20 p-3 rounded-2xl">
                                                <div className="text-[10px] text-blue-200 font-bold uppercase">🚀 Renovación 80%</div>
                                                <div className="text-sm font-black">{simulacionEnVivo.activo ? formatDateDDMMYYYY(simulacionEnVivo.fechaRenovacion80ISO) : "-"}</div>
                                            </div>
                                            <div className="bg-amber-500/20 p-3 rounded-2xl">
                                                <div className="text-[10px] text-amber-200 font-bold uppercase">🏁 Vencimiento</div>
                                                <div className="text-sm font-black">{simulacionEnVivo.activo ? formatDateDDMMYYYY(simulacionEnVivo.fechaVencimientoISO) : "-"}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA 6: RADAR DE RENOVACIONES (80%) */}
                        {activeTab === "RADAR" && puedeVerDetalleAvanzado && (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-gradient-to-r from-blue-800 to-indigo-900 text-white p-5 flex justify-between items-center">
                                    <h3 className="text-sm font-black uppercase">🎯 Radar Comercial: Renovaciones al 80% y Cálculo Inverso ({listaRadarCreditos.length})</h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-xs border-collapse">
                                        <thead className="bg-slate-100 text-slate-600 uppercase font-extrabold border-b">
                                            <tr>
                                                <th className="p-3 text-left">Sede / Asesor</th>
                                                <th className="p-3 text-left">Cliente o Grupo</th>
                                                <th className="p-3 text-right">Monto / Cuota</th>
                                                <th className="p-3 text-center">🚀 Renovación (80%)</th>
                                                <th className="p-3 text-center">🏁 Vencimiento</th>
                                                <th className="p-3 text-right">Saldo Liquidar Hoy</th>
                                                <th className="p-3 text-center">Acción</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 font-semibold">
                                            {listaRadarCreditos.map((m, idx) => (
                                                <tr key={idx} className="hover:bg-blue-50/40 cursor-pointer" onClick={() => setItemDetalleModal(m)}>
                                                    <td className="p-3"><strong>{m.asesor}</strong><div className="text-[10px] text-slate-500">📍 {m.sede}</div></td>
                                                    <td className="p-3 font-extrabold text-slate-900">{m.cliente}</td>
                                                    <td className="p-3 text-right"><strong>{formatMoney(m.monto)}</strong><div className="text-[11px] text-emerald-700">Cuota: {formatMoney(m.sim.cuota)}</div></td>
                                                    <td className="p-3 text-center font-black text-blue-700">{formatDateDDMMYYYY(m.sim.fechaRenovacion80ISO)}</td>
                                                    <td className="p-3 text-center font-black text-amber-800">{formatDateDDMMYYYY(m.sim.fechaVencimientoISO)}</td>
                                                    <td className="p-3 text-right font-black text-blue-900">{formatMoney(m.sim.saldoCancelarCapIntHoy)}</td>
                                                    <td className="p-3 text-center"><button className="bg-indigo-600 text-white font-extrabold px-3 py-1 rounded-xl text-[11px]">📅 Ver Plan</button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA 7: BASE DETALLADA DE DESEMBOLSOS */}
                        {activeTab === "BASE" && puedeVerDetalleAvanzado && (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="bg-slate-800 text-white px-5 py-3 flex justify-between items-center">
                                    <h3 className="text-xs font-black uppercase">📋 Base Histórica de Desembolsos ({movimientosFiltrados.length})</h3>
                                </div>
                                <div className="overflow-x-auto max-h-[600px]">
                                    <table className="w-full text-xs border-collapse">
                                        <thead className="bg-slate-100 text-slate-600 sticky top-0 uppercase font-extrabold border-b">
                                            <tr>
                                                <th className="p-3 text-left">Fecha</th>
                                                <th className="p-3 text-center">Sede</th>
                                                <th className="p-3 text-center">Día / Mes</th>
                                                <th className="p-3 text-left">Asesor</th>
                                                <th className="p-3 text-left">Cliente / Grupo</th>
                                                <th className="p-3 text-center">Tipo / CN</th>
                                                <th className="p-3 text-right">Monto Desemb.</th>
                                                <th className="p-3 text-right">Descuento</th>
                                                <th className="p-3 text-center">Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 font-semibold">
                                            {movimientosFiltrados.map((m, idx) => (
                                                <tr key={m.idRegistro || idx} className="hover:bg-slate-50">
                                                    <td className="p-2.5 text-slate-500">{m.marcaTemporal}</td>
                                                    <td className="p-2.5 text-center font-black">{m.sede}</td>
                                                    <td className="p-2.5 text-center">Día {m.diaSistema} ({m.mesRegistro})</td>
                                                    <td className="p-2.5 font-extrabold">{m.asesor}</td>
                                                    <td className="p-2.5 font-extrabold cursor-pointer text-slate-900 hover:text-[#59B447]" onClick={() => setItemDetalleModal(m)}>{m.cliente}</td>
                                                    <td className="p-2.5 text-center">{m.tipoCliente} (CN: {m.cantidadCN})</td>
                                                    <td className="p-2.5 text-right font-black">{formatMoney(m.monto)}</td>
                                                    <td className="p-2.5 text-right text-blue-700">{formatMoney(m.montoDescuento)}</td>
                                                    <td className="p-2.5 text-center space-x-1">
                                                        <button onClick={() => setItemDetalleModal(m)} className="bg-[#59B447] text-white font-extrabold px-2.5 py-1 rounded-lg text-[11px]">📅 Plan</button>
                                                        <button onClick={() => handleEliminarRegistro(m)} className="bg-red-50 text-red-600 font-extrabold px-2 py-1 rounded-lg text-[11px]">🗑️</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA 8: CONFIGURACIÓN DE METAS, SEDES Y ASIGNACIÓN DE EQUIPOS (A - J) */}
                        {activeTab === "CONFIG" && (isGerente || isAdmin || isJefeZonal) && (
                            <div className="space-y-5">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                                        <h3 className="text-sm font-black uppercase text-slate-800">🎯 Configurar Meta Mensual (Por Mes y Sede)</h3>
                                        <form onSubmit={handleGuardarMetaMensual} className="space-y-3">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-xs font-extrabold text-slate-600 block mb-1">📍 Sede</label>
                                                    <select value={isGerente ? metaSedeSelect : userSede} disabled={!isGerente} onChange={e => setMetaSedeSelect(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold bg-slate-50">
                                                        {sedesCatalogo.map(s => <option key={s.nombre} value={s.nombre}>{s.nombre}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-extrabold text-emerald-700 block mb-1">📅 Mes</label>
                                                    <select value={metaMesSelect} onChange={e => setMetaMesSelect(e.target.value)} className="w-full border-2 border-[#59B447] rounded-xl px-3 py-2 text-xs font-black bg-emerald-50/40">
                                                        {MESES_ANIO.map(m => <option key={m} value={m}>{m}</option>)}
                                                        <option value="TODOS">GENERAL</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-xl">
                                                <button type="button" onClick={() => { setMetaTipoSelect("ASESOR"); setMetaAsesorMonto("45000"); }} className={`py-2 rounded-lg text-xs font-black ${metaTipoSelect === "ASESOR" ? "bg-white shadow" : "text-slate-500"}`}>👤 Meta Asesor</button>
                                                <button type="button" onClick={() => { setMetaTipoSelect("OFICINA"); setMetaAsesorMonto("300000"); }} className={`py-2 rounded-lg text-xs font-black ${metaTipoSelect === "OFICINA" ? "bg-white shadow" : "text-slate-500"}`}>🏢 Meta Oficina</button>
                                            </div>
                                            {metaTipoSelect === "ASESOR" && (
                                                <input type="text" placeholder="Nombre del Asesor..." value={metaAsesorNombre} onChange={e => setMetaAsesorNombre(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold uppercase" required />
                                            )}
                                            <input type="number" step="500" value={metaAsesorMonto} onChange={e => setMetaAsesorMonto(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-black" required />
                                            <button type="submit" className="w-full bg-[#59B447] text-white font-black py-3 rounded-2xl text-xs uppercase shadow">💾 Guardar Meta</button>
                                        </form>
                                    </div>

                                    {isGerente && (
                                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                                            <h3 className="text-sm font-black uppercase text-[#1b4332] border-b pb-2">🏢 Añadir Nueva Sede CREDIBAN</h3>
                                            <form onSubmit={handleCrearNuevaSede} className="space-y-3">
                                                <input type="text" placeholder="Nombre de la Nueva Sede..." value={nuevaSedeNombre} onChange={e => setNuevaSedeNombre(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold uppercase" required />
                                                <input type="number" step="1000" value={nuevaSedeMeta} onChange={e => setNuevaSedeMeta(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-black" required />
                                                <button type="submit" className="w-full bg-[#1b4332] text-white font-black py-3 rounded-2xl text-xs uppercase shadow">➕ Crear Sede en Google Sheets</button>
                                            </form>
                                        </div>
                                    )}
                                </div>

                                {/* PANEL DE VINCULACIÓN DE ASESORES CON LÍDERES DE EQUIPO (A - J) */}
                                <div className="bg-white rounded-3xl shadow-sm border border-purple-200 overflow-hidden">
                                    <div className="bg-purple-900 text-white px-5 py-3">
                                        <h3 className="text-xs font-black uppercase">👥 Asignación de Asesores por Líder de Equipo — Letras (A) hasta la (J)</h3>
                                        <p className="text-[11px] text-purple-200">El sistema detecta automáticamente el equipo desde tu Script de Usuarios y también puedes ajustarlo aquí:</p>
                                    </div>
                                    <div className="p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                                        {resumenAnalitico.tablaAsesores.map(a => {
                                            const limpio = limpiarNombreAsesor(a.asesor);
                                            const letraActual = mapaEquiposAutomatico[limpio] || "";
                                            return (
                                                <div key={a.key} className="p-3 rounded-2xl border border-slate-200 bg-slate-50 flex flex-col justify-between gap-2">
                                                    <div>
                                                        <div className="text-xs font-black text-slate-900">👤 {a.asesor}</div>
                                                        <div className="text-[10px] font-bold text-slate-400">📍 {a.sede}</div>
                                                    </div>
                                                    <select
                                                        value={letraActual}
                                                        onChange={e => handleAsignarEquipoManual(a.asesor, e.target.value)}
                                                        className="w-full border border-purple-300 rounded-xl px-2 py-1.5 text-xs font-black bg-white text-purple-950"
                                                    >
                                                        <option value="">-- Sin Equipo --</option>
                                                        {LETRAS_EQUIPOS.map(l => <option key={l} value={l}>Equipo ({l})</option>)}
                                                    </select>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {itemDetalleModal && (
                        <ModalDetalleGrupoYSimulador
                            item={itemDetalleModal}
                            onClose={() => setItemDetalleModal(null)}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
