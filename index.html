<body class="text-slate-800 antialiased selection:bg-[#59B447] selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // ============================================================================
        // 1. CONEXIÓN OFICIAL A TUS SERVIDORES DE GOOGLE APPS SCRIPT
        // ============================================================================
        const GAS_DESEMBOLSOS_URL = "https://script.google.com/macros/s/AKfycbwNGWBib_Y6o5Qr13w8ppSbEckXXjtx3AHtxgN-rAlaBew4DSLVdqRwkGzTRnepRZZe/exec";
        const GAS_USUARIOS_URL    = "https://script.google.com/macros/s/AKfycbyPGo-OSC0KZcz03bAMpKQ82cipc2T1LNztaI229FhYqqNNXqG1oSb6hPPgVSSU3piqiw/exec";

        const MESES_ANIO = [
            "ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO",
            "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"
        ];

        // Feriados oficiales de tu Simulador CREDIBAN
        const FERIADOS_PERU_MM_DD = [
            "01-01", "04-02", "04-03", "05-01", "06-07", "06-29",
            "07-23", "07-28", "07-29", "08-06", "08-30", "10-08",
            "11-01", "12-08", "12-09", "12-25"
        ];

        // Historial base de Metas por Mes (Junio, Julio y Octubre 2026)
        const HISTORIAL_METAS_BASE = {
            "JUNIO": {
                oficinas: { "HUACHO": 270000, "HUARAZ": 70000 },
                asesores: {
                    "HUACHO__MELISSA": 40000, "HUACHO__HEIDY": 40000, "HUACHO__HUGO": 60000,
                    "HUACHO__BRITHANY": 60000, "HUACHO__ARTURO": 45000,
                    "HUARAZ__SHEILA": 40000, "HUARAZ__YOVANA": 15000, "HUARAZ__NASARIO": 15000
                }
            },
            "JULIO": {
                oficinas: { "HUACHO": 270000, "HUARAZ": 95000 },
                asesores: {
                    "HUACHO__MELISSA": 45000, "HUACHO__HEIDY": 45000, "HUACHO__HUGO": 65000,
                    "HUACHO__BRITHANY": 65000, "HUACHO__ARTURO": 50000,
                    "HUARAZ__SHEILA": 40000, "HUARAZ__YOVANA": 15000, "HUARAZ__CORONEL": 40000
                }
            },
            "OCTUBRE": {
                oficinas: { "HUACHO": 300000, "HUARAZ": 115000 },
                asesores: {
                    "HUACHO__MELISSA": 45000, "HUACHO__HEIDY": 45000, "HUACHO__HUGO": 65000,
                    "HUACHO__BRITHANY": 50000, "HUACHO__ARTURO": 50000, "HUACHO__ABIGAIL": 50000,
                    "HUARAZ__SHEILA": 40000, "HUARAZ__YOVANA": 25000, "HUARAZ__CORONEL": 50000
                }
            }
        };

        // ============================================================================
        // 2. LOGO OFICIAL CREDIBAN CON LEMA "empieza a construir tus sueños"
        // ============================================================================
        const CREDIBAN_SVG_RAW = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" width="180" height="240">
            <g fill="#59B447">
                <rect x="90" y="8" width="24" height="13" rx="6.5"/>
                <rect x="71" y="31" width="61" height="13" rx="6.5"/>
                <rect x="50" y="55" width="74" height="13" rx="6.5"/>
                <rect x="31" y="79" width="75" height="13" rx="6.5"/>
                <rect x="24" y="103" width="63" height="13" rx="6.5"/>
                <rect x="37" y="128" width="24" height="13" rx="6.5"/>
                <path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/>
            </g>
        </svg>`;

        const obtenerLogoCredibanBase64 = () => {
            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    const svgBlob = new Blob([CREDIBAN_SVG_RAW], { type: "image/svg+xml;charset=utf-8" });
                    const url = URL.createObjectURL(svgBlob);
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = 180;
                        canvas.height = 240;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, 180, 240);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL("image/png"));
                    };
                    img.onerror = () => resolve(null);
                    img.src = url;
                } catch (e) {
                    resolve(null);
                }
            });
        };

        function CredibanLogo({ size = "md" }) {
            const isLg = size === "lg";
            return (
                <div className="inline-flex items-center gap-3 select-none">
                    <svg
                        className={isLg ? "w-14 h-16 shrink-0" : "w-9 h-12 shrink-0"}
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 180 240"
                    >
                        <g fill="#59B447">
                            <rect x="90" y="8" width="24" height="13" rx="6.5"/>
                            <rect x="71" y="31" width="61" height="13" rx="6.5"/>
                            <rect x="50" y="55" width="74" height="13" rx="6.5"/>
                            <rect x="31" y="79" width="75" height="13" rx="6.5"/>
                            <rect x="24" y="103" width="63" height="13" rx="6.5"/>
                            <rect x="37" y="128" width="24" height="13" rx="6.5"/>
                            <path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/>
                        </g>
                    </svg>
                    <div className="flex flex-col items-start">
                        <div className={`logo-crediban-title font-bold tracking-tight text-[#59B447] leading-none ${isLg ? 'text-3xl' : 'text-2xl'}`}>
                            CREDIBAN
                        </div>
                        <div className="w-full h-[2px] bg-[#59B447] my-1"></div>
                        <div className={`logo-crediban-sub font-semibold italic text-slate-500 leading-none ${isLg ? 'text-xs' : 'text-[10px]'}`}>
                            empieza a construir tus sueños
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 3. MOTOR DE CÁLCULO FINANCIERO EXACTO DE TU SIMULADOR + CÁLCULO INVERSO
        // ============================================================================
        const parseNum = (v) => {
            if (typeof v === 'number') return isNaN(v) ? 0 : v;
            if (!v) return 0;
            const n = parseFloat(String(v).replace(/[^\d.-]/g, ''));
            return isNaN(n) ? 0 : n;
        };

        const formatMoney = (n) => {
            const val = parseNum(n);
            return "S/ " + val.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const formatShortSoles = (n) => {
            const val = parseNum(n);
            if (Math.abs(val) < 0.005) return "S/.0";
            const hasDecimals = Math.abs(val - Math.round(val)) >= 0.01;
            return "S/." + val.toLocaleString('es-PE', {
                minimumFractionDigits: hasDecimals ? 1 : 0,
                maximumFractionDigits: hasDecimals ? 2 : 0
            });
        };

        const getTodayISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const isHolidayOrWeekend = (dateObj) => {
            const day = dateObj.getDay();
            if (day === 0 || day === 6) return true;
            const mmdd = String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
            return FERIADOS_PERU_MM_DD.includes(mmdd);
        };

        const formatDateDDMMYYYY = (dateOrISO) => {
            if (!dateOrISO) return "-";
            if (typeof dateOrISO === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateOrISO)) {
                const [y, m, d] = dateOrISO.split('-');
                return `${d}/${m}/${y}`;
            }
            const dt = new Date(dateOrISO);
            if (isNaN(dt.getTime())) return String(dateOrISO);
            return `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}/${dt.getFullYear()}`;
        };

        const toISODateString = (dateObj) => {
            if (!dateObj || isNaN(dateObj.getTime())) return "";
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        };

        // Fórmulas exactas del código de tu Simulador CREDIBAN
        const obtenerCuotaRawCrediban = (monto, cuotas, frecuencia, diasGracia, tasaTEMDec) => {
            if (monto <= 0 || cuotas <= 0 || frecuencia <= 0) return 0;
            if (tasaTEMDec <= 0) return monto / cuotas;
            const factorGracia = Math.pow(1 + tasaTEMDec, diasGracia / 30);
            const r = Math.pow(1 + tasaTEMDec, frecuencia / 30) - 1;
            if (r === 0) return (monto * factorGracia) / cuotas;
            return (monto * factorGracia * r) / (1 - Math.pow(1 + r, -cuotas));
        };

        const obtenerCuotaSistemaCrediban = (monto, cuotas, frecuencia, diasGracia, tasaPorcentaje) => {
            const raw = obtenerCuotaRawCrediban(monto, cuotas, frecuencia, diasGracia, tasaPorcentaje / 100);
            return Math.ceil((raw - 1e-9) * 10) / 10;
        };

        /**
         * Ejecuta el Simulador de Créditos idéntico a tu código y devuelve los datos
         * para el Modal de Plan de Pagos (Imagen 2) y el Radar de Renovaciones (80%)
         */
        const simularCreditoCrediban = ({ monto, frecuencia, nroCuotas, tasaTEM, diasGracia = 0, fechaDesembolsoISO }) => {
            const P = parseNum(monto);
            const F = parseInt(frecuencia, 10) || 0;
            const N = parseInt(nroCuotas, 10) || 0;
            const TEM_PCT = parseNum(tasaTEM);
            const tasaTEMDec = TEM_PCT / 100;
            const G = parseInt(diasGracia, 10) || 0;

            if (P <= 0 || F <= 0 || N <= 0) {
                return {
                    activo: false, cuota: 0, totalPagar: 0, interesTotal: 0,
                    cuota80Num: 0, fechaRenovacion80ISO: "", fechaVencimientoISO: "",
                    porcentajeAvanceTiempo: 0, estadoRenovacion: "SIN_DATOS",
                    cuotasCumplidasHoy: 0, cuotasRestantesHoy: 0,
                    saldoCancelarCapIntHoy: 0, saldoCapitalRestanteHoy: 0,
                    cronograma: []
                };
            }

            // 1. Generar Fechas exactamente como calcularCronograma() de tu Simulador
            const baseStr = fechaDesembolsoISO && /^\d{4}-\d{2}-\d{2}$/.test(fechaDesembolsoISO) ? fechaDesembolsoISO : getTodayISO();
            const [y, m, d] = baseStr.split('-').map(Number);
            let currentDate = new Date(y, m - 1, d, 12, 0, 0);
            const fechas = [];

            for (let i = 1; i <= N; i++) {
                const diasAAgregar = (i === 1) ? (F + G) : F;
                currentDate.setDate(currentDate.getDate() + diasAAgregar);
                if (F === 1) {
                    while (isHolidayOrWeekend(currentDate)) {
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                }
                fechas.push(new Date(currentDate));
            }

            // 2. Cálculo de Cuota Fija con Redondeo 0.10
            const r = Math.pow(1 + tasaTEMDec, F / 30) - 1;
            const cuotaFija = obtenerCuotaSistemaCrediban(P, N, F, G, TEM_PCT);

            let saldoCapital = P;
            let saldoTotalAPagar = Math.round((cuotaFija * N) * 100) / 100;
            let totalCapital = 0;
            let totalInteres = 0;
            let totalCuota = 0;

            const cronograma = [];

            for (let i = 1; i <= N; i++) {
                const r_periodo = (i === 1) ? (Math.pow(1 + tasaTEMDec, (F + G) / 30) - 1) : r;
                const interes = saldoCapital * r_periodo;
                let interesRedondeado = Math.round(interes * 100) / 100;
                let capital = 0;

                if (i === N) {
                    capital = saldoCapital;
                    interesRedondeado = Math.round((cuotaFija - capital) * 100) / 100;
                } else {
                    capital = Math.round((cuotaFija - interesRedondeado) * 100) / 100;
                }

                saldoCapital = Math.round((saldoCapital - capital) * 100) / 100;
                if (saldoCapital < 0.01) saldoCapital = 0;

                saldoTotalAPagar = Math.round((saldoTotalAPagar - cuotaFija) * 100) / 100;
                if (saldoTotalAPagar < 0.01 || i === N) saldoTotalAPagar = 0;

                totalCapital += capital;
                totalInteres += interesRedondeado;
                totalCuota += cuotaFija;

                const fObj = fechas[i - 1];
                cronograma.push({
                    nro: i,
                    fechaISO: toISODateString(fObj),
                    fechaTexto: formatDateDDMMYYYY(fObj),
                    cuota: cuotaFija,
                    capital: capital,
                    interes: interesRedondeado,
                    saldo: saldoCapital,
                    saldoTotal: saldoTotalAPagar
                });
            }

            const cuota80Idx = Math.max(0, Math.ceil(N * 0.80) - 1);
            const fechaRenovacion80ISO = cronograma[cuota80Idx] ? cronograma[cuota80Idx].fechaISO : "";
            const fechaVencimientoISO  = cronograma[N - 1] ? cronograma[N - 1].fechaISO : "";

            const hoyISO = getTodayISO();
            const cuotasCumplidasHoy = cronograma.filter(c => c.fechaISO <= hoyISO).length;
            const cuotasRestantesHoy = Math.max(0, N - cuotasCumplidasHoy);
            const porcentajeAvanceTiempo = Math.min(100, Math.round((cuotasCumplidasHoy / N) * 100));

            // Montos sugeridos de cancelación/descuento en caso de Renovación hoy
            const saldoCancelarCapIntHoy = Math.round(cuotasRestantesHoy * cuotaFija * 100) / 100;
            const saldoCapitalRestanteHoy = cuotasCumplidasHoy === 0
                ? P
                : (cronograma[cuotasCumplidasHoy - 1] ? cronograma[cuotasCumplidasHoy - 1].saldo : 0);

            const hoyMs = new Date(hoyISO + "T12:00:00").getTime();
            const vencMs = fechaVencimientoISO ? new Date(fechaVencimientoISO + "T12:00:00").getTime() : hoyMs;
            const renovMs = fechaRenovacion80ISO ? new Date(fechaRenovacion80ISO + "T12:00:00").getTime() : hoyMs;

            const diasParaVencer = Math.round((vencMs - hoyMs) / (1000 * 60 * 60 * 24));
            const diasParaRenovar = Math.round((renovMs - hoyMs) / (1000 * 60 * 60 * 24));

            let estadoRenovacion = "VIGENTE";
            if (diasParaVencer < 0) estadoRenovacion = "VENCIDO";
            else if (diasParaRenovar <= 0 && diasParaVencer >= 0) estadoRenovacion = "LISTO_RENOVAR_80";
            else if (diasParaRenovar > 0 && diasParaRenovar <= 7) estadoRenovacion = "PROXIMO_RENOVAR";

            return {
                activo: true,
                cuota: cuotaFija,
                totalPagar: Math.round(totalCuota * 100) / 100,
                interesTotal: Math.max(0, Math.round(totalInteres * 100) / 100),
                cuota80Num: cuota80Idx + 1,
                cuotasCumplidasHoy,
                cuotasRestantesHoy,
                saldoCancelarCapIntHoy,
                saldoCapitalRestanteHoy,
                fechaRenovacion80ISO,
                fechaVencimientoISO,
                porcentajeAvanceTiempo,
                estadoRenovacion,
                diasParaVencer,
                diasParaRenovar,
                cronograma
            };
        };

        /**
         * Motor de Cálculo Inverso (Extraído de tu código: Modo 1 Hallar Tasa % | Modo 2 Hallar Monto S/)
         */
        const calcularInversoCrediban = ({ modo, monto, tasaFija, cuotas, frecuencia, diasGracia, cuotaObjetivo }) => {
            const N = parseInt(cuotas, 10) || 0;
            const F = parseInt(frecuencia, 10) || 0;
            const G = parseInt(diasGracia, 10) || 0;
            const C_OBJ = parseNum(cuotaObjetivo);

            if (modo === "tasa") {
                const P = parseNum(monto);
                if (P <= 0 || N <= 0 || F <= 0 || C_OBJ <= 0) {
                    return { error: "Completa Monto, Cuotas y Cuota Objetivo mayores a 0." };
                }
                const cuotaMinSinInteres = P / N;
                if (C_OBJ <= cuotaMinSinInteres && G >= 0) {
                    return {
                        error: `⚠️ La cuota objetivo (${formatMoney(C_OBJ)}) es menor o igual al capital puro por cuota (${formatMoney(cuotaMinSinInteres)}). Incrementa la cuota o el plazo.`
                    };
                }

                let low = 0.0, high = 10.0;
                while (obtenerCuotaRawCrediban(P, N, F, G, high) < C_OBJ && high < 1000) {
                    high *= 2;
                }
                for (let iter = 0; iter < 100; iter++) {
                    const mid = (low + high) / 2;
                    if (obtenerCuotaRawCrediban(P, N, F, G, mid) < C_OBJ) low = mid;
                    else high = mid;
                }

                const tasaExactaPct = ((low + high) / 2) * 100;
                const candFloor = Math.floor(tasaExactaPct * 100) / 100;
                const candRound = Math.round(tasaExactaPct * 100) / 100;
                const candCeil  = Math.ceil(tasaExactaPct * 100) / 100;

                let mejorTasa2Dec = candRound;
                let menorDiff = Infinity;
                [candFloor, candRound, candCeil].forEach(c => {
                    if (c >= 0) {
                        const diff = Math.abs(obtenerCuotaSistemaCrediban(P, N, F, G, c) - C_OBJ);
                        if (diff < menorDiff) { menorDiff = diff; mejorTasa2Dec = c; }
                    }
                });

                const cuotaSis = obtenerCuotaSistemaCrediban(P, N, F, G, mejorTasa2Dec);
                const tasaPer = (Math.pow(1 + (tasaExactaPct / 100), F / 30) - 1) * 100;
                const tasaTEA = (Math.pow(1 + (tasaExactaPct / 100), 12) - 1) * 100;
                const totalPagar = Math.round(cuotaSis * N * 100) / 100;
                const interesTotal = Math.max(0, Math.round((totalPagar - P) * 100) / 100);

                const escenarios = [-1.0, -0.5, 0, 0.5, 1.0].map(d => {
                    const tEsc = Math.max(0.01, Math.round((mejorTasa2Dec + d) * 100) / 100);
                    const cEsc = obtenerCuotaSistemaCrediban(P, N, F, G, tEsc);
                    return {
                        etiqueta: d === 0 ? "🎯 Tasa Objetivo" : (d < 0 ? `Tasa ${d.toFixed(1)}%` : `Tasa +${d.toFixed(1)}%`),
                        monto: P,
                        tasa: tEsc,
                        cuota: cEsc,
                        esObjetivo: d === 0
                    };
                });

                return {
                    error: null,
                    principalLabel: "Tasa Sugerida Simulador",
                    principalValor: `${mejorTasa2Dec.toFixed(2)}%`,
                    secundarioLabel: "Tasa Matemática Exacta",
                    secundarioValor: `${tasaExactaPct.toFixed(4)}%`,
                    cuotaSistema: cuotaSis,
                    tasaPeriodo: tasaPer,
                    tasaTEA: tasaTEA,
                    capital: P,
                    interesTotal,
                    totalPagar,
                    resultadoMonto: P,
                    resultadoTasa: mejorTasa2Dec,
                    escenarios
                };
            } else {
                const T_FIJA = parseNum(tasaFija);
                if (T_FIJA <= 0 || N <= 0 || F <= 0 || C_OBJ <= 0) {
                    return { error: "Completa Tasa TEM, Cuotas y Cuota Objetivo mayores a 0." };
                }
                const t = T_FIJA / 100;
                const factorGracia = Math.pow(1 + t, G / 30);
                const r = Math.pow(1 + t, F / 30) - 1;
                const montoExacto = (C_OBJ * (1 - Math.pow(1 + r, -N))) / (factorGracia * r);
                const montoRedondeado10 = Math.floor(montoExacto / 10) * 10;
                const resMonto = Math.round(montoExacto * 100) / 100;

                const cuotaSis = obtenerCuotaSistemaCrediban(resMonto, N, F, G, T_FIJA);
                const tasaPer = r * 100;
                const tasaTEA = (Math.pow(1 + t, 12) - 1) * 100;
                const totalPagar = Math.round(cuotaSis * N * 100) / 100;
                const interesTotal = Math.max(0, Math.round((totalPagar - resMonto) * 100) / 100);

                const baseComercial = Math.max(100, Math.round(montoExacto / 100) * 100);
                const escenarios = [-200, -100, 0, 100, 200].map(esc => {
                    const mEsc = esc === 0 ? resMonto : Math.max(100, baseComercial + esc);
                    const cEsc = obtenerCuotaSistemaCrediban(mEsc, N, F, G, T_FIJA);
                    return {
                        etiqueta: esc === 0 ? "🎯 Monto Exacto" : `Opción S/ ${mEsc.toFixed(0)}`,
                        monto: mEsc,
                        tasa: T_FIJA,
                        cuota: cEsc,
                        esObjetivo: esc === 0
                    };
                });

                return {
                    error: null,
                    principalLabel: "Monto Máximo a Prestar",
                    principalValor: formatMoney(resMonto),
                    secundarioLabel: "Monto Comercial Redondeado",
                    secundarioValor: formatMoney(montoRedondeado10),
                    cuotaSistema: cuotaSis,
                    tasaPeriodo: tasaPer,
                    tasaTEA: tasaTEA,
                    capital: resMonto,
                    interesTotal,
                    totalPagar,
                    resultadoMonto: resMonto,
                    resultadoTasa: T_FIJA,
                    escenarios
                };
            }
        };

        const nombreFrecuencia = (f) => {
            const num = parseInt(f, 10);
            if (num === 1) return "Diario (1d)";
            if (num === 7) return "Semanal (7d)";
            if (num === 14) return "Catorcenal (14d)";
            if (num === 30) return "Mensual (30d)";
            return "-";
        };

        const parsearRegistroMeta = (m) => {
            const rawAsesor = String(m.asesor || "").trim().toUpperCase();
            let asesorLimpio = rawAsesor;
            let mesDetectado = String(m.mesVigencia || "TODOS").trim().toUpperCase();

            if (rawAsesor.includes("::")) {
                const partes = rawAsesor.split("::");
                asesorLimpio = partes[0].trim();
                mesDetectado = (partes[1] || "TODOS").trim();
            }
            if (asesorLimpio === "MELISA") asesorLimpio = "MELISSA";

            return {
                sede: String(m.sede || "").trim().toUpperCase(),
                asesor: asesorLimpio,
                mes: mesDetectado,
                meta: parseNum(m.meta),
                estado: String(m.estado || "ACTIVO").trim().toUpperCase()
            };
        };

        /**
         * Clasificador estricto de Roles:
         * Si el usuario es solo ASESOR, devuelve "ASESOR" para bloquear su ingreso.
         */
        const clasificarRolEstricto = (cargoPrincipal, cargoOriginal) => {
            const raw = String(cargoOriginal || cargoPrincipal || "").trim().toUpperCase();
            if (raw.includes("GERENTE") || raw.includes("DIRECTOR")) return "GERENTE";
            if (raw.includes("ADMIN") || raw.includes("SUPERVISOR") || raw.includes("JEFE")) return "ADMINISTRADOR";
            if (raw.includes("CAJ")) return "CAJERO";
            if (raw.includes("ASESOR") || raw.includes("PROMOTOR") || raw.includes("ANALISTA")) return "ASESOR";
            return String(cargoPrincipal || "ASESOR").trim().toUpperCase();
        };

        // ============================================================================
        // 4. PANTALLA DE LOGIN (BLOQUEA A LOS QUE SON SOLO ASESORES)
        // ============================================================================
        function LoginScreen({ onLoginSuccess }) {
            const [usuario, setUsuario] = React.useState("");
            const [clave, setClave] = React.useState("");
            const [showPass, setShowPass] = React.useState(false);
            const [remember, setRemember] = React.useState(true);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState("");
            const [usersDirectory, setUsersDirectory] = React.useState([]);
            const [useDropdown, setUseDropdown] = React.useState(false);

            React.useEffect(() => {
                fetch(`${GAS_USUARIOS_URL}?action=getActiveUsers`)
                    .then(r => r.json())
                    .then(data => {
                        if (data && Array.isArray(data.usuarios) && data.usuarios.length > 0) {
                            // Filtrar del selector visual a quienes sean solo Asesores
                            const autorizados = data.usuarios.filter(u => {
                                const rol = clasificarRolEstricto(u.cargo, u.cargo);
                                return rol === "GERENTE" || rol === "ADMINISTRADOR" || rol === "CAJERO";
                            });
                            setUsersDirectory(autorizados);
                        }
                    })
                    .catch(() => {});
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError("");
                if (!usuario.trim() || !clave.trim()) {
                    setError("Por favor, ingresa tu usuario y contraseña.");
                    return;
                }

                setLoading(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "login",
                            usuario: usuario.trim(),
                            clave: clave.trim()
                        })
                    });
                    const data = await res.json();

                    if (data && data.status === "ok" && data.token && data.usuario) {
                        const rolReal = clasificarRolEstricto(data.usuario.cargo, data.usuario.cargoOriginal);

                        // REGLA ESTRICTA: Los que son solo ASESORES no pueden entrar al sistema
                        if (rolReal === "ASESOR" || !["GERENTE", "ADMINISTRADOR", "CAJERO"].includes(rolReal)) {
                            setError("⛔ Acceso denegado: Los usuarios con cargo de ASESOR no tienen autorización para ingresar a este sistema.");
                            setLoading(false);
                            return;
                        }

                        onLoginSuccess({
                            token: data.token,
                            usuario: {
                                ...data.usuario,
                                cargo: rolReal
                            }
                        }, remember);
                    } else {
                        setError(data?.message || "❌ Credenciales inválidas o usuario no autorizado.");
                    }
                } catch (err) {
                    setError("⚠️ Error de conexión con el servidor seguro. Verifica tu internet.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-[#1b4332] to-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border-t-8 border-[#59B447]">
                        <div className="p-7 text-center bg-slate-50 border-b border-slate-100 flex flex-col items-center">
                            <CredibanLogo size="lg" />
                            <p className="mt-3 text-xs font-extrabold text-slate-500 uppercase tracking-wider">
                                Sistema de Desembolsos, Metas y Evolución Diaria
                            </p>
                            <div className="mt-2 inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-full text-[11px] font-bold">
                                🔐 Acceso exclusivo: Gerencia, Administración y Caja
                            </div>
                        </div>

                        <form onSubmit={handleLogin} className="p-7 space-y-4">
                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-extrabold text-slate-600 uppercase">
                                        👤 Usuario Autorizado
                                    </label>
                                    {usersDirectory.length > 0 && (
                                        <button
                                            type="button"
                                            onClick={() => setUseDropdown(!useDropdown)}
                                            className="text-[11px] font-bold text-[#59B447] hover:underline"
                                        >
                                            {useDropdown ? "✍️ Escribir manual" : "📋 Elegir de lista"}
                                        </button>
                                    )}
                                </div>

                                {useDropdown && usersDirectory.length > 0 ? (
                                    <select
                                        value={usuario}
                                        onChange={e => setUsuario(e.target.value)}
                                        className="w-full border border-slate-300 rounded-xl px-3.5 py-3 text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-[#59B447] outline-none"
                                    >
                                        <option value="">-- Selecciona tu Usuario --</option>
                                        {usersDirectory.map((u, i) => {
                                            const nom = u.usuario || u.nombre;
                                            return (
                                                <option key={i} value={nom}>
                                                    {nom} ({u.cargo} - {u.sede})
                                                </option>
                                            );
                                        })}
                                    </select>
                                ) : (
                                    <input
                                        type="text"
                                        value={usuario}
                                        onChange={e => setUsuario(e.target.value)}
                                        placeholder="Ingresa tu usuario..."
                                        className="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-[#59B447] outline-none"
                                        autoComplete="username"
                                        required
                                    />
                                )}
                            </div>

                            <div>
                                <label className="text-xs font-extrabold text-slate-600 uppercase block mb-1">
                                    🔑 Contraseña
                                </label>
                                <div className="relative">
                                    <input
                                        type={showPass ? "text" : "password"}
                                        value={clave}
                                        onChange={e => setClave(e.target.value)}
                                        placeholder="••••••••••••"
                                        className="w-full border border-slate-300 rounded-xl px-4 py-3 pr-12 text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-[#59B447] outline-none"
                                        autoComplete="current-password"
                                        required
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setShowPass(!showPass)}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-lg"
                                    >
                                        {showPass ? "🙈" : "👁️"}
                                    </button>
                                </div>
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-700 text-xs font-bold p-3 rounded-xl">
                                    {error}
                                </div>
                            )}

                            <label className="flex items-center gap-2 cursor-pointer pt-1">
                                <input
                                    type="checkbox"
                                    checked={remember}
                                    onChange={e => setRemember(e.target.checked)}
                                    className="w-4 h-4 accent-[#59B447] rounded"
                                />
                                <span className="text-xs font-semibold text-slate-600">
                                    Recordar mi sesión en este equipo
                                </span>
                            </label>

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-[#59B447] hover:bg-[#4a9c3a] active:scale-[0.99] text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition-all text-sm uppercase tracking-wider disabled:opacity-50"
                            >
                                {loading ? "🔐 Verificando Credenciales..." : "Ingresar al Sistema ➔"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 5. MODAL DEL PLAN DE PAGOS Y SIMULADOR (IDÉNTICO A TU IMAGEN 2 + RENOVACIÓN)
        // ============================================================================
        function ModalDetalleGrupoYSimulador({ item, onClose }) {
            if (!item) return null;

            // Permite alternar entre ver el Plan Original o Simular Renovación / Cálculo Inverso
            const [vistaModal, setVistaModal] = React.useState("PLAN"); // PLAN | RENOVAR
            const [simMonto, setSimMonto] = React.useState(() => String(item.monto || 2500));
            const [simCuotas, setSimCuotas] = React.useState(() => String(item.nroCuotas || 8));
            const [simFrecuencia, setSimFrecuencia] = React.useState(() => String(item.frecuencia || 14));
            const [simTasaTEM, setSimTasaTEM] = React.useState(() => String(item.tasaTEM || 21));
            const [simDiasGracia, setSimDiasGracia] = React.useState(() => String(Math.abs(parseInt(item.diasGracia, 10) || 0)));
            const [simGraciaNeg, setSimGraciaNeg] = React.useState(() => (parseInt(item.diasGracia, 10) || 0) < 0);
            const [simFechaISO, setSimFechaISO] = React.useState(() => item.fechaDesembolsoISO || item.fechaISO || getTodayISO());

            // Estados para Cálculo Inverso de Renovación dentro del modal
            const [modoInverso, setModoInverso] = React.useState("tasa"); // tasa | monto
            const [cuotaObjetivoInv, setCuotaObjetivoInv] = React.useState("");

            const graciaFirmada = (parseInt(simDiasGracia, 10) || 0) * (simGraciaNeg ? -1 : 1);

            const simGlobal = React.useMemo(() => simularCreditoCrediban({
                monto: simMonto,
                frecuencia: simFrecuencia,
                nroCuotas: simCuotas,
                tasaTEM: simTasaTEM,
                diasGracia: graciaFirmada,
                fechaDesembolsoISO: simFechaISO
            }), [simMonto, simFrecuencia, simCuotas, simTasaTEM, graciaFirmada, simFechaISO]);

            React.useEffect(() => {
                if (simGlobal.activo && !cuotaObjetivoInv) {
                    setCuotaObjetivoInv(simGlobal.cuota.toFixed(2));
                }
            }, [simGlobal.activo]);

            const resultadoInverso = React.useMemo(() => calcularInversoCrediban({
                modo: modoInverso,
                monto: simMonto,
                tasaFija: simTasaTEM,
                cuotas: simCuotas,
                frecuencia: simFrecuencia,
                diasGracia: graciaFirmada,
                cuotaObjetivo: cuotaObjetivoInv || simGlobal.cuota

            const esGrupal = item.modalidad === "GRUPAL" || (Array.isArray(item.integrantes) && item.integrantes.length > 0);
            const integrantes = Array.isArray(item.integrantes) ? item.integrantes : [];
            const netoActual = Math.max(0, parseNum(simMonto) - parseNum(item.montoDescuento));

            const exportarCronogramaPDF = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const logoB64 = await obtenerLogoCredibanBase64();

                doc.setFillColor(27, 67, 50);
                doc.rect(0, 0, 210, 26, 'F');
                if (logoB64) {
                    doc.addImage(logoB64, 'PNG', 10, 3, 14, 19);
                }
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.text("CREDIBAN PERÚ - CALENDARIO DE PAGOS", 28, 11);
                doc.setFontSize(9);
                doc.text(`empieza a construir tus sueños  |  Sede: ${item.sede}  |  Asesor: ${item.asesor}  |  Modalidad: ${item.modalidad || 'INDIVIDUAL'}`, 28, 19);

                doc.setTextColor(30, 41, 59);
                doc.setFontSize(10);
                doc.text(`Cliente / Grupo: ${item.cliente}`, 14, 34);
                doc.text(`Monto Desembolsado: ${formatMoney(simMonto)}   |   Descuento: ${formatMoney(item.montoDescuento)}   |   Neto: ${formatMoney(netoActual)}`, 14, 40);
                doc.text(`Plazo: ${simCuotas} cuotas (${nombreFrecuencia(simFrecuencia)})   |   TEM: ${simTasaTEM}%   |   Cuota Calculada: ${formatMoney(simGlobal.cuota)}`, 14, 46);
                doc.text(`Posible Renovación (80%): ${formatDateDDMMYYYY(simGlobal.fechaRenovacion80ISO)}   |   Fecha de Vencimiento: ${formatDateDDMMYYYY(simGlobal.fechaVencimientoISO)}`, 14, 52);

                let currentY = 57;

                if (esGrupal && integrantes.length > 0) {
                    const rowsGrupo = integrantes.map((m, idx) => {
                        const simMiembro = simularCreditoCrediban({
                            monto: m.monto,
                            frecuencia: simFrecuencia,
                            nroCuotas: simCuotas,
                            tasaTEM: simTasaTEM,
                            diasGracia: graciaFirmada,
                            fechaDesembolsoISO: simFechaISO
                        });
                        const netoM = Math.max(0, parseNum(m.monto) - parseNum(m.descuento));
                        return [
                            idx + 1,
                            m.nombre,
                            m.tipoCliente,
                            formatMoney(m.monto),
                            formatMoney(m.descuento),
                            formatMoney(netoM),
                            simMiembro.activo ? formatMoney(simMiembro.cuota) : "-"
                        ];
                    });

                    doc.autoTable({
                        startY: currentY,
                        head: [['#', 'Nombre del Integrante', 'Tipo', 'Monto Bruto', 'Descuento', 'Efectivo Neto', 'Cuota Indiv.']],
                        body: rowsGrupo,
                        theme: 'grid',
                        headStyles: { fillColor: [27, 67, 50], fontSize: 8 },
                        styles: { fontSize: 8 }
                    });
                    currentY = doc.lastAutoTable.finalY + 8;
                }

                if (simGlobal.activo && simGlobal.cronograma.length > 0) {
                    doc.autoTable({
                        startY: currentY,
                        head: [['Cuota', 'Fecha de Pago', 'Monto Cuota', 'Capital', 'Interés', 'Saldo', 'Indicador']],
                        body: simGlobal.cronograma.map(c => [
                            c.nro,
                            c.fechaTexto,
                            formatMoney(c.cuota),
                            formatMoney(c.capital),
                            formatMoney(c.interes),
                            formatMoney(c.saldo),
                            c.nro === simGlobal.cuota80Num ? '80% RENOVAR' : (c.nro === Number(simCuotas) ? 'VENCE' : '')
                        ]),
                        theme: 'striped',
                        headStyles: { fillColor: [30, 41, 59], fontSize: 8 },
                        styles: { fontSize: 8 }
                    });
                }

                doc.save(`Plan_Pagos_${item.cliente.replace(/\s+/g, '_')}.pdf`);
            };

            return (
                <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-3 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[94vh] flex flex-col shadow-2xl border-t-8 border-[#59B447] overflow-hidden">
                        {/* Cabecera idéntica a tu Imagen 2 */}
                        <div className="p-5 bg-slate-50 border-b flex flex-wrap justify-between items-start gap-4">
                            <div>
                                <div className="flex items-center gap-2.5 mb-1">
                                    <span className={`px-3 py-0.5 rounded-full text-xs font-black uppercase ${esGrupal ? 'bg-purple-100 text-purple-800 border border-purple-300' : 'bg-emerald-100 text-emerald-800 border border-emerald-300'}`}>
                                        {esGrupal ? `👥 CRÉDITO GRUPAL (${integrantes.length || item.nroIntegrantes})` : '👤 CRÉDITO INDIVIDUAL'}
                                    </span>
                                    <span className="text-xs font-bold text-slate-500">
                                        Sede {item.sede} • Asesor: {item.asesor}
                                    </span>
                                </div>
                                <h2 className="text-2xl font-black text-slate-900 tracking-tight uppercase">{item.cliente}</h2>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    type="button"
                                    onClick={() => setVistaModal(vistaModal === "PLAN" ? "RENOVAR" : "PLAN")}
                                    className={`text-xs font-extrabold px-3.5 py-2 rounded-xl border transition ${vistaModal === "RENOVAR" ? "bg-[#1b4332] text-white border-[#1b4332]" : "bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border-emerald-300"}`}
                                >
                                    {vistaModal === "PLAN" ? "🧮 Simulador / Renovación Inversa" : "📅 Volver al Plan de Pagos"}
                                </button>
                                <button
                                    onClick={exportarCronogramaPDF}
                                    className="bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold px-4 py-2 rounded-xl shadow flex items-center gap-1.5"
                                >
                                    📄 Descargar PDF
                                </button>
                                <button
                                    onClick={onClose}
                                    className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-extrabold px-3.5 py-2 rounded-xl text-xs"
                                >
                                    ✕ Cerrar
                                </button>
                            </div>
                        </div>

                        <div className="p-5 overflow-y-auto space-y-5">
                            {/* LAS 5 TARJETAS SUPERIORES IDÉNTICAS A TU IMAGEN 2 */}
                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                    <div className="text-[10px] font-extrabold text-slate-400 uppercase">MONTO DESEMBOLSADO</div>
                                    <div className="text-lg font-black text-slate-900 mt-0.5">{formatMoney(simMonto)}</div>

                                        {parseInt(simCuotas, 10) > 0 ? `${simCuotas} cuotas (${nombreFrecuencia(simFrecuencia)})` : 'Sin cronograma'}
                                    </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5">

                                        <input type="number" step="0.01" value={simTasaTEM} onChange={e => setSimTasaTEM(e.target.value)} className="w-full border rounded-lg px-2.5 py-1.5 text-xs font-black text-[#59B447] bg-white" />
                                    </div>
                                    <div>
                                        <div className="flex justify-between">
                                            <label className="text-[10px] font-bold text-slate-500 uppercase">Gracia</label>
                                            <label className="text-[10px] font-bold text-red-600 flex items-center gap-0.5 cursor-pointer">
