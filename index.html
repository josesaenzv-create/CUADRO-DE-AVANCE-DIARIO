                                            {movimientosFiltrados.map((m, idx) => (
                                                <tr key={m.idRegistro || idx} className="hover:bg-slate-50">
                                                    <td className="p-2.5 text-slate-500">{m.marcaTemporal}</td>
                                                    <td className="p-2.5 text-center font-black">{m.sede}</td>
                                                    <td className="p-2.5 text-center">Día {m.diaSistema} ({m.mesRegistro})</td>
                                                    <td className="p-2.5 font-extrabold text-emerald-900">{m.asesor}</td>
                                                    <td className="p-2.5 font-extrabold cursor-pointer text-slate-900 hover:text-[#59B447]" onClick={() => setItemDetalleModal(m)}>{m.cliente}</td>
                                                    <td className="p-2.5 text-center">{m.tipoCliente} (CN: {m.cantidadCN})</td>
                                                    <td className="p-2.5 text-right font-black">{formatMoney(m.monto)}</td>
                                                    <td className="p-2.5 text-right text-blue-700">{formatMoney(m.montoDescuento)}</td>
                                                    <td className="p-2.5 text-center space-x-1">
                                                        <button onClick={() => setItemDetalleModal(m)} className="bg-[#59B447] text-white font-extrabold px-2.5 py-1 rounded-lg text-[11px]">📅 Plan</button>
                                                        <button onClick={() => handleEliminarRegistro(m)} className="bg-red-50 text-red-600 font-extrabold px-2 py-1 rounded-lg text-[11px]">🗑️</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA 8: DIRECTORIO OFICIAL DE LA HOJA USUARIOS, METAS Y EQUIPOS (A - J) */}
                        {activeTab === "CONFIG" && puedeVerDetalleAvanzado && (
                            <div className="space-y-5">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                                        <h3 className="text-sm font-black uppercase text-slate-800">🎯 Configurar Meta Mensual (Asesores Oficiales del Script Usuarios)</h3>
                                        <form onSubmit={handleGuardarMetaMensual} className="space-y-3">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-xs font-extrabold text-slate-600 block mb-1">📍 Sede</label>
                                                    <select value={isGerente ? metaSedeSelect : userSede} disabled={!isGerente} onChange={e => setMetaSedeSelect(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold bg-slate-50">
                                                        {sedesCatalogo.map(s => <option key={s.nombre} value={s.nombre}>{s.nombre}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-extrabold text-emerald-700 block mb-1">📅 Mes</label>
                                                    <select value={metaMesSelect} onChange={e => setMetaMesSelect(e.target.value)} className="w-full border-2 border-[#59B447] rounded-xl px-3 py-2 text-xs font-black bg-emerald-50/40">
                                                        {MESES_ANIO.map(m => <option key={m} value={m}>{m}</option>)}
                                                        <option value="TODOS">GENERAL</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-xl">
                                                <button type="button" onClick={() => { setMetaTipoSelect("ASESOR"); setMetaAsesorMonto("45000"); }} className={`py-2 rounded-lg text-xs font-black ${metaTipoSelect === "ASESOR" ? "bg-white shadow" : "text-slate-500"}`}>👤 Meta Asesor</button>
                                                <button type="button" onClick={() => { setMetaTipoSelect("OFICINA"); setMetaAsesorMonto("300000"); }} className={`py-2 rounded-lg text-xs font-black ${metaTipoSelect === "OFICINA" ? "bg-white shadow" : "text-slate-500"}`}>🏢 Meta Oficina</button>
                                            </div>
                                            {metaTipoSelect === "ASESOR" && (
                                                <select value={metaAsesorNombre} onChange={e => setMetaAsesorNombre(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold uppercase bg-white" required>
                                                    <option value="">-- Selecciona Asesor del Script de Usuarios --</option>
                                                    {listaAsesoresOficiales
                                                        .filter(a => a.sedePrincipal === (isGerente ? metaSedeSelect : userSede))
                                                        .map(a => (
                                                            <option key={a.nombreCorto} value={a.nombreCorto}>
                                                                {a.nombreCorto} ({a.usuarioOriginal} - {a.area})
                                                            </option>
                                                        ))}
                                                </select>
                                            )}
                                            <input type="number" step="500" value={metaAsesorMonto} onChange={e => setMetaAsesorMonto(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-black" required />
                                            <button type="submit" className="w-full bg-[#59B447] text-white font-black py-3 rounded-2xl text-xs uppercase shadow">💾 Guardar Meta</button>
                                        </form>
                                    </div>

                                    {isGerente && (
                                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                                            <h3 className="text-sm font-black uppercase text-[#1b4332] border-b pb-2">🏢 Añadir Nueva Sede CREDIBAN</h3>
                                            <form onSubmit={handleCrearNuevaSede} className="space-y-3">
                                                <input type="text" placeholder="Nombre de la Nueva Sede (Ej: BARRANCA, CHIMBOTE)..." value={nuevaSedeNombre} onChange={e => setNuevaSedeNombre(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold uppercase" required />
                                                <input type="number" step="1000" value={nuevaSedeMeta} onChange={e => setNuevaSedeMeta(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs font-black" required />
                                                <button type="submit" className="w-full bg-[#1b4332] text-white font-black py-3 rounded-2xl text-xs uppercase shadow">➕ Crear Sede en Google Sheets</button>
                                            </form>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm border border-emerald-300 overflow-hidden">
                                    <div className="bg-[#1b4332] text-white px-5 py-3.5 flex flex-wrap justify-between items-center gap-2">
                                        <div>
                                            <h3 className="text-xs font-black uppercase">👥 Directorio Oficial Sincronizado con tu Script de Usuarios ({catalogoUsuariosOficial.length} Usuarios Activos)</h3>
                                            <p className="text-[11px] text-emerald-200">Muestra el Formato Corto (NOMBRE.A), Cargo, Sede Principal, Área, Equipo (A-J) y Jefe de Equipo Asignado:</p>
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-emerald-700 text-white uppercase font-black text-[10px]">
                                                    <th className="p-2.5 text-left">USUARIO (HOJA)</th>
                                                    <th className="p-2.5 text-left">FORMATO SISTEMA (NOMBRE.A)</th>
                                                    <th className="p-2.5 text-center">CARGO</th>
                                                    <th className="p-2.5 text-center">SEDE_PRINCIPAL</th>
                                                    <th className="p-2.5 text-center">AREA (COL. F)</th>
                                                    <th className="p-2.5 text-center">EQUIPO (A - J) (COL. G)</th>
                                                    <th className="p-2.5 text-left">JEFE_DE_EQUIPO_ASIGNADO (COL. H)</th>
                                                    <th className="p-2.5 text-center">ESTADO</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-200 font-semibold">
                                                {catalogoUsuariosOficial.map((u, i) => (
                                                    <tr key={i} className="hover:bg-emerald-50/40">
                                                        <td className="p-2.5 font-bold text-slate-700">{u.usuarioOriginal}</td>
                                                        <td className="p-2.5 font-black text-emerald-900 text-sm">{u.nombreCorto}</td>
                                                        <td className="p-2.5 text-center">
                                                            <span className="bg-slate-100 text-slate-800 px-2 py-0.5 rounded-full text-[10px] font-black uppercase">{u.cargoOriginal}</span>
                                                        </td>
                                                        <td className="p-2.5 text-center font-black text-slate-900">📍 {u.sedePrincipal}</td>
                                                        <td className="p-2.5 text-center">
                                                            <select
                                                                value={u.area}
                                                                onChange={e => handleActualizarOverrideUsuario(u.nombreCorto, "area", e.target.value)}
                                                                className="border rounded-lg px-2 py-1 text-[11px] font-bold bg-white"
                                                            >
                                                                <option value="Gerencia">Gerencia</option>
                                                                <option value="Créditos Individuales">Créditos Individuales</option>
                                                                <option value="Créditos Grupales">Créditos Grupales</option>
                                                                <option value="Caja">Caja</option>
                                                            </select>
                                                        </td>
                                                        <td className="p-2.5 text-center">
                                                            <select
                                                                value={u.equipo}
                                                                onChange={e => handleActualizarOverrideUsuario(u.nombreCorto, "equipo", e.target.value)}
                                                                className="border border-purple-300 rounded-lg px-2 py-1 text-[11px] font-black bg-purple-50 text-purple-950"
                                                            >
                                                                <option value="SIN EQUIPO">SIN EQUIPO</option>
                                                                <option value="TODOS">TODOS (Sede/Zona)</option>
                                                                {LETRAS_EQUIPOS.map(l => <option key={l} value={`EQUIPO ${l}`}>EQUIPO {l}</option>)}
                                                            </select>
                                                        </td>
                                                        <td className="p-2.5">
                                                            <input
                                                                type="text"
                                                                value={u.jefeAsignado}
                                                                onChange={e => handleActualizarOverrideUsuario(u.nombreCorto, "jefeAsignado", e.target.value)}
                                                                className="border rounded-lg px-2 py-1 text-[11px] font-bold bg-white w-full"
                                                            />
                                                        </td>
                                                        <td className="p-2.5 text-center">
                                                            <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full text-[10px] font-black">{u.estado}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {itemDetalleModal && (
                        <ModalDetalleGrupoYSimulador
                            item={itemDetalleModal}
                            onClose={() => setItemDetalleModal(null)}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
