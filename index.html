<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CREDIBAN PERÚ - Sistema Integrado con Directorio Oficial de Usuarios</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f1f5f9; }
        .logo-crediban-title { font-family: Georgia, 'Times New Roman', serif; letter-spacing: 0.04em; }
        .logo-crediban-sub { font-family: Arial, Helvetica, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        .excel-grid-bg {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, rgba(226, 232, 240, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-[#59B447] selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // ============================================================================
        // 1. CONEXIÓN OFICIAL A TUS SERVIDORES DE GOOGLE APPS SCRIPT
        // ============================================================================
        const GAS_DESEMBOLSOS_URL = "https://script.google.com/macros/s/AKfycbwNGWBib_Y6o5Qr13w8ppSbEckXXjtx3AHtxgN-rAlaBew4DSLVdqRwkGzTRnepRZZe/exec";
        const GAS_USUARIOS_URL    = "https://script.google.com/macros/s/AKfycbyPGo-OSC0KZcz03bAMpKQ82cipc2T1LNztaI229FhYqqNNXqG1oSb6hPPgVSSU3piqiw/exec";

        const MESES_ANIO = [
            "ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO",
            "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE"
        ];

        const LETRAS_EQUIPOS = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];

        const FERIADOS_PERU_MM_DD = [
            "01-01", "04-02", "04-03", "05-01", "06-07", "06-29",
            "07-23", "07-28", "07-29", "08-06", "08-30", "10-08",
            "11-01", "12-08", "12-09", "12-25"
        ];

        /**
         * ESPEJO SINCRONIZADO DE TU HOJA "USUARIOS" (IMÁGENES 1 Y 3)
         * Garantiza que las columnas A..I (Cargo, Sede_Principal, Sedes_Zona, Area, Equipo y Jefe_de_Equipo_Asignado)
         * estén siempre disponibles y se combinen en vivo con lo que devuelve GAS_USUARIOS_URL.
         */
        const DIRECTORIO_USUARIOS_HOJA_BASE = [
            { usuario: "CRISTHIAN.TRINIDAD", cargo: "Gerente", sedePrincipal: "TODAS", sedesZona: "TODAS", area: "Gerencia", equipo: "TODOS", jefeAsignado: "Gerencia General", estado: "HABILITADO" },
            { usuario: "MOISES.BORJA", cargo: "Gerente", sedePrincipal: "TODAS", sedesZona: "TODAS", area: "Gerencia", equipo: "SIN EQUIPO", jefeAsignado: "Gerencia General", estado: "HABILITADO" },
            { usuario: "GUILLERMO.CORONEL", cargo: "Asesor", sedePrincipal: "HUARAZ", sedesZona: "HUARAZ", area: "Créditos Individuales", equipo: "SIN EQUIPO", jefeAsignado: "Roberto Vargas", estado: "HABILITADO", metaBase: 50000 },
            { usuario: "YOVANA.GARCIA", cargo: "Asesor", sedePrincipal: "HUARAZ", sedesZona: "HUARAZ", area: "Créditos Individuales", equipo: "SIN EQUIPO", jefeAsignado: "Roberto Vargas", estado: "HABILITADO", metaBase: 25000 },
            { usuario: "SHEILA.POMA", cargo: "Asesor", sedePrincipal: "HUARAZ", sedesZona: "HUARAZ", area: "Créditos Individuales", equipo: "SIN EQUIPO", jefeAsignado: "Lucia Paredes", estado: "HABILITADO", metaBase: 40000 },
            { usuario: "JOSE.SAENZV", cargo: "Cajero", sedePrincipal: "HUACHO", sedesZona: "HUACHO", area: "Caja", equipo: "SIN EQUIPO", jefeAsignado: "Lucia Paredes", estado: "HABILITADO" },
            { usuario: "MELISSA.CECILIANO", cargo: "Asesor", sedePrincipal: "HUACHO", sedesZona: "HUACHO", area: "Créditos Individuales", equipo: "EQUIPO A", jefeAsignado: "Carlos Mendoza", estado: "HABILITADO", metaBase: 45000 },
            { usuario: "ABIGAIL.SANDOVAL", cargo: "Asesor", sedePrincipal: "HUANUCO", sedesZona: "HUANUCO", area: "Créditos Individuales", equipo: "EQUIPO A", jefeAsignado: "Miguel Castro", estado: "HABILITADO", metaBase: 50000 },
            { usuario: "Jorge Quispe", cargo: "Asesor", sedePrincipal: "HUANUCO", sedesZona: "HUANUCO", area: "Créditos Grupales", equipo: "EQUIPO B", jefeAsignado: "Elena Rojas", estado: "HABILITADO", metaBase: 45000 },
            { usuario: "Shayra Reyes", cargo: "Cajero", sedePrincipal: "HUANUCO", sedesZona: "HUANUCO", area: "Caja", equipo: "SIN EQUIPO", jefeAsignado: "Lucia Paredes", estado: "HABILITADO" }
        ];

        const METAS_OFICINA_POR_DEFECTO = {
            "HUACHO": 300000,
            "HUARAZ": 115000,
            "HUANUCO": 150000
        };

        /**
         * FORMATEADOR OFICIAL: Primer Nombre + "." + Primera Letra del Apellido
         * Ejemplos:
         *  "GUILLERMO.CORONEL" -> "GUILLERMO.C"
         *  "Jorge Quispe"      -> "JORGE.Q"
         *  "MELISSA.CECILIANO" -> "MELISSA.C"
         */
        const formatearNombreCorto = (rawNombre) => {
            if (!rawNombre) return "";
            const limpio = String(rawNombre)
                .replace(/\(\s*[A-J]\s*\)/gi, "")
                .replace(/-\s*EQUIPO\s*[A-J]\b/gi, "")
                .trim()
                .toUpperCase();

            if (!limpio) return "";

            // Si ya tiene el formato NOMBRE.X (1 sola letra después del punto)
            if (/^[A-ZÁÉÍÓÚÑ]+\.[A-ZÁÉÍÓÚÑ]$/.test(limpio)) {
                const [p, l] = limpio.split(".");
                return `${p === "MELISA" ? "MELISSA" : p === "HEYDI" ? "HEIDY" : p}.${l}`;
            }

            // Separar por punto, espacio o guion bajo
            const partes = limpio.split(/[\s._-]+/).filter(Boolean);
            let primerNombre = partes[0] || "";
            if (primerNombre === "MELISA") primerNombre = "MELISSA";
            if (primerNombre === "HEYDI") primerNombre = "HEIDY";

            if (partes.length >= 2 && partes[1].length > 0) {
                const inicialApellido = partes[1].charAt(0).toUpperCase();
                return `${primerNombre}.${inicialApellido}`;
            }
            return primerNombre;
        };

        const normalizarEquipoTexto = (rawEq) => {
            const txt = String(rawEq || "").trim().toUpperCase();
            if (!txt || txt.includes("SIN EQUIPO") || txt === "NINGUNO") return "SIN EQUIPO";
            if (txt.includes("TODOS")) return "TODOS";
            const m = txt.match(/(?:EQUIPO\s*)?([A-J])\b/);
            if (m) return `EQUIPO ${m[1]}`;
            return txt;
        };

        const normalizarRegistroUsuario = (u) => {
            const rawUser = String(u.usuario || u.nombre || "").trim();
            const upperUser = rawUser.toUpperCase();
            // Buscar si existe en el espejo de la hoja USUARIOS para completar columnas E, F, G, H si el endpoint básico no las envió
            const baseMatch = DIRECTORIO_USUARIOS_HOJA_BASE.find(b =>
                b.usuario.toUpperCase() === upperUser ||
                formatearNombreCorto(b.usuario) === formatearNombreCorto(upperUser)
            );

            const combinado = { ...(baseMatch || {}), ...u };
            const sedePrincipal = String(combinado.sedePrincipal || combinado.SEDE_PRINCIPAL || combinado.sede || baseMatch?.sedePrincipal || "HUACHO").trim().toUpperCase();
            const sedesZona = String(combinado.sedesZona || combinado.SEDES_ZONA || combinado.zona || baseMatch?.sedesZona || sedePrincipal).trim().toUpperCase();
            const cargoOriginal = String(combinado.cargoOriginal || combinado.CARGO || combinado.cargo || baseMatch?.cargo || "Asesor").trim();
            const area = String(combinado.area || combinado.AREA || baseMatch?.area || "Créditos Individuales").trim();
            const equipo = normalizarEquipoTexto(combinado.equipo || combinado.EQUIPO || baseMatch?.equipo || "SIN EQUIPO");
            const jefeAsignado = String(combinado.jefeAsignado || combinado.JEFE_DE_EQUIPO_ASIGNADO || combinado.jefe || baseMatch?.jefeAsignado || "").trim();
            const estado = String(combinado.estado || combinado.ESTADO || baseMatch?.estado || "HABILITADO").trim().toUpperCase();
            const nombreCorto = formatearNombreCorto(rawUser);

            return {
                usuarioOriginal: rawUser,
                usuarioUpper: upperUser,
                nombreCorto, // Ej: GUILLERMO.C, MELISSA.C, JORGE.Q
                primerNombre: upperUser.split(/[\s._-]+/)[0] || upperUser,
                apellido: upperUser.split(/[\s._-]+/)[1] || "",
                cargoOriginal,
                sedePrincipal,
                sedesZona,
                area,
                equipo, // Ej: "EQUIPO A", "EQUIPO B", "SIN EQUIPO"
                jefeAsignado, // Ej: "Roberto Vargas", "Carlos Mendoza", "Elena Rojas"
                estado,
                metaBase: combinado.metaBase || 45000
            };
        };

        const obtenerMesAnterior = (mesActual) => {
            const idx = MESES_ANIO.indexOf(mesActual);
            if (idx <= 0) return "DICIEMBRE";
            return MESES_ANIO[idx - 1];
        };

        const obtenerNombreDiaSemana = (mesNombre, diaNumero, anio = new Date().getFullYear()) => {
            const mIdx = MESES_ANIO.indexOf(mesNombre);
            if (mIdx < 0 || !diaNumero) return `DÍA ${diaNumero}`;
            const dt = new Date(anio, mIdx, Number(diaNumero), 12, 0, 0);
            const dias = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];
            const numMesStr = String(mIdx + 1).padStart(2, '0');
            return `${dias[dt.getDay()]} ${String(diaNumero).padStart(2, '0')}/${numMesStr}`;
        };

        const calcularDiasHabilesMes = (mesNombre, anio = new Date().getFullYear()) => {
            const mIdx = MESES_ANIO.indexOf(mesNombre);
            const mesNum = mIdx >= 0 ? mIdx : new Date().getMonth();
            const ultimoDia = new Date(anio, mesNum + 1, 0).getDate();
            const hoy = new Date();
            const esMesActual = hoy.getMonth() === mesNum && hoy.getFullYear() === anio;
            const diaCorte = esMesActual ? hoy.getDate() : ultimoDia;

            let totalHabilesMes = 0;
            let habilesTranscurridos = 0;

            for (let d = 1; d <= ultimoDia; d++) {
                const fecha = new Date(anio, mesNum, d, 12, 0, 0);
                const dow = fecha.getDay();
                const mmdd = String(mesNum + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                const esHabil = dow !== 0 && !FERIADOS_PERU_MM_DD.includes(mmdd);
                if (esHabil) {
                    totalHabilesMes++;
                    if (d <= diaCorte) habilesTranscurridos++;
                }
            }
            return {
                totalHabilesMes: Math.max(1, totalHabilesMes),
                habilesTranscurridos: Math.max(1, habilesTranscurridos),
                habilesRestantes: Math.max(1, totalHabilesMes - habilesTranscurridos)
            };
        };

        // ============================================================================
        // 2. LOGO OFICIAL CREDIBAN CON LEMA "empieza a construir tus sueños"
        // ============================================================================
        const CREDIBAN_SVG_RAW = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" width="180" height="240">
            <g fill="#59B447">
                <rect x="90" y="8" width="24" height="13" rx="6.5"/>
                <rect x="71" y="31" width="61" height="13" rx="6.5"/>
                <rect x="50" y="55" width="74" height="13" rx="6.5"/>
                <rect x="31" y="79" width="75" height="13" rx="6.5"/>
                <rect x="24" y="103" width="63" height="13" rx="6.5"/>
                <rect x="37" y="128" width="24" height="13" rx="6.5"/>
                <path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/>
            </g>
        </svg>`;

        const obtenerLogoCredibanBase64 = () => {
            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    const svgBlob = new Blob([CREDIBAN_SVG_RAW], { type: "image/svg+xml;charset=utf-8" });
                    const url = URL.createObjectURL(svgBlob);
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = 180;
                        canvas.height = 240;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, 180, 240);
                        URL.revokeObjectURL(url);
                        resolve(canvas.toDataURL("image/png"));
                    };
                    img.onerror = () => resolve(null);
                    img.src = url;
                } catch (e) { resolve(null); }
            });
        };

        function CredibanLogo({ size = "md" }) {
            const isLg = size === "lg";
            return (
                <div className="inline-flex items-center gap-3 select-none">
                    <svg className={isLg ? "w-14 h-16 shrink-0" : "w-9 h-12 shrink-0"} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240">
                        <g fill="#59B447">
                            <rect x="90" y="8" width="24" height="13" rx="6.5"/>
                            <rect x="71" y="31" width="61" height="13" rx="6.5"/>
                            <rect x="50" y="55" width="74" height="13" rx="6.5"/>
                            <rect x="31" y="79" width="75" height="13" rx="6.5"/>
                            <rect x="24" y="103" width="63" height="13" rx="6.5"/>
                            <rect x="37" y="128" width="24" height="13" rx="6.5"/>
                            <path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/>
                        </g>
                    </svg>
                    <div className="flex flex-col items-start">
                        <div className={`logo-crediban-title font-bold tracking-tight text-[#59B447] leading-none ${isLg ? 'text-3xl' : 'text-2xl'}`}>CREDIBAN</div>
                        <div className="w-full h-[2px] bg-[#59B447] my-1"></div>
                        <div className={`logo-crediban-sub font-semibold italic text-slate-500 leading-none ${isLg ? 'text-xs' : 'text-[10px]'}`}>empieza a construir tus sueños</div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 3. MOTOR DE CÁLCULO FINANCIERO + VINCULADOR INTELIGENTE DE USUARIOS
        // ============================================================================
        const parseNum = (v) => {
            if (typeof v === 'number') return isNaN(v) ? 0 : v;
            if (!v) return 0;
            const n = parseFloat(String(v).replace(/[^\d.-]/g, ''));
            return isNaN(n) ? 0 : n;
        };

        const formatMoney = (n) => {
            const val = parseNum(n);
            return "S/ " + val.toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const formatShortSoles = (n) => {
            const val = parseNum(n);
            if (Math.abs(val) < 0.005) return "S/.0";
            const hasDecimals = Math.abs(val - Math.round(val)) >= 0.01;
            return "S/." + val.toLocaleString('es-PE', {
                minimumFractionDigits: hasDecimals ? 1 : 0,
                maximumFractionDigits: hasDecimals ? 2 : 0
            });
        };

        const getTodayISO = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const isHolidayOrWeekend = (dateObj) => {
            const day = dateObj.getDay();
            if (day === 0 || day === 6) return true;
            const mmdd = String(dateObj.getMonth() + 1).padStart(2, '0') + '-' + String(dateObj.getDate()).padStart(2, '0');
            return FERIADOS_PERU_MM_DD.includes(mmdd);
        };

        const formatDateDDMMYYYY = (dateOrISO) => {
            if (!dateOrISO) return "-";
            if (typeof dateOrISO === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateOrISO)) {
                const [y, m, d] = dateOrISO.split('-');
                return `${d}/${m}/${y}`;
            }
            const dt = new Date(dateOrISO);
            if (isNaN(dt.getTime())) return String(dateOrISO);
            return `${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')}/${dt.getFullYear()}`;
        };

        const toISODateString = (dateObj) => {
            if (!dateObj || isNaN(dateObj.getTime())) return "";
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        };

        const obtenerCuotaRawCrediban = (monto, cuotas, frecuencia, diasGracia, tasaTEMDec) => {
            if (monto <= 0 || cuotas <= 0 || frecuencia <= 0) return 0;
            if (tasaTEMDec <= 0) return monto / cuotas;
            const factorGracia = Math.pow(1 + tasaTEMDec, diasGracia / 30);
            const r = Math.pow(1 + tasaTEMDec, frecuencia / 30) - 1;
            if (r === 0) return (monto * factorGracia) / cuotas;
            return (monto * factorGracia * r) / (1 - Math.pow(1 + r, -cuotas));
        };

        const obtenerCuotaSistemaCrediban = (monto, cuotas, frecuencia, diasGracia, tasaPorcentaje) => {
            const raw = obtenerCuotaRawCrediban(monto, cuotas, frecuencia, diasGracia, tasaPorcentaje / 100);
            return Math.ceil((raw - 1e-9) * 10) / 10;
        };

        const simularCreditoCrediban = ({ monto, frecuencia, nroCuotas, tasaTEM, diasGracia = 0, fechaDesembolsoISO }) => {
            const P = parseNum(monto);
            const F = parseInt(frecuencia, 10) || 0;
            const N = parseInt(nroCuotas, 10) || 0;
            const TEM_PCT = parseNum(tasaTEM);
            const tasaTEMDec = TEM_PCT / 100;
            const G = parseInt(diasGracia, 10) || 0;

            if (P <= 0 || F <= 0 || N <= 0) {
                return {
                    activo: false, cuota: 0, totalPagar: 0, interesTotal: 0,
                    cuota80Num: 0, fechaRenovacion80ISO: "", fechaVencimientoISO: "",
                    porcentajeAvanceTiempo: 0, estadoRenovacion: "SIN_DATOS",
                    cuotasCumplidasHoy: 0, cuotasRestantesHoy: 0,
                    saldoCancelarCapIntHoy: 0, saldoCapitalRestanteHoy: 0,
                    cronograma: []
                };
            }

            const baseStr = fechaDesembolsoISO && /^\d{4}-\d{2}-\d{2}$/.test(fechaDesembolsoISO) ? fechaDesembolsoISO : getTodayISO();
            const [y, m, d] = baseStr.split('-').map(Number);
            let currentDate = new Date(y, m - 1, d, 12, 0, 0);
            const fechas = [];

            for (let i = 1; i <= N; i++) {
                const diasAAgregar = (i === 1) ? (F + G) : F;
                currentDate.setDate(currentDate.getDate() + diasAAgregar);
                if (F === 1) {
                    while (isHolidayOrWeekend(currentDate)) {
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                }
                fechas.push(new Date(currentDate));
            }

            const r = Math.pow(1 + tasaTEMDec, F / 30) - 1;
            const cuotaFija = obtenerCuotaSistemaCrediban(P, N, F, G, TEM_PCT);

            let saldoCapital = P;
            let saldoTotalAPagar = Math.round((cuotaFija * N) * 100) / 100;
            let totalCapital = 0;
            let totalInteres = 0;
            let totalCuota = 0;
            const cronograma = [];

            for (let i = 1; i <= N; i++) {
                const r_periodo = (i === 1) ? (Math.pow(1 + tasaTEMDec, (F + G) / 30) - 1) : r;
                const interes = saldoCapital * r_periodo;
                let interesRedondeado = Math.round(interes * 100) / 100;
                let capital = 0;

                if (i === N) {
                    capital = saldoCapital;
                    interesRedondeado = Math.round((cuotaFija - capital) * 100) / 100;
                } else {
                    capital = Math.round((cuotaFija - interesRedondeado) * 100) / 100;
                }

                saldoCapital = Math.round((saldoCapital - capital) * 100) / 100;
                if (saldoCapital < 0.01) saldoCapital = 0;

                saldoTotalAPagar = Math.round((saldoTotalAPagar - cuotaFija) * 100) / 100;
                if (saldoTotalAPagar < 0.01 || i === N) saldoTotalAPagar = 0;

                totalCapital += capital;
                totalInteres += interesRedondeado;
                totalCuota += cuotaFija;

                const fObj = fechas[i - 1];
                cronograma.push({
                    nro: i,
                    fechaISO: toISODateString(fObj),
                    fechaTexto: formatDateDDMMYYYY(fObj),
                    cuota: cuotaFija,
                    capital: capital,
                    interes: interesRedondeado,
                    saldo: saldoCapital,
                    saldoTotal: saldoTotalAPagar
                });
            }

            const cuota80Idx = Math.max(0, Math.ceil(N * 0.80) - 1);
            const fechaRenovacion80ISO = cronograma[cuota80Idx] ? cronograma[cuota80Idx].fechaISO : "";
            const fechaVencimientoISO  = cronograma[N - 1] ? cronograma[N - 1].fechaISO : "";

            const hoyISO = getTodayISO();
            const cuotasCumplidasHoy = cronograma.filter(c => c.fechaISO <= hoyISO).length;
            const cuotasRestantesHoy = Math.max(0, N - cuotasCumplidasHoy);
            const porcentajeAvanceTiempo = Math.min(100, Math.round((cuotasCumplidasHoy / N) * 100));

            const saldoCancelarCapIntHoy = Math.round(cuotasRestantesHoy * cuotaFija * 100) / 100;
            const saldoCapitalRestanteHoy = cuotasCumplidasHoy === 0
                ? P
                : (cronograma[cuotasCumplidasHoy - 1] ? cronograma[cuotasCumplidasHoy - 1].saldo : 0);

            const hoyMs = new Date(hoyISO + "T12:00:00").getTime();
            const vencMs = fechaVencimientoISO ? new Date(fechaVencimientoISO + "T12:00:00").getTime() : hoyMs;
            const renovMs = fechaRenovacion80ISO ? new Date(fechaRenovacion80ISO + "T12:00:00").getTime() : hoyMs;

            const diasParaVencer = Math.round((vencMs - hoyMs) / (1000 * 60 * 60 * 24));
            const diasParaRenovar = Math.round((renovMs - hoyMs) / (1000 * 60 * 60 * 24));

            let estadoRenovacion = "VIGENTE";
            if (diasParaVencer < 0) estadoRenovacion = "VENCIDO";
            else if (diasParaRenovar <= 0 && diasParaVencer >= 0) estadoRenovacion = "LISTO_RENOVAR_80";
            else if (diasParaRenovar > 0 && diasParaRenovar <= 7) estadoRenovacion = "PROXIMO_RENOVAR";

            return {
                activo: true, cuota: cuotaFija,
                totalPagar: Math.round(totalCuota * 100) / 100,
                interesTotal: Math.max(0, Math.round(totalInteres * 100) / 100),
                cuota80Num: cuota80Idx + 1,
                cuotasCumplidasHoy, cuotasRestantesHoy,
                saldoCancelarCapIntHoy, saldoCapitalRestanteHoy,
                fechaRenovacion80ISO, fechaVencimientoISO,
                porcentajeAvanceTiempo, estadoRenovacion,
                diasParaVencer, diasParaRenovar, cronograma
            };
        };

        const calcularInversoCrediban = ({ modo, monto, tasaFija, cuotas, frecuencia, diasGracia, cuotaObjetivo }) => {
            const N = parseInt(cuotas, 10) || 0;
            const F = parseInt(frecuencia, 10) || 0;
            const G = parseInt(diasGracia, 10) || 0;
            const C_OBJ = parseNum(cuotaObjetivo);

            if (modo === "tasa") {
                const P = parseNum(monto);
                if (P <= 0 || N <= 0 || F <= 0 || C_OBJ <= 0) return { error: "Completa Monto, Cuotas y Cuota Objetivo mayores a 0." };
                const cuotaMinSinInteres = P / N;
                if (C_OBJ <= cuotaMinSinInteres && G >= 0) {
                    return { error: `⚠️ La cuota objetivo (${formatMoney(C_OBJ)}) es menor o igual al capital puro por cuota (${formatMoney(cuotaMinSinInteres)}).` };
                }

                let low = 0.0, high = 10.0;
                while (obtenerCuotaRawCrediban(P, N, F, G, high) < C_OBJ && high < 1000) high *= 2;
                for (let iter = 0; iter < 100; iter++) {
                    const mid = (low + high) / 2;
                    if (obtenerCuotaRawCrediban(P, N, F, G, mid) < C_OBJ) low = mid;
                    else high = mid;
                }

                const tasaExactaPct = ((low + high) / 2) * 100;
                const candFloor = Math.floor(tasaExactaPct * 100) / 100;
                const candRound = Math.round(tasaExactaPct * 100) / 100;
                const candCeil  = Math.ceil(tasaExactaPct * 100) / 100;

                let mejorTasa2Dec = candRound;
                let menorDiff = Infinity;
                [candFloor, candRound, candCeil].forEach(c => {
                    if (c >= 0) {
                        const diff = Math.abs(obtenerCuotaSistemaCrediban(P, N, F, G, c) - C_OBJ);
                        if (diff < menorDiff) { menorDiff = diff; mejorTasa2Dec = c; }
                    }
                });

                const cuotaSis = obtenerCuotaSistemaCrediban(P, N, F, G, mejorTasa2Dec);
                const tasaPer = (Math.pow(1 + (tasaExactaPct / 100), F / 30) - 1) * 100;
                const tasaTEA = (Math.pow(1 + (tasaExactaPct / 100), 12) - 1) * 100;
                const totalPagar = Math.round(cuotaSis * N * 100) / 100;
                const interesTotal = Math.max(0, Math.round((totalPagar - P) * 100) / 100);

                const escenarios = [-1.0, -0.5, 0, 0.5, 1.0].map(d => {
                    const tEsc = Math.max(0.01, Math.round((mejorTasa2Dec + d) * 100) / 100);
                    const cEsc = obtenerCuotaSistemaCrediban(P, N, F, G, tEsc);
                    return { etiqueta: d === 0 ? "🎯 Tasa Objetivo" : (d < 0 ? `Tasa ${d.toFixed(1)}%` : `Tasa +${d.toFixed(1)}%`), monto: P, tasa: tEsc, cuota: cEsc, esObjetivo: d === 0 };
                });

                return {
                    error: null, principalLabel: "Tasa Sugerida Simulador", principalValor: `${mejorTasa2Dec.toFixed(2)}%`,
                    secundarioLabel: "Tasa Matemática Exacta", secundarioValor: `${tasaExactaPct.toFixed(4)}%`,
                    cuotaSistema: cuotaSis, tasaPeriodo: tasaPer, tasaTEA: tasaTEA, capital: P, interesTotal, totalPagar,
                    resultadoMonto: P, resultadoTasa: mejorTasa2Dec, escenarios
                };
            } else {
                const T_FIJA = parseNum(tasaFija);
                if (T_FIJA <= 0 || N <= 0 || F <= 0 || C_OBJ <= 0) return { error: "Completa Tasa TEM, Cuotas y Cuota Objetivo mayores a 0." };
                const t = T_FIJA / 100;
                const factorGracia = Math.pow(1 + t, G / 30);
                const r = Math.pow(1 + t, F / 30) - 1;
                const montoExacto = (C_OBJ * (1 - Math.pow(1 + r, -N))) / (factorGracia * r);
                const montoRedondeado10 = Math.floor(montoExacto / 10) * 10;
                const resMonto = Math.round(montoExacto * 100) / 100;

                const cuotaSis = obtenerCuotaSistemaCrediban(resMonto, N, F, G, T_FIJA);
                const tasaPer = r * 100;
                const tasaTEA = (Math.pow(1 + t, 12) - 1) * 100;
                const totalPagar = Math.round(cuotaSis * N * 100) / 100;
                const interesTotal = Math.max(0, Math.round((totalPagar - resMonto) * 100) / 100);

                const baseComercial = Math.max(100, Math.round(montoExacto / 100) * 100);
                const escenarios = [-200, -100, 0, 100, 200].map(esc => {
                    const mEsc = esc === 0 ? resMonto : Math.max(100, baseComercial + esc);
                    const cEsc = obtenerCuotaSistemaCrediban(mEsc, N, F, G, T_FIJA);
                    return { etiqueta: esc === 0 ? "🎯 Monto Exacto" : `Opción S/ ${mEsc.toFixed(0)}`, monto: mEsc, tasa: T_FIJA, cuota: cEsc, esObjetivo: esc === 0 };
                });

                return {
                    error: null, principalLabel: "Monto Máximo a Prestar", principalValor: formatMoney(resMonto),
                    secundarioLabel: "Monto Comercial Redondeado", secundarioValor: formatMoney(montoRedondeado10),
                    cuotaSistema: cuotaSis, tasaPeriodo: tasaPer, tasaTEA: tasaTEA, capital: resMonto, interesTotal, totalPagar,
                    resultadoMonto: resMonto, resultadoTasa: T_FIJA, escenarios
                };
            }
        };

        const nombreFrecuencia = (f) => {
            const num = parseInt(f, 10);
            if (num === 1) return "Diario (1d)";
            if (num === 7) return "Semanal (7d)";
            if (num === 14) return "Catorcenal (14d)";
            if (num === 30) return "Mensual (30d)";
            return "-";
        };

        const parsearRegistroMeta = (m) => {
            const rawAsesor = String(m.asesor || "").trim().toUpperCase();
            let asesorLimpio = rawAsesor;
            let mesDetectado = String(m.mesVigencia || "TODOS").trim().toUpperCase();

            if (rawAsesor.includes("::")) {
                const partes = rawAsesor.split("::");
                asesorLimpio = partes[0].trim();
                mesDetectado = (partes[1] || "TODOS").trim();
            }

            return {
                sede: String(m.sede || "").trim().toUpperCase(),
                asesor: asesorLimpio === "__OFICINA__" ? "__OFICINA__" : formatearNombreCorto(asesorLimpio),
                asesorRaw: asesorLimpio,
                mes: mesDetectado,
                meta: parseNum(m.meta),
                estado: String(m.estado || "ACTIVO").trim().toUpperCase()
            };
        };

        const clasificarRolEstricto = (cargoPrincipal, cargoOriginal, objCompleto = null) => {
            const raw = String(cargoOriginal || cargoPrincipal || "").trim().toUpperCase();
            const areaRaw = String(objCompleto?.area || objCompleto?.AREA || "").trim().toUpperCase();

            if (raw.includes("GERENTE") || raw.includes("DIRECTOR") || raw.includes("GERENCIA")) return "GERENTE";
            if (raw.includes("ZONAL") || raw.includes("REGIONAL")) return "JEFE_ZONAL";
            if (raw.includes("GRUPAL") && (raw.includes("JEFE") || raw.includes("LIDER") || raw.includes("COORDINADOR") || raw.includes("SUPERVISOR"))) {
                return "JEFE_CREDITO_GRUPAL";
            }
            if (
                raw.includes("LIDER") || raw.includes("LÍDER") ||
                raw.includes("JEFE DE EQUIPO") || raw.includes("JEFE EQUIPO") ||
                raw.includes("JEFE DE GRUPO") || raw.includes("COORDINADOR") || raw.includes("SUPERVISOR")
            ) {
                return areaRaw.includes("GRUPAL") ? "JEFE_CREDITO_GRUPAL" : "LIDER_EQUIPO";
            }
            if (raw.includes("ADMIN") || raw.includes("JEFE DE AGENCIA") || raw.includes("JEFE DE OFICINA")) return "ADMINISTRADOR";
            if (raw.includes("CAJ")) return "CAJERO";
            if (raw.includes("ASESOR") || raw.includes("PROMOTOR") || raw.includes("ANALISTA")) return "ASESOR";
            return String(cargoPrincipal || "ASESOR").trim().toUpperCase();
        };

        const extraerSedesZonal = (sedeStr, zonaStr) => {
            const combinado = `${zonaStr || ""},${sedeStr || ""}`.toUpperCase();
            if (combinado.includes("TODAS")) return ["TODAS"];
            const partes = combinado.split(/[,;/|+]+/).map(s => s.trim()).filter(Boolean);
            return partes.length > 0 ? Array.from(new Set(partes)) : ["HUACHO"];
        };

        const esRegistroExpedienteCaja = (m) => {
            if (!m) return false;
            const fmt = String(m.formato || "").toUpperCase();
            const cli = String(m.cliente || m.nombreCliente || "").toUpperCase();
            return fmt === "EXPEDIENTE_CAJA" || cli.startsWith("[EN CAJA]") || cli.startsWith("[CAJA]");
        };

        const limpiarNombreExpediente = (nombre) => {
            return String(nombre || "").replace(/^\[EN CAJA\]\s*/i, "").replace(/^\[CAJA\]\s*/i, "").trim();
        };

        // ============================================================================
        // 4. PANTALLA DE LOGIN CONECTADA AL DIRECTORIO UNIFICADO DE USUARIOS
        // ============================================================================
        function LoginScreen({ onLoginSuccess, catalogoUsuariosOficial }) {
            const [usuario, setUsuario] = React.useState("");
            const [clave, setClave] = React.useState("");
            const [showPass, setShowPass] = React.useState(false);
            const [remember, setRemember] = React.useState(true);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState("");
            const [useDropdown, setUseDropdown] = React.useState(true);

            // Lista de usuarios con permiso de ingreso (Gerentes, Jefes Zonales, Administradores, Jefes de Equipo/Grupo, Jefes Grupales y Cajeros)
            const usuariosAutorizadosLista = React.useMemo(() => {
                const deHoja = (catalogoUsuariosOficial || []).filter(u => {
                    if (u.estado !== "HABILITADO") return false;
                    const rol = clasificarRolEstricto(u.cargoOriginal, u.cargoOriginal, u);
                    return ["GERENTE", "JEFE_ZONAL", "ADMINISTRADOR", "LIDER_EQUIPO", "JEFE_CREDITO_GRUPAL", "CAJERO"].includes(rol);
                });
                return deHoja;
            }, [catalogoUsuariosOficial]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError("");
                if (!usuario.trim() || !clave.trim()) {
                    setError("Por favor, ingresa tu usuario y contraseña.");
                    return;
                }

                setLoading(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "login",
                            usuario: usuario.trim(),
                            clave: clave.trim()
                        })
                    });
                    const data = await res.json();

                    if (data && data.status === "ok" && data.token && data.usuario) {
                        const inputUpper = usuario.trim().toUpperCase();
                        const matchOficial = (catalogoUsuariosOficial || []).find(u =>
                            u.usuarioUpper === inputUpper ||
                            u.nombreCorto === formatearNombreCorto(inputUpper)
                        );

                        const usuarioEnriquecido = normalizarRegistroUsuario({
                            ...(matchOficial || {}),
                            ...data.usuario,
                            usuario: matchOficial?.usuarioOriginal || data.usuario.nombre || usuario.trim()
                        });

                        const rolReal = clasificarRolEstricto(
                            usuarioEnriquecido.cargoOriginal,
                            data.usuario.cargoOriginal || usuarioEnriquecido.cargoOriginal,
                            usuarioEnriquecido
                        );

                        if (rolReal === "ASESOR") {
                            setError("⛔ Acceso denegado: Los usuarios con cargo exclusivo de ASESOR se visualizan en los reportes pero no ingresan al panel administrativo.");
                            setLoading(false);
                            return;
                        }

                        onLoginSuccess({
                            token: data.token,
                            usuario: {
                                ...data.usuario,
                                nombre: usuarioEnriquecido.usuarioOriginal,
                                nombreCorto: usuarioEnriquecido.nombreCorto,
                                cargo: rolReal,
                                cargoOriginal: usuarioEnriquecido.cargoOriginal,
                                sede: usuarioEnriquecido.sedePrincipal,
                                sedePrincipal: usuarioEnriquecido.sedePrincipal,
                                sedesZona: usuarioEnriquecido.sedesZona,
                                area: usuarioEnriquecido.area,
                                equipo: usuarioEnriquecido.equipo,
                                jefeAsignado: usuarioEnriquecido.jefeAsignado
                            }
                        }, remember);
                    } else {
                        setError(data?.message || "❌ Credenciales inválidas o usuario no habilitado en el Script de Usuarios.");
                    }
                } catch (err) {
                    setError("⚠️ Error de conexión con el servidor seguro. Verifica tu internet.");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-[#1b4332] to-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border-t-8 border-[#59B447]">
                        <div className="p-7 text-center bg-slate-50 border-b border-slate-100 flex flex-col items-center">
                            <CredibanLogo size="lg" />
                            <p className="mt-3 text-xs font-extrabold text-slate-500 uppercase tracking-wider">
                                Sistema Conectado al Script Oficial de Usuarios
                            </p>
                            <div className="mt-2 inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-full text-[10px] font-bold">
                                🔐 Gerencia • Zonales • Admin • Jefes de Equipo/Grupales • Caja
                            </div>
                        </div>

                        <form onSubmit={handleLogin} className="p-7 space-y-4">
                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-extrabold text-slate-600 uppercase">👤 Usuario (Script Usuarios)</label>
                                    {usuariosAutorizadosLista.length > 0 && (
                                        <button type="button" onClick={() => setUseDropdown(!useDropdown)} className="text-[11px] font-bold text-[#59B447] hover:underline">
                                            {useDropdown ? "✍️ Escribir manual" : "📋 Elegir de lista oficial"}
                                        </button>
                                    )}
                                </div>

                                {useDropdown && usuariosAutorizadosLista.length > 0 ? (
                                    <select value={usuario} onChange={e => setUsuario(e.target.value)} className="w-full border border-slate-300 rounded-xl px-3.5 py-3 text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-[#59B447] outline-none">
                                        <option value="">-- Selecciona tu Usuario Oficial --</option>
                                        {usuariosAutorizadosLista.map((u, i) => (
                                            <option key={i} value={u.usuarioOriginal}>
                                                {u.usuarioOriginal} ({u.cargoOriginal} - {u.sedePrincipal})
                                            </option>
                                        ))}
                                    </select>
                                ) : (
                                    <input type="text" value={usuario} onChange={e => setUsuario(e.target.value)} placeholder="Ej: CRISTHIAN.TRINIDAD, JOSE.SAENZV..." className="w-full border border-slate-300 rounded-xl px-4 py-3 text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-[#59B447] outline-none" autoComplete="username" required />
                                )}
                            </div>

                            <div>
                                <label className="text-xs font-extrabold text-slate-600 uppercase block mb-1">🔑 Contraseña</label>
                                <div className="relative">
                                    <input type={showPass ? "text" : "password"} value={clave} onChange={e => setClave(e.target.value)} placeholder="••••••••••••" className="w-full border border-slate-300 rounded-xl px-4 py-3 pr-12 text-sm font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-[#59B447] outline-none" autoComplete="current-password" required />
                                    <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-lg">
                                        {showPass ? "🙈" : "👁️"}
                                    </button>
                                </div>
                            </div>

                            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-xs font-bold p-3 rounded-xl">{error}</div>}

                            <label className="flex items-center gap-2 cursor-pointer pt-1">
                                <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} className="w-4 h-4 accent-[#59B447] rounded" />
                                <span className="text-xs font-semibold text-slate-600">Recordar mi sesión en este equipo</span>
                            </label>

                            <button type="submit" disabled={loading} className="w-full bg-[#59B447] hover:bg-[#4a9c3a] active:scale-[0.99] text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition-all text-sm uppercase tracking-wider disabled:opacity-50">
                                {loading ? "🔐 Verificando en Script de Usuarios..." : "Ingresar al Sistema ➔"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 5. MODAL DEL PLAN DE PAGOS Y SIMULADOR (CON RENOVACIÓN INVERSA)
        // ============================================================================
        function ModalDetalleGrupoYSimulador({ item, onClose }) {
            if (!item) return null;

            const [vistaModal, setVistaModal] = React.useState("PLAN");
            const [simMonto, setSimMonto] = React.useState(() => String(item.monto || 2500));
            const [simCuotas, setSimCuotas] = React.useState(() => String(item.nroCuotas || 8));
            const [simFrecuencia, setSimFrecuencia] = React.useState(() => String(item.frecuencia || 14));
            const [simTasaTEM, setSimTasaTEM] = React.useState(() => String(item.tasaTEM || 21));
            const [simDiasGracia, setSimDiasGracia] = React.useState(() => String(Math.abs(parseInt(item.diasGracia, 10) || 0)));
            const [simGraciaNeg, setSimGraciaNeg] = React.useState(() => (parseInt(item.diasGracia, 10) || 0) < 0);
            const [simFechaISO, setSimFechaISO] = React.useState(() => item.fechaDesembolsoISO || item.fechaISO || getTodayISO());

            const [modoInverso, setModoInverso] = React.useState("tasa");
            const [cuotaObjetivoInv, setCuotaObjetivoInv] = React.useState("");

            const graciaFirmada = (parseInt(simDiasGracia, 10) || 0) * (simGraciaNeg ? -1 : 1);

            const simGlobal = React.useMemo(() => simularCreditoCrediban({
                monto: simMonto, frecuencia: simFrecuencia, nroCuotas: simCuotas,
                tasaTEM: simTasaTEM, diasGracia: graciaFirmada, fechaDesembolsoISO: simFechaISO
            }), [simMonto, simFrecuencia, simCuotas, simTasaTEM, graciaFirmada, simFechaISO]);

            React.useEffect(() => {
                if (simGlobal.activo && !cuotaObjetivoInv) setCuotaObjetivoInv(simGlobal.cuota.toFixed(2));
            }, [simGlobal.activo]);

            const resultadoInverso = React.useMemo(() => calcularInversoCrediban({
                modo: modoInverso, monto: simMonto, tasaFija: simTasaTEM,
                cuotas: simCuotas, frecuencia: simFrecuencia, diasGracia: graciaFirmada,
                cuotaObjetivo: cuotaObjetivoInv || simGlobal.cuota
            }), [modoInverso, simMonto, simTasaTEM, simCuotas, simFrecuencia, graciaFirmada, cuotaObjetivoInv, simGlobal.cuota]);

            const esGrupal = item.modalidad === "GRUPAL" || (Array.isArray(item.integrantes) && item.integrantes.length > 0);
            const integrantes = Array.isArray(item.integrantes) ? item.integrantes : [];
            const netoActual = Math.max(0, parseNum(simMonto) - parseNum(item.montoDescuento));
            const nombreLimpio = limpiarNombreExpediente(item.cliente);

            const exportarCronogramaPDF = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const logoB64 = await obtenerLogoCredibanBase64();

                doc.setFillColor(27, 67, 50);
                doc.rect(0, 0, 210, 26, 'F');
                if (logoB64) doc.addImage(logoB64, 'PNG', 10, 3, 14, 19);
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.text("CREDIBAN PERÚ - CALENDARIO DE PAGOS", 28, 11);
                doc.setFontSize(9);
                doc.text(`empieza a construir tus sueños  |  Sede: ${item.sede}  |  Asesor: ${item.asesor}  |  Modalidad: ${item.modalidad || 'INDIVIDUAL'}`, 28, 19);

                doc.setTextColor(30, 41, 59);
                doc.setFontSize(10);
                doc.text(`Cliente / Grupo: ${nombreLimpio}`, 14, 34);
                doc.text(`Monto Desembolsado: ${formatMoney(simMonto)}   |   Descuento: ${formatMoney(item.montoDescuento)}   |   Neto: ${formatMoney(netoActual)}`, 14, 40);
                doc.text(`Plazo: ${simCuotas} cuotas (${nombreFrecuencia(simFrecuencia)})   |   TEM: ${simTasaTEM}%   |   Cuota Calculada: ${formatMoney(simGlobal.cuota)}`, 14, 46);
                doc.text(`Posible Renovación (80%): ${formatDateDDMMYYYY(simGlobal.fechaRenovacion80ISO)}   |   Fecha de Vencimiento: ${formatDateDDMMYYYY(simGlobal.fechaVencimientoISO)}`, 14, 52);

                let currentY = 57;

                if (esGrupal && integrantes.length > 0) {
                    const rowsGrupo = integrantes.map((m, idx) => {
                        const simMiembro = simularCreditoCrediban({
                            monto: m.monto, frecuencia: simFrecuencia, nroCuotas: simCuotas,
                            tasaTEM: simTasaTEM, diasGracia: graciaFirmada, fechaDesembolsoISO: simFechaISO
                        });
                        const netoM = Math.max(0, parseNum(m.monto) - parseNum(m.descuento));
                        return [idx + 1, m.nombre, m.tipoCliente, formatMoney(m.monto), formatMoney(m.descuento), formatMoney(netoM), simMiembro.activo ? formatMoney(simMiembro.cuota) : "-"];
                    });

                    doc.autoTable({
                        startY: currentY,
                        head: [['#', 'Nombre del Integrante', 'Tipo', 'Monto Bruto', 'Descuento', 'Efectivo Neto', 'Cuota Indiv.']],
                        body: rowsGrupo, theme: 'grid', headStyles: { fillColor: [27, 67, 50], fontSize: 8 }, styles: { fontSize: 8 }
                    });
                    currentY = doc.lastAutoTable.finalY + 8;
                }

        // ============================================================================
        // 6. COMPONENTES DE GRÁFICOS VECTORIALES CORREGIDOS (NOMBRES CORTOS NOMBRE.A)
        // ============================================================================
        function LienzoSVGLineal({
            titulo, subtitulo = "", etiquetaEjeY, serieActual, serieComparada = null,
            mostrarTendencia = false, mostrarComparativa = false, modoSuperpuesto = false,
            colorPrincipal = "#2563eb", colorComparado = "#f59e0b", altura = 230,
            diaSeleccionado = null, onSelectDia = null
        }) {
            const [hoverIdx, setHoverIdx] = React.useState(null);
            const width = 580;
            const height = altura;
            const padLeft = 74;
            const padRight = 20;
            const padTop = 24;
            const padBottom = 38;
            const plotW = width - padLeft - padRight;
            const plotH = height - padTop - padBottom;

            const nPuntos = serieActual.length || 31;

            const maxValRaw = React.useMemo(() => {
                let m = 1000;
                serieActual.forEach(p => { if (p.valor > m) m = p.valor; });
                if (mostrarComparativa && Array.isArray(serieComparada)) {
                    serieComparada.forEach(p => { if (p.valor > m) m = p.valor; });
                }
                if (m <= 1500) return 1500;
                if (m <= 3000) return 3000;
                if (m <= 6000) return 6000;
                if (m <= 8000) return 8000;
                if (m <= 10000) return 10000;
                if (m <= 15000) return 15000;
                if (m <= 25000) return 25000;
                if (m <= 30000) return 30000;
                return Math.ceil(m / 10000) * 10000;
            }, [serieActual, serieComparada, mostrarComparativa]);

            const getX = (idx) => padLeft + (idx / Math.max(1, nPuntos - 1)) * plotW;
            const getY = (val) => padTop + plotH - (Math.min(maxValRaw, Math.max(0, val)) / maxValRaw) * plotH;

            const puntosActual = serieActual.map((p, i) => `${getX(i).toFixed(1)},${getY(p.valor).toFixed(1)}`).join(" ");
            const areaActual = `${getX(0).toFixed(1)},${(padTop + plotH).toFixed(1)} ${puntosActual} ${getX(nPuntos - 1).toFixed(1)},${(padTop + plotH).toFixed(1)}`;

            const puntosComp = (mostrarComparativa && Array.isArray(serieComparada))
                ? serieComparada.map((p, i) => `${getX(i).toFixed(1)},${getY(p.valor).toFixed(1)}`).join(" ")
                : "";
            const areaComp = puntosComp
                ? `${getX(0).toFixed(1)},${(padTop + plotH).toFixed(1)} ${puntosComp} ${getX(nPuntos - 1).toFixed(1)},${(padTop + plotH).toFixed(1)}`
                : "";

            const lineaTendencia = React.useMemo(() => {
                if (!mostrarTendencia || serieActual.length < 2) return null;
                let ultimoIdxConDatos = 22;
                serieActual.forEach((p, idx) => { if (p.valor > 0) ultimoIdxConDatos = Math.max(ultimoIdxConDatos, idx); });
                const sub = serieActual.slice(0, ultimoIdxConDatos + 1);
                const n = sub.length;
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                sub.forEach((p, i) => {
                    sumX += i;
                    sumY += p.valor;
                    sumXY += i * p.valor;
                    sumXX += i * i;
                });
                const denom = (n * sumXX - sumX * sumX);
                if (denom === 0) return null;
                const slope = (n * sumXY - sumX * sumY) / denom;
                const intercept = (sumY - slope * sumX) / n;
                const yStart = Math.max(0, intercept);
                const yEnd = Math.max(0, slope * (nPuntos - 1) + intercept);
                return { x1: getX(0), y1: getY(yStart), x2: getX(nPuntos - 1), y2: getY(yEnd) };
            }, [serieActual, mostrarTendencia, maxValRaw]);

            const nivelesY = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(maxValRaw * f));

            return (
                <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm hover:shadow-md transition relative overflow-hidden">
                    <div className="flex flex-wrap justify-between items-start gap-2 mb-1">
                        <div>
                            <h4 className="text-xs sm:text-sm font-black text-slate-800 uppercase tracking-tight">{titulo}</h4>
                            {subtitulo && <p className="text-[10px] font-bold text-slate-400">{subtitulo}</p>}
                        </div>
                        {hoverIdx !== null && serieActual[hoverIdx] && (
                            <div className="text-[11px] font-black bg-slate-900 text-white px-2.5 py-0.5 rounded-lg shadow">
                                {serieActual[hoverIdx].etiqueta}: <span className="text-emerald-400">{formatShortSoles(serieActual[hoverIdx].valor)}</span>
                                {mostrarComparativa && serieComparada && serieComparada[hoverIdx] && (
                                    <span className="text-amber-300 ml-1.5">| Ant: {formatShortSoles(serieComparada[hoverIdx].valor)}</span>
                                )}
                            </div>
                        )}
                    </div>

                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto select-none">
                        {nivelesY.map((val, idx) => {
                            const yPos = getY(val);
                            return (
                                <g key={idx}>
                                    <line x1={padLeft} y1={yPos} x2={width - padRight} y2={yPos} stroke={idx === 0 ? "#475569" : "#e2e8f0"} strokeWidth={idx === 0 ? "1.5" : "1"} />
                                    <text x={padLeft - 8} y={yPos + 3.5} textAnchor="end" fontSize="10" fontWeight="700" fill="#334155">
                                        {formatShortSoles(val)}
                                    </text>
                                </g>
                            );
                        })}

                        {serieActual.map((p, idx) => {
                            const numDia = idx + 1;
                            const mostrarTick = nPuntos <= 12 || numDia % 5 === 0 || numDia === 1;

                                    {mostrarTick && (

                                            <text x={xPos} y={padTop + plotH + 15} textAnchor="middle" fontSize="10" fontWeight="700" fill="#1e293b">

                        <text x={12} y={padTop + plotH / 2} transform={`rotate(-90, 12, ${padTop + plotH / 2})`} textAnchor="middle" fontSize="9.5" fontWeight="800" fill="#475569">

                        <text x={padLeft + plotW / 2} y={height - 4} textAnchor="middle" fontSize="10" fontWeight="800" fill="#475569">
                            {nPuntos >= 28 ? "DÍA DEL MES (Haz clic en un punto para inspeccionar el día)" : "PERIODO"}
                        </text>

                        {mostrarComparativa && puntosComp && (
                            <g>
                                {modoSuperpuesto && <polygon points={areaComp} fill={colorComparado} fillOpacity="0.22" />}
                                <polyline fill="none" stroke={colorComparado} strokeWidth={modoSuperpuesto ? "2" : "2.2"} strokeDasharray={modoSuperpuesto ? "4 3" : "5 3"} points={puntosComp} />
                            </g>
                        )}

                        <polygon points={areaActual} fill={colorPrincipal} fillOpacity={modoSuperpuesto ? "0.28" : "0.12"} />

                        {lineaTendencia && (

                        )}

                        <polyline fill="none" stroke={colorPrincipal} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" points={puntosActual} />

                        {serieActual.map((p, idx) => {
                            const cx = getX(idx);
                            const cy = getY(p.valor);
                            const numDia = idx + 1;
                            const esDiaActivo = diaSeleccionado && Number(diaSeleccionado) === numDia && nPuntos >= 28;
                            return (
                                <g
                                    key={idx}
                                    onMouseEnter={() => setHoverIdx(idx)}
                                    onMouseLeave={() => setHoverIdx(null)}
                                    onClick={() => { if (onSelectDia && nPuntos >= 28) onSelectDia(String(numDia)); }}
                                    className="cursor-pointer"
                                >
                                    {(p.valor > 0 || hoverIdx === idx || esDiaActivo) && (
                                        <circle
                                            cx={cx}
                                            cy={cy}
                                            r={esDiaActivo ? "6" : hoverIdx === idx ? "5" : "3"}
                                            fill={esDiaActivo ? "#10b981" : colorPrincipal}
                                            stroke="#ffffff"
                                            strokeWidth="1.5"
                                        />
                                    )}
                                    <rect x={cx - (plotW / nPuntos) / 2} y={padTop} width={plotW / nPuntos} height={plotH} fill="transparent" />
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        }

        function GraficoColumnasVerticalesSVG({
            titulo = "🏆 Cumplimiento de Metas por Asesor de Negocios",
            items = [],
            modoVisual = "MISMO_GRAFICO",
            mostrarComparativa = false,
            labelActual = "MES ACTUAL",
            labelComparado = "MES ANTERIOR",
            tipoUnidad = "PORCENTAJE"
        }) {
            const formatearEtiqueta = (v) => {
                if (tipoUnidad === "PORCENTAJE") return `${parseNum(v).toFixed(1)}%`;
                return formatShortSoles(v);
            };

            const renderizarCanvasColumnas = (lista, tituloCanvas, mostrarDosSeries, esSuperpuesto, usarSerieAnteriorComoUnica = false) => {
                let maxVal = 125;
                if (tipoUnidad === "PORCENTAJE") {
                    lista.forEach(it => {
                        maxVal = Math.max(maxVal, parseNum(it.actualPct), mostrarDosSeries ? parseNum(it.anteriorPct) : 0);
                    });
                    maxVal = Math.ceil(maxVal / 25) * 25;
                } else {
                    maxVal = 10000;
                    lista.forEach(it => {
                        maxVal = Math.max(maxVal, parseNum(it.actualMonto), mostrarDosSeries ? parseNum(it.anteriorMonto) : 0, parseNum(it.meta));
                    });
                    maxVal = Math.ceil(maxVal / 10000) * 10000;
                }

                const niveles = [0, 0.2, 0.4, 0.6, 0.8, 1].map(f => maxVal * f);

                return (
                    <div className="bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm overflow-hidden">
                        <div className="flex flex-wrap justify-between items-start gap-2 mb-3">
