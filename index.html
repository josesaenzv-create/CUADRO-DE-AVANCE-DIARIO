        // ============================================================================
        // 6. APLICACIÓN PRINCIPAL MULTI-SEDE CON PERMISOS ESTRICTOS POR ROL
        // ============================================================================
        function App() {
            const [session, setSession] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("crediban_desembolsos_session");
                    if (!saved) return null;
                    const parsed = JSON.parse(saved);
                    const rol = clasificarRolEstricto(parsed?.usuario?.cargo, parsed?.usuario?.cargoOriginal);
                    if (rol === "ASESOR" || !["GERENTE", "ADMINISTRADOR", "CAJERO"].includes(rol)) {
                        localStorage.removeItem("crediban_desembolsos_session");
                        return null;
                    }
                    return parsed;
                } catch (e) { return null; }
            });

            const [loadingData, setLoadingData] = React.useState(false);
            const [syncMsg, setSyncMsg] = React.useState("");
            const [sedesCatalogo, setSedesCatalogo] = React.useState([
                { nombre: "HUACHO", metaOficina: 300000, estado: "ACTIVA" },
                { nombre: "HUARAZ", metaOficina: 115000, estado: "ACTIVA" }
            ]);
            const [metasAsesores, setMetasAsesores] = React.useState([]);
            const [movimientos, setMovimientos] = React.useState([]);

            const [activeTab, setActiveTab] = React.useState("CUADROS"); // CAJA | CUADROS | RADAR | BASE | CONFIG

            // Estado para desplegar la lista de créditos al tocar el nombre de un asesor en el Cuadro de Avance
            const [asesorDesplegadoKey, setAsesorDesplegadoKey] = React.useState(null);

            // Estado para desplegar/ocultar la sección azul de Descuentos por Asesor en EVOLUCIÓN DIARIA
            const [mostrarDescuentosDetalle, setMostrarDescuentosDetalle] = React.useState(false);

            // Filtros Globales
            const [selectedSedeVista, setSelectedSedeVista] = React.useState("TODAS");
            const [filtroMes, setFiltroMes] = React.useState(() => MESES_ANIO[new Date().getMonth()]);
            const [filtroDia, setFiltroDia] = React.useState("TODOS");
            const [filtroDesde, setFiltroDesde] = React.useState("");
            const [filtroHasta, setFiltroHasta] = React.useState("");
            const [filtroAsesor, setFiltroAsesor] = React.useState("TODOS");
            const [filtroModalidad, setFiltroModalidad] = React.useState("TODAS");
            const [busquedaCliente, setBusquedaCliente] = React.useState("");

            // Modal de Plan de Pagos / Detalle Grupal
            const [itemDetalleModal, setItemDetalleModal] = React.useState(null);

            // Estados del Formulario de Desembolso (Exclusivo Cajero / Gerente, Sin Pagos)
            const [modalidadCredito, setModalidadCredito] = React.useState("INDIVIDUAL");
            const [formSede, setFormSede] = React.useState("HUACHO");
            const [formMes, setFormMes] = React.useState(() => MESES_ANIO[new Date().getMonth()]);
            const [formDiaSistema, setFormDiaSistema] = React.useState(() => new Date().getDate());
            const [formFechaISO, setFormFechaISO] = React.useState(() => getTodayISO());
            const [formAsesor, setFormAsesor] = React.useState("");
            const [formAsesorManual, setFormAsesorManual] = React.useState("");
            const [formNombreCliente, setFormNombreCliente] = React.useState("");
            const [formTipoCliente, setFormTipoCliente] = React.useState("CR");
            const [formMonto, setFormMonto] = React.useState("");
            const [formDescuento, setFormDescuento] = React.useState("0");

            const [formFrecuencia, setFormFrecuencia] = React.useState("14");
            const [formCuotas, setFormCuotas] = React.useState("8");
            const [formTasaTEM, setFormTasaTEM] = React.useState("21");
            const [formDiasGracia, setFormDiasGracia] = React.useState("0");
            const [formGraciaNegativa, setFormGraciaNegativa] = React.useState(false);

            const [grupoIntegrantes, setGrupoIntegrantes] = React.useState([
                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                { nombre: "", tipoCliente: "CN", monto: "", descuento: "0" }
            ]);
            const [savingMov, setSavingMov] = React.useState(false);

            // Estados de Configuración de Metas por Mes y Nuevas Sedes
            const [nuevaSedeNombre, setNuevaSedeNombre] = React.useState("");
            const [nuevaSedeMeta, setNuevaSedeMeta] = React.useState("80000");

            const [metaSedeSelect, setMetaSedeSelect] = React.useState("HUACHO");
            const [metaMesSelect, setMetaMesSelect] = React.useState(() => MESES_ANIO[new Date().getMonth()]);
            const [metaTipoSelect, setMetaTipoSelect] = React.useState("ASESOR");
            const [metaAsesorNombre, setMetaAsesorNombre] = React.useState("");
            const [metaAsesorMonto, setMetaAsesorMonto] = React.useState("45000");

            const userRole = clasificarRolEstricto(session?.usuario?.cargo, session?.usuario?.cargoOriginal);
            const userSede = session?.usuario?.sede || "HUACHO";
            const isGerente = userRole === "GERENTE";
            const isAdmin = userRole === "ADMINISTRADOR";
            const isCajero = userRole === "CAJERO";

            // REGLA: Los Administradores NO pueden agregar desembolsos. Solo Cajero (en su sede) y Gerente.
            const puedeDesembolsar = isCajero || isGerente;
            // REGLA: Solo Administradores y Gerentes pueden desglosar asesores y ver el detalle de créditos / renovaciones.
            const puedeVerDetalleAvanzado = isAdmin || isGerente;

            const cargarDatosServidor = React.useCallback(async (tokenToUse) => {
                const tk = tokenToUse || session?.token;
                if (!tk) return;
                setLoadingData(true);
                setSyncMsg("Sincronizando bóveda...");
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "getSystemData", token: tk })
                    });
                    const data = await res.json();

                    if (data.status === "unauthorized") {
                        alert(data.message || "Sesión expirada.");
                        handleLogout();
                        return;
                    }

                    if (data.status === "ok") {
                        if (Array.isArray(data.sedes) && data.sedes.length > 0) setSedesCatalogo(data.sedes);
                        if (Array.isArray(data.metasAsesores)) setMetasAsesores(data.metasAsesores);
                        if (Array.isArray(data.movimientos)) {
                            // Filtramos únicamente los registros de DESEMBOLSO (ya no se usa PAGOS)
                            setMovimientos(data.movimientos.filter(m => m.formato === "DESEMBOLSO"));
                        }
                        setSyncMsg("Conectado en vivo ✅");
                    } else {
                        setSyncMsg("⚠️ " + (data.message || "Error al sincronizar"));
                    }
                } catch (e) {
                    setSyncMsg("⚠️ Error de red al consultar datos");
                } finally {
                    setLoadingData(false);
                }
            }, [session]);

            React.useEffect(() => {
                if (session && session.token) {
                    const rol = clasificarRolEstricto(session.usuario.cargo, session.usuario.cargoOriginal);
                    const sedeInicial = rol === "GERENTE" ? "TODAS" : session.usuario.sede;
                    setSelectedSedeVista(sedeInicial);
                    setFormSede(session.usuario.sede === "TODAS" ? "HUACHO" : session.usuario.sede);
                    setMetaSedeSelect(session.usuario.sede === "TODAS" ? "HUACHO" : session.usuario.sede);
                    // Si es Cajero inicia en CAJA; si es Admin o Gerente inicia en CUADROS
                    setActiveTab(rol === "CAJERO" ? "CAJA" : "CUADROS");
                    cargarDatosServidor(session.token);
                }
            }, [session]);

            const handleLoginSuccess = (sessionData, remember) => {
                setSession(sessionData);
                if (remember) {
                    localStorage.setItem("crediban_desembolsos_session", JSON.stringify(sessionData));
                }
            };

            const handleLogout = () => {
                localStorage.removeItem("crediban_desembolsos_session");
                setSession(null);
                setMovimientos([]);
            };

            const asesoresDeSedeForm = React.useMemo(() => {
                const sedeTarget = isGerente ? formSede : userSede;
                const deMetas = metasAsesores
                    .map(parsearRegistroMeta)
                    .filter(m => m.sede === sedeTarget && m.estado === "ACTIVO" && m.asesor !== "__OFICINA__")
                    .map(m => m.asesor);
                const deMovs = movimientos
                    .filter(m => m.sede === sedeTarget && m.asesor)
                    .map(m => m.asesor);
                return Array.from(new Set([...deMetas, ...deMovs])).filter(Boolean);
            }, [metasAsesores, movimientos, formSede, isGerente, userSede]);

            React.useEffect(() => {
                if (asesoresDeSedeForm.length > 0 && !asesoresDeSedeForm.includes(formAsesor)) {
                    setFormAsesor(asesoresDeSedeForm[0]);
                }
            }, [asesoresDeSedeForm, formSede]);

            const totalesFormulario = React.useMemo(() => {
                if (modalidadCredito === "GRUPAL") {
                    let sumaMonto = 0;
                    let sumaDesc = 0;
                    let cantCN = 0;
                    let miembrosValidos = 0;
                    grupoIntegrantes.forEach(m => {
                        const mMonto = parseNum(m.monto);
                        const mDesc = m.tipoCliente === "CR" ? parseNum(m.descuento) : 0;
                        if (m.nombre.trim() && mMonto > 0) miembrosValidos++;
                        sumaMonto += mMonto;
                        sumaDesc += mDesc;
                        if (m.tipoCliente === "CN") cantCN++;
                    });
                    return {
                        montoBruto: sumaMonto,
                        montoDescuento: sumaDesc,
                        efectivoNeto: Math.max(0, sumaMonto - sumaDesc),
                        cantidadCN: cantCN,
                        nroIntegrantes: miembrosValidos
                    };
                } else {
                    const mBruto = parseNum(formMonto);
                    const mDesc = formTipoCliente === "CR" ? parseNum(formDescuento) : 0;
                    return {
                        montoBruto: mBruto,
                        montoDescuento: mDesc,
                        efectivoNeto: Math.max(0, mBruto - mDesc),
                        cantidadCN: formTipoCliente === "CN" ? 1 : 0,
                        nroIntegrantes: 1
                    };
                }
            }, [modalidadCredito, grupoIntegrantes, formMonto, formDescuento, formTipoCliente]);

            const diasGraciaFinalForm = (parseInt(formDiasGracia, 10) || 0) * (formGraciaNegativa ? -1 : 1);
            const simulacionEnVivo = React.useMemo(() => {
                return simularCreditoCrediban({
                    monto: totalesFormulario.montoBruto,
                    frecuencia: formFrecuencia,
                    nroCuotas: formCuotas,
                    tasaTEM: formTasaTEM,
                    diasGracia: diasGraciaFinalForm,
                    fechaDesembolsoISO: formFechaISO
                });
            }, [totalesFormulario.montoBruto, formFrecuencia, formCuotas, formTasaTEM, diasGraciaFinalForm, formFechaISO]);

            const handleUpdateMiembroGrupo = (index, field, value) => {
                setGrupoIntegrantes(prev => prev.map((item, idx) => idx === index ? { ...item, [field]: value } : item));
            };

            const handleAddMiembroGrupo = () => {
                setGrupoIntegrantes(prev => [...prev, { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" }]);
            };

            const handleRemoveMiembroGrupo = (index) => {
                if (grupoIntegrantes.length <= 2) {
                    alert("Un crédito grupal requiere al menos 2 o 3 integrantes.");
                    return;
                }
                setGrupoIntegrantes(prev => prev.filter((_, idx) => idx !== index));
            };

            // Guardar Desembolso (Bloqueado para Administradores)
            const handleRegistrarDesembolso = async (e) => {
                e.preventDefault();
                if (!session?.token || !puedeDesembolsar) {
                    alert("⛔ Tu rol no tiene permisos para registrar desembolsos.");
                    return;
                }

                const asesorElegido = (formAsesor === "__OTRO__" ? formAsesorManual : formAsesor).trim().toUpperCase();
                if (!asesorElegido) {
                    alert("Selecciona o escribe el nombre del Asesor.");
                    return;
                }
                if (!formNombreCliente.trim()) {
                    alert(modalidadCredito === "GRUPAL" ? "Ingresa el Nombre del Grupo." : "Ingresa el Nombre y Apellidos del Cliente.");
                    return;
                }
                if (totalesFormulario.montoBruto <= 0) {
                    alert("El monto a desembolsar debe ser mayor a S/ 0.00");
                    return;
                }

                const payloadData = {
                    sede: isGerente ? formSede : userSede,
                    formato: "DESEMBOLSO",
                    mesRegistro: formMes,
                    diaSistema: parseInt(formDiaSistema, 10) || new Date().getDate(),
                    asesor: asesorElegido,
                    modalidad: modalidadCredito,
                    nombreCliente: formNombreCliente.trim().toUpperCase(),
                    tipoCliente: formTipoCliente,
                    monto: totalesFormulario.montoBruto,
                    montoDescuento: totalesFormulario.montoDescuento,
                    frecuencia: parseInt(formFrecuencia, 10) || 14,
                    nroCuotas: parseInt(formCuotas, 10) || 0,
                    tasaTEM: parseNum(formTasaTEM),
                    diasGracia: diasGraciaFinalForm,
                    fechaDesembolsoISO: formFechaISO,
                    integrantes: modalidadCredito === "GRUPAL" ? grupoIntegrantes : []
                };

                setSavingMov(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "registrarMovimiento",
                            token: session.token,
                            data: payloadData
                        })
                    });
                    const result = await res.json();
                    if (result.status === "ok") {
                        alert(result.message);
                        setFormNombreCliente("");
                        setFormMonto("");
                        setFormDescuento("0");
                        if (modalidadCredito === "GRUPAL") {
                            setGrupoIntegrantes([
                                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                                { nombre: "", tipoCliente: "CR", monto: "", descuento: "0" },
                                { nombre: "", tipoCliente: "CN", monto: "", descuento: "0" }
                            ]);
                        }
                        cargarDatosServidor(session.token);
                    } else {
                        alert("⚠️ " + (result.message || "No se pudo guardar el desembolso."));
                    }
                } catch (err) {
                    alert("⚠️ Error de red al guardar el desembolso.");
                } finally {
                    setSavingMov(false);
                }
            };

            const handleCrearNuevaSede = async (e) => {
                e.preventDefault();
                if (!nuevaSedeNombre.trim()) return;
                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "crearSede",
                            token: session.token,
                            nombreSede: nuevaSedeNombre.trim().toUpperCase(),
                            metaOficina: parseNum(nuevaSedeMeta)
                        })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === "ok") {
                        setNuevaSedeNombre("");
                        cargarDatosServidor(session.token);
                    }
                } catch (e) {
                    alert("Error al crear sede.");
                } finally {
                    setLoadingData(false);
                }
            };

            const handleGuardarMetaMensual = async (e) => {
                e.preventDefault();
                const sedeDestino = isGerente ? metaSedeSelect : userSede;
                const nombreBase = metaTipoSelect === "OFICINA"
                    ? "__OFICINA__"
                    : metaAsesorNombre.trim().toUpperCase();

                if (!nombreBase) {
                    alert("Ingresa el nombre del asesor.");
                    return;
                }

                const claveAsesorMes = metaMesSelect === "TODOS"
                    ? nombreBase
                    : `${nombreBase}::${metaMesSelect}`;

                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "guardarMetaAsesor",
                            token: session.token,
                            sede: sedeDestino,
                            asesor: claveAsesorMes,
                            meta: parseNum(metaAsesorMonto),
                            estado: "ACTIVO"
                        })
                    });
                    const data = await res.json();
                    if (data.status === "ok") {
                        alert(`✅ Meta de ${metaTipoSelect === "OFICINA" ? "OFICINA " + sedeDestino : nombreBase} (${metaMesSelect}) guardada en ${formatMoney(metaAsesorMonto)}.`);
                        if (metaTipoSelect === "ASESOR") setMetaAsesorNombre("");
                        cargarDatosServidor(session.token);
                    } else {
                        alert(data.message || "Error al guardar meta.");
                    }
                } catch (e) {
                    alert("Error al actualizar meta mensual.");
                } finally {
                    setLoadingData(false);
                }
            };

            const handleEliminarRegistro = async (mov) => {
                if (!puedeVerDetalleAvanzado) return;
                if (!confirm(`⚠️ ¿Estás seguro de ANULAR el desembolso de "${mov.cliente}" por ${formatMoney(mov.monto)} en ${mov.sede}?`)) {
                    return;
                }
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({
                            action: "eliminarMovimiento",
                            token: session.token,
                            sede: mov.sede,
                            idRegistro: mov.idRegistro,
                            rowNumber: mov.rowNumber
                        })
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.status === "ok") cargarDatosServidor(session.token);
                } catch (e) {
                    alert("Error al anular registro.");
                }
            };

            // ========================================================================
            // 7. MOTOR DE METAS HISTÓRICAS, DESGLOSE POR ASESOR Y EVOLUCIÓN DIARIA
            // ========================================================================
            const obtenerMetaOficinaPorMes = React.useCallback((nombreSede, mesConsulta) => {
                const sClean = String(nombreSede || "").trim().toUpperCase();
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaOficinaMes = metasParseadas.find(
                    x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === mClean
                );
                if (metaOficinaMes && metaOficinaMes.meta > 0) return metaOficinaMes.meta;

                if (HISTORIAL_METAS_BASE[mClean]?.oficinas?.[sClean]) {
                    return HISTORIAL_METAS_BASE[mClean].oficinas[sClean];
                }

                const metaOficinaGral = metasParseadas.find(
                    x => x.sede === sClean && x.asesor === "__OFICINA__" && x.mes === "TODOS"
                );
                if (metaOficinaGral && metaOficinaGral.meta > 0) return metaOficinaGral.meta;

                const sedeCat = sedesCatalogo.find(s => s.nombre === sClean);
                return sedeCat ? parseNum(sedeCat.metaOficina) : 100000;
            }, [metasAsesores, sedesCatalogo]);

            const obtenerMetaAsesorPorMes = React.useCallback((nombreSede, nombreAsesor, mesConsulta) => {
                const sClean = String(nombreSede || "").trim().toUpperCase();
                const aClean = String(nombreAsesor || "").trim().toUpperCase();
                const mClean = String(mesConsulta || "TODOS").trim().toUpperCase();
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                const metaEspecificaMes = metasParseadas.find(
                    x => x.sede === sClean && x.asesor === aClean && x.mes === mClean
                );
                if (metaEspecificaMes && metaEspecificaMes.meta > 0) return metaEspecificaMes.meta;

                const keyHist = `${sClean}__${aClean}`;
                if (HISTORIAL_METAS_BASE[mClean]?.asesores?.[keyHist]) {
                    return HISTORIAL_METAS_BASE[mClean].asesores[keyHist];
                }

                const metaGeneral = metasParseadas.find(
                    x => x.sede === sClean && x.asesor === aClean && x.mes === "TODOS"
                );
                if (metaGeneral && metaGeneral.meta > 0) return metaGeneral.meta;

                return 45000;
            }, [metasAsesores]);

            const movimientosFiltrados = React.useMemo(() => {
                return movimientos.filter(m => {
                    if (m.formato !== "DESEMBOLSO") return false;
                    const sedeActiva = isGerente ? selectedSedeVista : userSede;
                    if (sedeActiva !== "TODAS" && m.sede !== sedeActiva) return false;
                    if (filtroMes !== "TODOS" && m.mesRegistro !== filtroMes) return false;
                    if (filtroDia !== "TODOS" && Number(m.diaSistema) !== Number(filtroDia)) return false;

                    const fComparar = m.fechaDesembolsoISO || m.fechaISO || "";
                    if (filtroDesde && fComparar && fComparar < filtroDesde) return false;
                    if (filtroHasta && fComparar && fComparar > filtroHasta) return false;

                    if (filtroAsesor !== "TODOS" && m.asesor !== filtroAsesor) return false;
                    if (filtroModalidad !== "TODAS" && (m.modalidad || "INDIVIDUAL") !== filtroModalidad) return false;

                    if (busquedaCliente.trim()) {
                        const q = busquedaCliente.toLowerCase();
                        const matchTitular = String(m.cliente || "").toLowerCase().includes(q);
                        const matchAsesor = String(m.asesor || "").toLowerCase().includes(q);
                        const matchMiembro = Array.isArray(m.integrantes) && m.integrantes.some(i => String(i.nombre || "").toLowerCase().includes(q));
                        if (!matchTitular && !matchAsesor && !matchMiembro) return false;
                    }
                    return true;
                });
            }, [movimientos, isGerente, selectedSedeVista, userSede, filtroMes, filtroDia, filtroDesde, filtroHasta, filtroAsesor, filtroModalidad, busquedaCliente]);

            const resumenAnalitico = React.useMemo(() => {
                const desembolsos = movimientosFiltrados;
                const sedeActiva = isGerente ? selectedSedeVista : userSede;

                const metaOficinaTotal = sedesCatalogo
                    .filter(s => sedeActiva === "TODAS" || s.nombre === sedeActiva)
                    .reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, filtroMes), 0) || 300000;

                const totalBruto = desembolsos.reduce((acc, d) => acc + parseNum(d.monto), 0);
                const totalDescuento = desembolsos.reduce((acc, d) => acc + parseNum(d.montoDescuento), 0);
                const totalNeto = Math.max(0, totalBruto - totalDescuento);
                const totalCN = desembolsos.reduce((acc, d) => acc + (parseInt(d.cantidadCN, 10) || 0), 0);
                const totalGrupales = desembolsos.filter(d => d.modalidad === "GRUPAL").length;

                const avanceOficinaPct = metaOficinaTotal > 0 ? (totalBruto / metaOficinaTotal) * 100 : 0;
                const pctDescuentoGlobal = totalBruto > 0 ? (totalDescuento / totalBruto) * 100 : 0;

                const mapaAsesores = {};
                const metasParseadas = metasAsesores.map(parsearRegistroMeta);

                metasParseadas
                    .filter(m => (sedeActiva === "TODAS" || m.sede === sedeActiva) && m.asesor !== "__OFICINA__")
                    .forEach(m => {
                        if (m.mes !== "TODOS" && filtroMes !== "TODOS" && m.mes !== filtroMes) return;
                        const key = `${m.sede}__${m.asesor}`;
                        if (!mapaAsesores[key]) {
                            mapaAsesores[key] = {
                                key,
                                sede: m.sede,
                                asesor: m.asesor,
                                meta: obtenerMetaAsesorPorMes(m.sede, m.asesor, filtroMes),
                                desembolsado: 0,
                                cn: 0,
                                descuento: 0,
                                neto: 0,
                                operaciones: 0,
                                grupales: 0,
                                creditos: [] // Lista detallada de créditos filtrados de este asesor
                            };
                        }
                    });

                desembolsos.forEach(d => {
                    if (!d.asesor) return;
                    const key = `${d.sede}__${d.asesor}`;
                    if (!mapaAsesores[key]) {
                        mapaAsesores[key] = {
                            key,
                            sede: d.sede,
                            asesor: d.asesor,
                            meta: obtenerMetaAsesorPorMes(d.sede, d.asesor, filtroMes),
                            desembolsado: 0,
                            cn: 0,
                            descuento: 0,
                            neto: 0,
                            operaciones: 0,
                            grupales: 0,
                            creditos: []
                        };
                    }
                    const item = mapaAsesores[key];
                    item.desembolsado += parseNum(d.monto);
                    item.cn += (parseInt(d.cantidadCN, 10) || 0);
                    item.descuento += parseNum(d.montoDescuento);
                    item.neto += Math.max(0, parseNum(d.monto) - parseNum(d.montoDescuento));
                    item.operaciones += 1;
                    if (d.modalidad === "GRUPAL") item.grupales += 1;
                    item.creditos.push(d);
                });

                const tablaAsesores = Object.values(mapaAsesores).map(a => {
                    const avancePct = a.meta > 0 ? (a.desembolsado / a.meta) * 100 : 0;
                    const porcentualOficina = totalBruto > 0 ? (a.descuento / totalBruto) * 100 : 0;
                    const faltaMeta = Math.max(0, a.meta - a.desembolsado);
                    return { ...a, avancePct, porcentualOficina, faltaMeta };
                }).sort((a, b) => b.desembolsado - a.desembolsado);

                // Construcción de la matriz "EVOLUCIÓN DIARIA" (Imagen 1)
                const nombresAsesoresUnicos = Array.from(
                    new Set(Object.values(mapaAsesores).map(a => a.asesor))
                );

                const evolucionDiariaFilas = [];
                const totalesDesembolsoPorAsesor = {};
                const totalesDescuentoPorAsesor = {};
                nombresAsesoresUnicos.forEach(nom => {
                    totalesDesembolsoPorAsesor[nom] = 0;
                    totalesDescuentoPorAsesor[nom] = 0;
                });

                let granTotalDesembolsos = 0;
                let granTotalDescuentos = 0;
                let granTotalNeto = 0;

                for (let dia = 1; dia <= 31; dia++) {
                    const desembolsosPorAsesorDia = {};
                    const descuentosPorAsesorDia = {};
                    nombresAsesoresUnicos.forEach(nom => {
                        desembolsosPorAsesorDia[nom] = 0;
                        descuentosPorAsesorDia[nom] = 0;
                    });

                    let totalDesDia = 0;
                    let totalDescDia = 0;

                    desembolsos
                        .filter(d => Number(d.diaSistema) === dia)
                        .forEach(d => {
                            const mBruto = parseNum(d.monto);
                            const mDesc = parseNum(d.montoDescuento);
                            const ase = d.asesor;
                            if (ase && desembolsosPorAsesorDia[ase] !== undefined) {
                                desembolsosPorAsesorDia[ase] += mBruto;
                                descuentosPorAsesorDia[ase] += mDesc;
                                totalesDesembolsoPorAsesor[ase] += mBruto;
                                totalesDescuentoPorAsesor[ase] += mDesc;
                            }
                            totalDesDia += mBruto;
                            totalDescDia += mDesc;
                        });

                    const netoDia = Math.max(0, totalDesDia - totalDescDia);
                    granTotalDesembolsos += totalDesDia;
                    granTotalDescuentos += totalDescDia;
                    granTotalNeto += netoDia;

                    evolucionDiariaFilas.push({
                        dia,
                        desembolsosPorAsesorDia,
                        totalDesDia,
                        descuentosPorAsesorDia,
                        totalDescDia,
                        netoDia
                    });
                }

                const comparativoSedes = sedesCatalogo.map(s => {
                    const metaS = obtenerMetaOficinaPorMes(s.nombre, filtroMes);
                    const desSede = desembolsos.filter(d => d.sede === s.nombre);
                    const brutoS = desSede.reduce((a, b) => a + parseNum(b.monto), 0);
                    const descS = desSede.reduce((a, b) => a + parseNum(b.montoDescuento), 0);
                    const cnS = desSede.reduce((a, b) => a + (parseInt(b.cantidadCN, 10) || 0), 0);
                    return {
                        sede: s.nombre,
                        meta: metaS,
                        bruto: brutoS,
                        avancePct: metaS > 0 ? (brutoS / metaS) * 100 : 0,
                        cn: cnS,
                        descuento: descS,
                        neto: Math.max(0, brutoS - descS),
                        operaciones: desSede.length
                    };
                });

                return {
                    metaOficinaTotal,
                    totalBruto,
                    totalDescuento,
                    totalNeto,
                    totalCN,
                    totalGrupales,
                    avanceOficinaPct,
                    pctDescuentoGlobal,
                    tablaAsesores,
                    nombresAsesoresUnicos,
                    evolucionDiariaFilas,
                    totalesDesembolsoPorAsesor,
                    totalesDescuentoPorAsesor,
                    granTotalDesembolsos,
                    granTotalDescuentos,
                    granTotalNeto,
                    comparativoSedes
                };
            }, [movimientosFiltrados, sedesCatalogo, metasAsesores, isGerente, selectedSedeVista, userSede, filtroMes, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const listaRadarCreditos = React.useMemo(() => {
                return movimientosFiltrados
                    .filter(m => parseInt(m.nroCuotas, 10) > 0 && parseInt(m.frecuencia, 10) > 0)
                    .map(m => {
                        const sim = simularCreditoCrediban({
                            monto: m.monto,
                            frecuencia: m.frecuencia,
                            nroCuotas: m.nroCuotas,
                            tasaTEM: m.tasaTEM,
                            diasGracia: m.diasGracia,
                            fechaDesembolsoISO: m.fechaDesembolsoISO || m.fechaISO
                        });
                        return { ...m, sim };
                    })
                    .filter(m => m.sim.activo);
            }, [movimientosFiltrados]);

            const handleExportarReportePDF = async () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('l', 'mm', 'a4');
                const sedeTit = isGerente ? selectedSedeVista : userSede;
                const logoB64 = await obtenerLogoCredibanBase64();

                doc.setFillColor(27, 67, 50);
                doc.rect(0, 0, 297, 24, 'F');
                if (logoB64) {
                    doc.addImage(logoB64, 'PNG', 10, 2.5, 14, 19);
                }
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(15);
                doc.text(`CREDIBAN PERÚ - REPORTE DE AVANCE DE METAS Y EVOLUCIÓN DIARIA (${sedeTit})`, 28, 11);
                doc.setFontSize(9);
                doc.text(`empieza a construir tus sueños  |  Mes: ${filtroMes}  |  Generado por: ${session.usuario.nombre} (${userRole})`, 28, 18);

                doc.setTextColor(30, 41, 59);
                doc.setFontSize(10);
                doc.text(`Meta Oficina (${filtroMes}): ${formatMoney(resumenAnalitico.metaOficinaTotal)}  |  Desembolsado: ${formatMoney(resumenAnalitico.totalBruto)} (${resumenAnalitico.avanceOficinaPct.toFixed(2)}%)  |  CN: ${resumenAnalitico.totalCN}  |  Descuentos: ${formatMoney(resumenAnalitico.totalDescuento)}  |  Neto: ${formatMoney(resumenAnalitico.totalNeto)}`, 14, 31);

                doc.autoTable({
                    startY: 35,
                    head: [['Sede', 'Asesor', `Meta (${filtroMes})`, 'M. Desembolsado', '% Avance', 'CN', 'Descuento', 'Desembolso Neto', '% Desc.']],
                    body: [
                        [
                            sedeTit,
                            'TOTAL OFICINA',
                            formatMoney(resumenAnalitico.metaOficinaTotal),
                            formatMoney(resumenAnalitico.totalBruto),
                            `${resumenAnalitico.avanceOficinaPct.toFixed(2)}%`,
                            resumenAnalitico.totalCN,
                            formatMoney(resumenAnalitico.totalDescuento),
                            formatMoney(resumenAnalitico.totalNeto),
                            `${resumenAnalitico.pctDescuentoGlobal.toFixed(2)}%`
                        ],
                        ...resumenAnalitico.tablaAsesores.map(a => [
                            a.sede,
                            a.asesor,
                            formatMoney(a.meta),
                            formatMoney(a.desembolsado),
                            `${a.avancePct.toFixed(2)}%`,
                            a.cn,
                            formatMoney(a.descuento),
                            formatMoney(a.neto),
                            `${a.porcentualOficina.toFixed(2)}%`
                        ])
                    ],
                    theme: 'grid',
                    headStyles: { fillColor: [89, 180, 71], fontSize: 8.5 },
                    styles: { fontSize: 8 }
                });

                doc.save(`Reporte_Crediban_${sedeTit}_${filtroMes}.pdf`);
            };

            const handleExportarCSV = () => {
                const headers = ["Sede", "Fecha", "Cajero", "Dia_Sistema", "Mes", "Modalidad", "Integrantes", "Asesor", "Cliente_O_Grupo", "Tipo_Cliente", "Cant_CN", "Monto_Bruto", "Descuento", "Monto_Neto", "Frecuencia_Dias", "Cuotas", "Tasa_TEM"];
                const rows = movimientosFiltrados.map(m => [
                    m.sede, m.marcaTemporal, m.cajero, m.diaSistema, m.mesRegistro,
                    m.modalidad || "INDIVIDUAL", m.nroIntegrantes || 1, m.asesor,
                    `"${String(m.cliente || "").replace(/"/g, '""')}"`, m.tipoCliente, m.cantidadCN,
                    m.monto, m.montoDescuento, m.montoNeto,
                    m.frecuencia || "", m.nroCuotas || "", m.tasaTEM || ""
                ]);
                const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Base_Crediban_${isGerente ? selectedSedeVista : userSede}_${filtroMes}.csv`;
                a.click();
            };

            if (!session) {
                return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
            }

            return (
                <div className="min-h-screen flex flex-col">
                    {/* ====================================================================
                        BARRA SUPERIOR CON LOGO Y LEMA "empieza a construir tus sueños"
                    ==================================================================== */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-4">
                                <CredibanLogo size="md" />
                                <div className="hidden sm:block h-8 w-[1px] bg-slate-200"></div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <span className="bg-[#1b4332] text-white text-[11px] font-black px-2.5 py-0.5 rounded-full uppercase">
                                            {userRole}
                                        </span>
                                        <span className="bg-emerald-100 text-emerald-900 border border-emerald-300 text-[11px] font-black px-2.5 py-0.5 rounded-full uppercase">
                                            📍 Sede: {userSede}
                                        </span>
                                    </div>
                                    <div className="text-xs font-extrabold text-slate-700 mt-0.5">
                                        👤 {session.usuario.nombre} <span className="text-slate-400 font-semibold ml-1">({syncMsg})</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button

                                                🎯 Configurar Meta Mensual (Por Mes y Sede)
                                            </h3>
                                            <p className="text-xs text-slate-500 font-semibold mt-0.5">
                                                Cada mes conserva su propio historial de metas para que Gerencia y Administración puedan auditar cualquier mes pasado o actual.
                                            </p>
                                        </div>

                                        <form onSubmit={handleGuardarMetaMensual} className="space-y-3">
                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="text-xs font-extrabold text-slate-600 block mb-1">📍 Sede</label>
                                                    <select
                                                        value={isGerente ? metaSedeSelect : userSede}
                                                        disabled={!isGerente}
                                                        onChange={e => setMetaSedeSelect(e.target.value)}
                                                        className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold bg-slate-50"
                                                    >
                                                        {sedesCatalogo.map(s => <option key={s.nombre} value={s.nombre}>{s.nombre}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-extrabold text-emerald-700 block mb-1">📅 Mes de la Meta</label>
                                                    <select
                                                        value={metaMesSelect}
                                                        onChange={e => setMetaMesSelect(e.target.value)}
                                                        className="w-full border-2 border-[#59B447] rounded-xl px-3 py-2 text-xs font-black bg-emerald-50/40"
                                                    >
                                                        {MESES_ANIO.map(m => <option key={m} value={m}>{m}</option>)}
                                                        <option value="TODOS">GENERAL (Por defecto)</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-xl">
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        setMetaTipoSelect("ASESOR");
                                                        setMetaAsesorMonto("45000");
                                                    }}
                                                    className={`py-2 rounded-lg text-xs font-black transition ${metaTipoSelect === "ASESOR" ? "bg-white text-slate-900 shadow" : "text-slate-500"}`}
                                                >
                                                    👤 Meta de Asesor
                                                </button>
                                                <button
                                                    type="button"
                                                    onClick={() => {
                                                        setMetaTipoSelect("OFICINA");
                                                        setMetaAsesorMonto("300000");
                                                    }}
                                                    className={`py-2 rounded-lg text-xs font-black transition ${metaTipoSelect === "OFICINA" ? "bg-white text-slate-900 shadow" : "text-slate-500"}`}
                                                >
                                                    🏢 Meta de toda la Oficina
                                                </button>
                                            </div>

                                            {metaTipoSelect === "ASESOR" && (
                                                <div>
                                                    <label className="text-xs font-extrabold text-slate-600 block mb-1">Nombre del Asesor</label>
                                                    <input
                                                        type="text"
                                                        placeholder="Ej: ABIGAIL, HUGO, HEIDY, SHEILA..."
                                                        value={metaAsesorNombre}
                                                        onChange={e => setMetaAsesorNombre(e.target.value)}
                                                        className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold uppercase"
                                                        required
                                                    />
                                                </div>
                                            )}

                                            <div>
                                                <label className="text-xs font-extrabold text-slate-600 block mb-1">
                                                    Monto de Meta para {metaMesSelect} (S/)
                                                </label>
                                                <input
                                                    type="number"
                                                    step="500"
                                                    value={metaAsesorMonto}
                                                    onChange={e => setMetaAsesorMonto(e.target.value)}
                                                    className="w-full border rounded-xl px-3 py-2 text-xs font-black"
                                                    required
                                                />
                                            </div>

                                            <button type="submit" className="w-full bg-[#59B447] hover:bg-[#4a9c3a] text-white font-black py-3 rounded-2xl text-xs uppercase shadow">
                                                💾 Guardar Meta en el Historial de {metaMesSelect}
                                            </button>
                                        </form>
                                    </div>

                                    {isGerente && (
                                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                                            <h3 className="text-sm font-black uppercase text-[#1b4332] border-b pb-2">
                                                🏢 Expansión CREDIBAN: Añadir Nueva Sede a Voluntad
                                            </h3>
                                            <p className="text-xs text-slate-500 font-semibold">
                                                Al crear una nueva sede aquí, el sistema generará automáticamente su pestaña oficial en el Google Sheet y la habilitará en toda la aplicación.
                                            </p>
                                            <form onSubmit={handleCrearNuevaSede} className="space-y-3">
                                                <div>
                                                    <label className="text-xs font-extrabold text-slate-600 block mb-1">Nombre de la Nueva Ciudad / Sede</label>
                                                    <input
                                                        type="text"
                                                        placeholder="Ej: BARRANCA, CHIMBOTE, TRUJILLO, CHINCHA..."
                                                        value={nuevaSedeNombre}
                                                        onChange={e => setNuevaSedeNombre(e.target.value)}
                                                        className="w-full border rounded-xl px-3 py-2 text-xs font-extrabold uppercase"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-extrabold text-slate-600 block mb-1">Meta Mensual Base de la Oficina (S/)</label>
                                                    <input
                                                        type="number"
                                                        step="1000"
                                                        value={nuevaSedeMeta}
                                                        onChange={e => setNuevaSedeMeta(e.target.value)}
                                                        className="w-full border rounded-xl px-3 py-2 text-xs font-black"
                                                        required
                                                    />
                                                </div>
                                                <button type="submit" className="w-full bg-[#1b4332] hover:bg-slate-900 text-white font-black py-3 rounded-2xl text-xs uppercase shadow">
                                                    ➕ Crear Sede y Generar Pestaña en Google Sheets
                                                </button>
                                            </form>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="bg-slate-800 text-white px-5 py-3 flex flex-wrap justify-between items-center gap-2">
                                        <h3 className="text-xs font-black uppercase">
                                            📚 Historial de Metas Configuradas — Mes Visualizado: {metaMesSelect} (Sede: {isGerente ? metaSedeSelect : userSede})
                                        </h3>
                                    </div>
                                    <div className="p-4">
                                        <div className="mb-3 bg-emerald-50 border border-emerald-200 p-3 rounded-2xl flex justify-between items-center">
                                            <span className="text-xs font-black text-emerald-950 uppercase">
                                                🏢 Meta Oficina {isGerente ? metaSedeSelect : userSede} ({metaMesSelect}):
                                            </span>
                                            <span className="text-base font-black text-emerald-800">
                                                {formatMoney(obtenerMetaOficinaPorMes(isGerente ? metaSedeSelect : userSede, metaMesSelect))}
                                            </span>
                                        </div>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5">
                                            {Array.from(new Set([
                                                ...metasAsesores
                                                    .map(parsearRegistroMeta)
                                                    .filter(m => m.sede === (isGerente ? metaSedeSelect : userSede) && m.asesor !== "__OFICINA__")
                                                    .map(m => m.asesor),
                                                ...Object.keys(HISTORIAL_METAS_BASE[metaMesSelect]?.asesores || {})
                                                    .filter(k => k.startsWith((isGerente ? metaSedeSelect : userSede) + "__"))
                                                    .map(k => k.split("__")[1])
                                            ])).map(nomAse => (
                                                <div
                                                    key={nomAse}
                                                    onClick={() => {
                                                        setMetaTipoSelect("ASESOR");
                                                        setMetaAsesorNombre(nomAse);
                                                        setMetaAsesorMonto(String(obtenerMetaAsesorPorMes(isGerente ? metaSedeSelect : userSede, nomAse, metaMesSelect)));
                                                    }}
                                                    className="p-3 rounded-2xl border border-slate-200 hover:border-[#59B447] bg-slate-50 cursor-pointer transition"
                                                >
                                                    <div className="text-xs font-black text-slate-800">👤 {nomAse}</div>
                                                    <div className="text-sm font-black text-[#59B447] mt-1">
                                                        {formatMoney(obtenerMetaAsesorPorMes(isGerente ? metaSedeSelect : userSede, nomAse, metaMesSelect))}
                                                    </div>
                                                    <div className="text-[10px] font-bold text-slate-400">Mes: {metaMesSelect}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL DEL PLAN DE PAGOS Y SIMULADOR (SOLO SE ABRE EN VISTA PREVIA DE CAJA O PARA ADMIN/GERENTE) */}
                    {itemDetalleModal && (
                        <ModalDetalleGrupoYSimulador
                            item={itemDetalleModal}
                            onClose={() => setItemDetalleModal(null)}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
