                    maxVal = 10000;
                    lista.forEach(it => {
                        maxVal = Math.max(maxVal, parseNum(it.actualMonto), mostrarDosSeries ? parseNum(it.anteriorMonto) : 0, parseNum(it.meta));
                    });
                    maxVal = Math.ceil(maxVal / 10000) * 10000;
                }

                const niveles = [0, 0.2, 0.4, 0.6, 0.8, 1].map(f => maxVal * f);

                return (
                    <div className="card-executive rounded-3xl p-4 overflow-hidden">
                        <div className="flex flex-wrap justify-between items-start gap-2 mb-3">
                            <div>
                                <h4 className="text-xs sm:text-sm font-extrabold text-slate-800 uppercase tracking-tight">{tituloCanvas}</h4>
                                <p className="text-[10px] font-semibold text-slate-400">
                                    Eje Vertical: {tipoUnidad === "PORCENTAJE" ? "% de Cumplimiento de Meta" : "Monto Desembolsado (S/.)"}
                                </p>
                            </div>
                            <div className="flex flex-wrap items-center gap-3 text-[11px] font-bold">
                                {!usarSerieAnteriorComoUnica && (
                                    <span className="inline-flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-sm bg-[#16bb67] inline-block shadow-sm"></span>
                                        <span>{labelActual}</span>
                                    </span>
                                )}
                                {(mostrarDosSeries || usarSerieAnteriorComoUnica) && (
                                    <span className="inline-flex items-center gap-1.5">
                                        <span className="w-3 h-3 rounded-sm bg-indigo-500 inline-block shadow-sm"></span>
                                        <span>{labelComparado}</span>
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="overflow-x-auto pb-2">
                            <div style={{ minWidth: `${Math.max(420, lista.length * 72)}px` }} className="relative pl-14 pr-3 pt-7 pb-9">
                                <div className="relative h-60 border-b-2 border-slate-600 flex items-end justify-around gap-2 px-2">
                                    {niveles.map((niv, idx) => {
                                        const bottomPct = (niv / maxVal) * 100;
                                        return (
                                            <div key={idx} style={{ bottom: `${bottomPct}%` }} className="absolute left-0 right-0 border-t border-dashed border-slate-200 pointer-events-none">
                                                <span className="absolute -left-14 -top-2 w-12 text-right text-[9.5px] font-extrabold text-slate-600">
                                                    {tipoUnidad === "PORCENTAJE" ? `${niv.toFixed(0)}%` : formatShortSoles(niv)}
                                                </span>
                                            </div>
                                        );
                                    })}

                                    {lista.map((it, idx) => {
                                        const vAct = tipoUnidad === "PORCENTAJE" ? parseNum(it.actualPct) : parseNum(it.actualMonto);
                                        const vAnt = tipoUnidad === "PORCENTAJE" ? parseNum(it.anteriorPct) : parseNum(it.anteriorMonto);
                                        const valorPrimario = usarSerieAnteriorComoUnica ? vAnt : vAct;
                                        const diff = vAct - vAnt;

                                        const hActPct = Math.min(100, Math.max(valorPrimario > 0 ? 3 : 1, (valorPrimario / maxVal) * 100));
                                        const hAntPct = Math.min(100, Math.max(vAnt > 0 ? 3 : 1, (vAnt / maxVal) * 100));

                                        return (
                                            <div
                                                key={idx}
                                                onClick={() => { if (onSelectConcepto && it.esAgencia) onSelectConcepto(it.concepto); }}
                                                className={`flex-1 min-w-[60px] max-w-[110px] h-full flex flex-col justify-end items-center relative z-10 px-0.5 ${onSelectConcepto && it.esAgencia ? "cursor-pointer group" : ""}`}
                                                title={onSelectConcepto && it.esAgencia ? `Haz clic para ver el detalle de asesores de la agencia ${it.concepto}` : it.concepto}
                                            >
                                                {mostrarDosSeries && (
                                                    <div className={`mb-1 px-1.5 py-0.5 rounded-full text-[8.5px] font-black leading-tight text-center truncate max-w-full ${diff > 0 ? "bg-emerald-100 text-emerald-800" : diff < 0 ? "bg-rose-100 text-rose-700" : "bg-slate-100 text-slate-500"}`}>
                                                        {diff > 0 ? `+${tipoUnidad === "PORCENTAJE" ? diff.toFixed(0) + "%" : formatShortSoles(diff)}` : diff < 0 ? `${tipoUnidad === "PORCENTAJE" ? diff.toFixed(0) + "%" : formatShortSoles(diff)}` : "0%"}
                                                    </div>
                                                )}

                                                {(!mostrarDosSeries || esSuperpuesto) ? (
                                                    <div className="w-full h-full flex items-end justify-center relative">
                                                        {mostrarDosSeries && esSuperpuesto && (
                                                            <div
                                                                style={{ height: `${hAntPct}%` }}
                                                                className="w-10/12 bg-indigo-500/30 border-2 border-dashed border-indigo-600 rounded-t-xl absolute bottom-0 transition-all duration-500"
                                                                title={`${labelComparado}: ${formatearEtiqueta(vAnt)}`}
                                                            ></div>
                                                        )}

                                                        <div
                                                            style={{ height: `${hActPct}%` }}
                                                            className={`${esSuperpuesto && mostrarDosSeries ? "w-6/12 z-10 shadow-md" : "w-8/12"} ${usarSerieAnteriorComoUnica ? "bg-gradient-to-t from-indigo-600 to-indigo-400" : "bg-gradient-to-t from-[#129e56] to-[#22d376] hover:from-[#0f8548] hover:to-[#16bb67]"} rounded-t-xl shadow-sm transition-all duration-500 relative flex justify-center`}
                                                        >
                                                            <span className={`text-[9.5px] font-black whitespace-nowrap ${hActPct > 82 ? "-top-4 text-[#129e56] absolute" : hActPct > 20 ? "mt-1.5 text-white drop-shadow" : "-top-4 text-[#129e56] absolute"}`}>
                                                                {formatearEtiqueta(valorPrimario)}
                                                            </span>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="w-full h-full flex items-end justify-center gap-1">
                                                        <div style={{ height: `${hActPct}%` }} className="w-5/12 bg-gradient-to-t from-[#129e56] to-[#22d376] rounded-t-lg transition-all duration-500 relative flex justify-center" title={`${labelActual}: ${formatearEtiqueta(vAct)}`}>
                                                            <span className="absolute -top-3.5 text-[8.5px] font-black text-emerald-800 whitespace-nowrap">{formatearEtiqueta(vAct)}</span>
                                                        </div>
                                                        <div style={{ height: `${hAntPct}%` }} className="w-5/12 bg-gradient-to-t from-indigo-600 to-indigo-400 rounded-t-lg transition-all duration-500 relative flex justify-center" title={`${labelComparado}: ${formatearEtiqueta(vAnt)}`}>
                                                            <span className="absolute -top-3.5 text-[8.5px] font-bold text-indigo-700 whitespace-nowrap">{formatearEtiqueta(vAnt)}</span>
                                                        </div>
                                                    </div>
                                                )}

                                                <div className="absolute -bottom-6 text-[10px] font-black text-slate-800 group-hover:text-[#59B447] uppercase tracking-tight text-center truncate w-full px-0.5">
                                                    {it.esAgencia ? `📍 ${it.concepto}` : it.concepto}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="text-center text-[10px] font-black text-slate-500 uppercase mt-6">
                                    {etiquetaEjeX}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            if (mostrarComparativa && modoVisual === "LADO_A_LADO") {
                return (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {renderizarCanvasColumnas(items, `${titulo} (${labelActual})`, false, false, false)}
                        {renderizarCanvasColumnas(items, `${titulo} (${labelComparado})`, false, false, true)}
                    </div>
                );
            }

            return renderizarCanvasColumnas(items, titulo, mostrarComparativa, modoVisual === "SUPERPUESTO", false);
        }// ============================================================================
        // 6B. PANEL EJECUTIVO DE ESTADÍSTICAS (ESTILO BUSINESS INTELLIGENCE CREDIBAN)
        // ============================================================================
        function PanelGraficosEstadisticos({
            movimientos, expedientesCaja, sedesCatalogo, asesoresOficialesVista,
            obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes,
            isGerente, isJefeZonal, isAdmin, isLiderEquipo, isJefeGrupal,
            userSede, sedesPermitidasUsuario, selectedSedeVista, setSelectedSedeVista, filtroMes,
            filtroEquipo, setFiltroEquipo, filtroJefeAsignado, setFiltroJefeAsignado,
            filtroArea, setFiltroArea, listaJefesAsignados
        }) {
            const mesActualBase = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;
            const [activarComparativa, setActivarComparativa] = React.useState(true);
            const [mesComparar, setMesComparar] = React.useState(() => obtenerMesAnterior(mesActualBase));
            const [modoComparacionVisual, setModoComparacionVisual] = React.useState("MISMO_GRAFICO");
            const [agrupacionTiempo, setAgrupacionTiempo] = React.useState("DIAS");
            const [unidadColumnas, setUnidadColumnas] = React.useState("PORCENTAJE");
            const [incluirColaCaja, setIncluirColaCaja] = React.useState(false);
            const [diaInspeccion, setDiaInspeccion] = React.useState("TODOS");

            // Estado para abrir/cerrar el desglosable de días hábiles al tocar PROMEDIO DÍA HÁBIL o META DIARIA H. MES
            const [mostrarDesgloseDias, setMostrarDesgloseDias] = React.useState(false);

            // Configuración persistente de días hábiles por mes (Calendario Lunes a Sábado sin Domingos ni Feriados)
            const [configDiasPorMes, setConfigDiasPorMes] = React.useState(() => {
                try {
                    const saved = localStorage.getItem("crediban_config_dias_habiles");
                    return saved ? JSON.parse(saved) : {};
                } catch (e) { return {}; }
            });

            React.useEffect(() => {
                if (filtroMes !== "TODOS") {
                    setMesComparar(obtenerMesAnterior(filtroMes));
                }
            }, [filtroMes]);

            const fuenteMovs = React.useMemo(() => {
                return incluirColaCaja ? [...movimientos, ...expedientesCaja] : movimientos;
            }, [movimientos, expedientesCaja, incluirColaCaja]);

            const nombresCortosPermitidos = React.useMemo(() => {
                return new Set(asesoresOficialesVista.map(a => a.nombreCorto));
            }, [asesoresOficialesVista]);

            const movsJerarquia = React.useMemo(() => {
                return fuenteMovs.filter(m => {
                    if (isGerente) {
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else if (isJefeZonal) {
                        if (!sedesPermitidasUsuario.includes("TODAS") && !sedesPermitidasUsuario.includes(m.sede)) return false;
                        if (selectedSedeVista !== "TODAS" && m.sede !== selectedSedeVista) return false;
                    } else {
                        if (m.sede !== userSede) return false;
                    }
                    if (!nombresCortosPermitidos.has(m.asesor)) return false;
                    return true;
                });
            }, [fuenteMovs, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, nombresCortosPermitidos]);

            const ultimoDiaConOperacionesMes = React.useMemo(() => {
                const delMes = movsJerarquia.filter(m => m.mesRegistro === mesActualBase);
                if (delMes.length === 0) return null;
                return Math.max(...delMes.map(m => Number(m.diaSistema) || 1));
            }, [movsJerarquia, mesActualBase]);

            const configMesActual = configDiasPorMes[mesActualBase] || { overridesDias: {}, manualMeta: "", manualAvance: "" };

            const infoHabilesDetallada = React.useMemo(() => {
                return calcularDetalleDiasHabilesMes(
                    mesActualBase,
                    configMesActual.overridesDias || {},
                    ultimoDiaConOperacionesMes
                );
            }, [mesActualBase, configMesActual.overridesDias, ultimoDiaConOperacionesMes]);

            const diasConsideradosMetaMes = parseNum(configMesActual.manualMeta) > 0
                ? parseNum(configMesActual.manualMeta)
                : infoHabilesDetallada.totalHabilesMes;

            const diasConsideradosAvance = parseNum(configMesActual.manualAvance) > 0
                ? parseNum(configMesActual.manualAvance)
                : infoHabilesDetallada.totalHabilesMes;

            const handleToggleDiaHabilCalendario = (diaNum, estadoActualEfectivo) => {
                const actualMes = configDiasPorMes[mesActualBase] || { overridesDias: {}, manualMeta: "", manualAvance: "" };
                const nuevosOverrides = { ...(actualMes.overridesDias || {}), [diaNum]: !estadoActualEfectivo };
                const nuevoGlobal = {
                    ...configDiasPorMes,
                    [mesActualBase]: { ...actualMes, overridesDias: nuevosOverrides }
                };
                setConfigDiasPorMes(nuevoGlobal);
                localStorage.setItem("crediban_config_dias_habiles", JSON.stringify(nuevoGlobal));
            };

            const handleCambiarDiasManual = (campo, valor) => {
                const actualMes = configDiasPorMes[mesActualBase] || { overridesDias: {}, manualMeta: "", manualAvance: "" };
                const nuevoGlobal = {
                    ...configDiasPorMes,
                    [mesActualBase]: { ...actualMes, [campo]: valor }
                };
                setConfigDiasPorMes(nuevoGlobal);
                localStorage.setItem("crediban_config_dias_habiles", JSON.stringify(nuevoGlobal));
            };

            const handleRestaurarDiasAutomaticos = () => {
                const copia = { ...configDiasPorMes };
                delete copia[mesActualBase];
                setConfigDiasPorMes(copia);
                localStorage.setItem("crediban_config_dias_habiles", JSON.stringify(copia));
            };

            const datosAgenciaSuperior = React.useMemo(() => {
                const movsAct = movsJerarquia.filter(m => m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion)));
                const movsAnt = movsJerarquia.filter(m => m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion)));

                const movsActMesCompleto = movsJerarquia.filter(m => m.mesRegistro === mesActualBase);
                const movsAntMesCompleto = movsJerarquia.filter(m => m.mesRegistro === mesComparar);

                const haySubfiltroEquipoOJefe = filtroEquipo !== "TODOS" || filtroJefeAsignado !== "TODOS" || filtroArea !== "TODAS";
                let metaTotalVista = 0;

                if (haySubfiltroEquipoOJefe) {
                    metaTotalVista = asesoresOficialesVista.reduce((acc, a) => acc + obtenerMetaAsesorPorMes(a.sedePrincipal, a.nombreCorto, mesActualBase), 0);
                } else {
                    const sedesCalculo = sedesCatalogo.filter(s => {
                        if (isGerente) return selectedSedeVista === "TODAS" || s.nombre === selectedSedeVista;
                        if (isJefeZonal) return (sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre)) && (selectedSedeVista === "TODAS" || s.nombre === selectedSedeVista);
                        return s.nombre === userSede;
                    });
                    metaTotalVista = sedesCalculo.reduce((acc, s) => acc + obtenerMetaOficinaPorMes(s.nombre, mesActualBase), 0);
                }
                if (metaTotalVista <= 0) metaTotalVista = 300000;

                const avanceTotalSoles = movsAct.reduce((acc, m) => acc + parseNum(m.monto), 0);
                const avanceAnteriorSoles = movsAnt.reduce((acc, m) => acc + parseNum(m.monto), 0);
                const pctAvance = metaTotalVista > 0 ? (avanceTotalSoles / metaTotalVista) * 100 : 0;

                const porDiaHabil = Math.round(avanceTotalSoles / Math.max(1, diasConsideradosAvance));
                const porDiaHMesMeta = Math.round(metaTotalVista / Math.max(1, diasConsideradosMetaMes));

                let serieActual = [];
                let serieComparada = [];

                if (agrupacionTiempo === "SEMANAS") {
                    const semRangos = [
                        { label: "Sem 1 (1-7)", tick: "Sem 1", min: 1, max: 7 },
                        { label: "Sem 2 (8-14)", tick: "Sem 2", min: 8, max: 14 },
                        { label: "Sem 3 (15-21)", tick: "Sem 3", min: 15, max: 21 },
                        { label: "Sem 4 (22-28)", tick: "Sem 4", min: 22, max: 28 },
                        { label: "Sem 5 (29-31)", tick: "Sem 5", min: 29, max: 31 }
                    ];
                    serieActual = semRangos.map(r => ({
                        etiqueta: `${r.label} (${mesActualBase})`,
                        tickLabel: r.tick,
                        valor: movsActMesCompleto.filter(m => Number(m.diaSistema) >= r.min && Number(m.diaSistema) <= r.max).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                    serieComparada = semRangos.map(r => ({
                        etiqueta: `${r.label} (${mesComparar})`,
                        tickLabel: r.tick,
                        valor: movsAntMesCompleto.filter(m => Number(m.diaSistema) >= r.min && Number(m.diaSistema) <= r.max).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                } else if (agrupacionTiempo === "MESES") {
                    serieActual = MESES_ANIO.map((mNom) => ({
                        etiqueta: mNom,
                        tickLabel: mNom.slice(0, 3),
                        valor: movsJerarquia.filter(x => x.mesRegistro === mNom).reduce((a, b) => a + parseNum(b.monto), 0)
                    }));
                    serieComparada = MESES_ANIO.map((mNom) => {
                        const mPrev = obtenerMesAnterior(mNom);
                        return {
                            etiqueta: mPrev,
                            tickLabel: mNom.slice(0, 3),
                            valor: movsJerarquia.filter(x => x.mesRegistro === mPrev).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                } else {
                    serieActual = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesActualBase})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsActMesCompleto.filter(m => Number(m.diaSistema) === d).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                    serieComparada = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesComparar})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAntMesCompleto.filter(m => Number(m.diaSistema) === d).reduce((a, b) => a + parseNum(b.monto), 0)
                        };
                    });
                }

                return {
                    metaTotalVista, avanceTotalSoles, avanceAnteriorSoles,
                    pctAvance, porDiaHabil, porDiaHMesMeta,
                    serieActual, serieComparada
                };
            }, [movsJerarquia, mesActualBase, mesComparar, diaInspeccion, agrupacionTiempo, filtroEquipo, filtroJefeAsignado, filtroArea, asesoresOficialesVista, sedesCatalogo, isGerente, isJefeZonal, selectedSedeVista, sedesPermitidasUsuario, userSede, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes, diasConsideradosAvance, diasConsideradosMetaMes]);

            const mostrarColumnasPorAgencia = (isGerente || isJefeZonal) && selectedSedeVista === "TODAS" && filtroEquipo === "TODOS" && filtroJefeAsignado === "TODOS" && filtroArea === "TODAS";

            const itemsColumnasConcepto = React.useMemo(() => {
                if (mostrarColumnasPorAgencia || (agrupacionTiempo === "SEDES" && (isGerente || isJefeZonal))) {
                    return sedesCatalogo
                        .filter(s => isGerente || sedesPermitidasUsuario.includes("TODAS") || sedesPermitidasUsuario.includes(s.nombre))
                        .map(s => {
                            const metaAct = obtenerMetaOficinaPorMes(s.nombre, mesActualBase);
                            const metaAnt = obtenerMetaOficinaPorMes(s.nombre, mesComparar);
                            const mAct = fuenteMovs.filter(m => m.sede === s.nombre && m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((a, b) => a + parseNum(b.monto), 0);
                            const mAnt = fuenteMovs.filter(m => m.sede === s.nombre && m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((a, b) => a + parseNum(b.monto), 0);
                            return {
                                concepto: s.nombre,
                                esAgencia: true,
                                actualMonto: mAct,
                                anteriorMonto: mAnt,
                                meta: metaAct,
                                actualPct: metaAct > 0 ? (mAct / metaAct) * 100 : 0,
                                anteriorPct: metaAnt > 0 ? (mAnt / metaAnt) * 100 : 0
                            };
                        });
                }

                return asesoresOficialesVista.map(a => {
                    const metaAct = obtenerMetaAsesorPorMes(a.sedePrincipal, a.nombreCorto, mesActualBase);
                    const metaAnt = obtenerMetaAsesorPorMes(a.sedePrincipal, a.nombreCorto, mesComparar);
                    const mAct = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesActualBase && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((s, x) => s + parseNum(x.monto), 0);
                    const mAnt = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesComparar && (diaInspeccion === "TODOS" || Number(m.diaSistema) === Number(diaInspeccion))).reduce((s, x) => s + parseNum(x.monto), 0);

                    return {
                        concepto: a.nombreCorto,
                        esAgencia: false,
                        actualMonto: mAct,
                        anteriorMonto: mAnt,
                        meta: metaAct,
                        actualPct: metaAct > 0 ? (mAct / metaAct) * 100 : 0,
                        anteriorPct: metaAnt > 0 ? (mAnt / metaAnt) * 100 : 0
                    };
                });
            }, [mostrarColumnasPorAgencia, agrupacionTiempo, isGerente, isJefeZonal, sedesCatalogo, sedesPermitidasUsuario, asesoresOficialesVista, fuenteMovs, movsJerarquia, mesActualBase, mesComparar, diaInspeccion, obtenerMetaOficinaPorMes, obtenerMetaAsesorPorMes]);

            const graficosDiariosPorAsesor = React.useMemo(() => {
                return asesoresOficialesVista.map(a => {
                    const movsAseAct = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesActualBase);
                    const movsAseAnt = movsJerarquia.filter(m => m.sede === a.sedePrincipal && m.asesor === a.nombreCorto && m.mesRegistro === mesComparar);

                    const serieAct = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesActualBase})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAseAct.filter(m => Number(m.diaSistema) === d).reduce((s, x) => s + parseNum(x.monto), 0)
                        };
                    });

                    const serieAnt = Array.from({ length: 31 }, (_, i) => {
                        const d = i + 1;
                        return {
                            etiqueta: `Día ${d} (${mesComparar})`,
                            tickLabel: d % 5 === 0 ? String(d) : "",
                            valor: movsAseAnt.filter(m => Number(m.diaSistema) === d).reduce((s, x) => s + parseNum(x.monto), 0)
                        };
                    });

                    const totalAct = diaInspeccion === "TODOS"
                        ? serieAct.reduce((s, x) => s + x.valor, 0)
                        : (serieAct[Number(diaInspeccion) - 1]?.valor || 0);
                    const totalAnt = diaInspeccion === "TODOS"
                        ? serieAnt.reduce((s, x) => s + x.valor, 0)
                        : (serieAnt[Number(diaInspeccion) - 1]?.valor || 0);

                    return {
                        key: `${a.sedePrincipal}__${a.nombreCorto}`,
                        asesor: a.nombreCorto,
                        usuarioCompleto: a.usuarioOriginal,
                        sede: a.sedePrincipal,
                        area: a.area,
                        equipo: a.equipo,
                        jefeAsignado: a.jefeAsignado,
                        totalAct, totalAnt, serieAct, serieAnt
                    };
                });
            }, [asesoresOficialesVista, movsJerarquia, mesActualBase, mesComparar, diaInspeccion]);

            return (
                <div className="space-y-6 excel-grid-bg p-3 sm:p-5 rounded-3xl border border-slate-200/90 animate-fade-in">
                    {/* BARRA DE CONTROLES EJECUTIVOS */}
                    <div className="card-executive p-4 sm:p-5 rounded-3xl border-t-4 border-t-[#59B447] space-y-3.5">
                        <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
                            <div>
                                <div className="flex flex-wrap items-center gap-2">
                                    <span className="crediban-header-gradient text-white text-[10px] font-black px-3 py-0.5 rounded-full uppercase tracking-wider shadow-sm">
                                        📈 Centro de Inteligencia Comercial CREDIBAN
                                    </span>
                                    <span className="bg-emerald-50 text-emerald-900 border border-emerald-200 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">
                                        Asesores Habilitados: {asesoresOficialesVista.length}
                                    </span>
                                </div>
                                <h2 className="text-sm sm:text-base font-extrabold text-slate-900 mt-1">
                                    Análisis de Colocaciones por Día, Cumplimiento de Metas por Agencia/Asesor y Ritmo Diario
                                </h2>
                            </div>

                            <div className="flex flex-wrap items-center gap-2">
                                <label className="flex items-center gap-1.5 bg-indigo-50/90 hover:bg-indigo-100/80 border border-indigo-200 px-3 py-1.5 rounded-xl cursor-pointer transition">
                                    <input type="checkbox" checked={activarComparativa} onChange={e => setActivarComparativa(e.target.checked)} className="w-4 h-4 accent-indigo-600" />
                                    <span className="text-xs font-black text-indigo-950">🔄 Comparar vs {mesComparar}</span>

                                labelComparado={diaInspeccion === "TODOS" ? mesComparar : `Día ${diaInspeccion} (${mesComparar})`}
                                tipoUnidad={unidadColumnas}
                                onSelectConcepto={(sedeClick) => {
                                    if (setSelectedSedeVista && mostrarColumnasPorAgencia) {
                                        setSelectedSedeVista(sedeClick);
                                    }
                                }}
                            />
                        </div>
                    </div>

                    {/* BLOQUE 2: CUADRÍCULA DE GRÁFICOS LINEALES DIARIOS POR ASESOR OFICIAL */}
                    <div className="space-y-3.5 pt-2">
                        <div className="crediban-header-gradient text-white px-5 py-3.5 rounded-3xl flex flex-wrap justify-between items-center gap-2 shadow-md">
                            <div>
                                <h3 className="text-xs sm:text-sm font-black uppercase tracking-wider">
                                    📊 Ritmo Diario por Asesor Oficial ({mesActualBase}) — Nombres Cortos (NOMBRE.A)
                                </h3>
                                <p className="text-[11px] text-emerald-200 font-semibold">
                                    Sincronizado directamente con el Servidor de Usuarios (Sede, Área, Equipo y Jefe Asignado)
                                </p>
                            </div>
                            <span className="bg-white/15 px-3.5 py-1 rounded-full text-xs font-extrabold">
                                Mostrando {graficosDiariosPorAsesor.length} asesores
                            </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {graficosDiariosPorAsesor.map((itemAse) => {
                                const diffAse = itemAse.totalAct - itemAse.totalAnt;
                                return (
                                    <div key={itemAse.key} className="space-y-1.5">
                                        <div className="flex flex-wrap justify-between items-center px-2 text-xs font-black text-slate-700 gap-1">
                                            <div className="flex flex-wrap items-center gap-1.5">
                                                <span className="text-slate-900">👤 {itemAse.asesor}</span>
                                                <span className="text-[10px] bg-emerald-100 text-emerald-900 px-2 py-0.2 rounded-full">📍 {itemAse.sede}</span>
                                                {itemAse.equipo !== "SIN EQUIPO" && (
                                                    <span className="text-[10px] bg-purple-100 text-purple-900 px-2 py-0.2 rounded-full">{itemAse.equipo}</span>
                                                )}
                                                {itemAse.jefeAsignado && (
                                                    <span className="text-[10px] bg-amber-100 text-amber-900 px-2 py-0.2 rounded-full">👔 {itemAse.jefeAsignado}</span>
                                                )}
                                            </div>
                                            <div className="flex items-center gap-1.5">
                                                <span className="text-blue-700">{formatShortSoles(itemAse.totalAct)}</span>
                                                {activarComparativa && (
                                                    <>
                                                        <span className="text-amber-700">vs {formatShortSoles(itemAse.totalAnt)}</span>
                                                        <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${diffAse >= 0 ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-700"}`}>
                                                            {diffAse >= 0 ? "▲+" : "▼"}{formatShortSoles(diffAse)}
                                                        </span>
                                                    </>
                                                )}
                                            </div>
                                        </div>

                                        {activarComparativa && modoComparacionVisual === "LADO_A_LADO" ? (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                <LienzoSVGLineal
                                                    titulo={`${itemAse.asesor} frente a DIA (${mesActualBase})`}
                                                    subtitulo={itemAse.area}
                                                    etiquetaEjeY={itemAse.asesor}
                                                    serieActual={itemAse.serieAct}
                                                    mostrarComparativa={false}
                                                    colorPrincipal="#2563eb"
                                                    altura={195}
                                                    diaSeleccionado={diaInspeccion !== "TODOS" ? diaInspeccion : null}
                                                    onSelectDia={(d) => { setDiaInspeccion(d); setUnidadColumnas("SOLES"); }}
                                                />
                                                <LienzoSVGLineal
                                                    titulo={`${itemAse.asesor} frente a DIA (${mesComparar})`}
                                                    subtitulo={itemAse.area}
                                                    etiquetaEjeY={itemAse.asesor}
                                                    serieActual={itemAse.serieAnt}
                                                    mostrarComparativa={false}
                                                    colorPrincipal="#f59e0b"
                                                    altura={195}
                                                    diaSeleccionado={diaInspeccion !== "TODOS" ? diaInspeccion : null}
                                                />
                                            </div>
                                        ) : (
                                            <LienzoSVGLineal
                                                titulo={`${itemAse.asesor} frente a DIA`}
                                                subtitulo={`${itemAse.usuarioCompleto} • ${itemAse.area}`}
                                                etiquetaEjeY={itemAse.asesor}
                                                serieActual={itemAse.serieAct}
                                                serieComparada={itemAse.serieAnt}
                                                mostrarComparativa={activarComparativa}
                                                modoSuperpuesto={modoComparacionVisual === "SUPERPUESTO"}
                                                colorPrincipal="#2563eb"
                                                colorComparado="#f59e0b"
                                                altura={210}
                                                diaSeleccionado={diaInspeccion !== "TODOS" ? diaInspeccion : null}
                                                onSelectDia={(d) => { setDiaInspeccion(d); setUnidadColumnas("SOLES"); }}
                                            />
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================================
        // 6C. MÓDULO DE REPORTE DIARIO, MATRIZ SEMANAL Y GENERADOR AMABLE PARA WHATSAPP
        // ============================================================================
        function ModuloReporteDiarioYWhatsApp({
            movimientos, expedientesCaja, tablaAsesores,
            filtroMes, sedeMostrarTitulo, filtroEquipo, filtroJefeAsignado, onVerPlan
        }) {
            const mesActivo = filtroMes === "TODOS" ? MESES_ANIO[new Date().getMonth()] : filtroMes;

            const ultimoDiaConActividad = React.useMemo(() => {
                const todos = [...movimientos, ...expedientesCaja].filter(m => m.mesRegistro === mesActivo);
                if (todos.length === 0) return new Date().getDate();
                return Math.max(...todos.map(m => Number(m.diaSistema) || 1));
            }, [movimientos, expedientesCaja, mesActivo]);

            const [diaCorteReporte, setDiaCorteReporte] = React.useState(() => ultimoDiaConActividad);
            const [cantidadDiasMatriz, setCantidadDiasMatriz] = React.useState(3);
            const [tipoMensajeWA, setTipoMensajeWA] = React.useState("DIARIO_Y_SEMANAL");
            const [copiadoExito, setCopiadoExito] = React.useState(false);

            React.useEffect(() => {
                setDiaCorteReporte(ultimoDiaConActividad);
            }, [ultimoDiaConActividad, mesActivo]);

            const datosCuadroDelDia = React.useMemo(() => {
                const desembolsadosHoy = movimientos
                    .filter(m => m.mesRegistro === mesActivo && Number(m.diaSistema) === Number(diaCorteReporte))
                    .map(m => ({ ...m, condicionReporte: "DESEMBOLSADO" }));

                const pendientesHoy = expedientesCaja
                    .filter(m => m.mesRegistro === mesActivo && Number(m.diaSistema) === Number(diaCorteReporte))
                    .map(m => {
                        const et = m.etapaPipeline || obtenerEtapaPipeline(m);
                        return {
                            ...m,
                            condicionReporte: et === "POR_PRESENTAR" ? "POR PRESENTAR" : et === "POR_APROBAR" ? "POR APROBAR" : "EN CAJA (POR DESEMB.)"
                        };
                    });

                const todosHoy = [...desembolsadosHoy, ...pendientesHoy];

                const mapaPorAsesor = {};
                todosHoy.forEach(op => {
                    const ase = op.asesor || "SIN ASESOR";
                    if (!mapaPorAsesor[ase]) mapaPorAsesor[ase] = [];
                    mapaPorAsesor[ase].push(op);
                });

                const filas = [];
                let sumaDesembolsado = 0;
                let sumaPorDesembolsar = 0;
                let sumaGeneral = 0;

                Object.keys(mapaPorAsesor).forEach(ase => {
                    const ops = mapaPorAsesor[ase];
                    ops.forEach((op, idx) => {
                        const montoOp = parseNum(op.monto);
                        if (op.condicionReporte === "DESEMBOLSADO") sumaDesembolsado += montoOp;
                        else sumaPorDesembolsar += montoOp;
                        sumaGeneral += montoOp;

                        filas.push({
                            asesor: ase,
                            nroOperacionAsesor: idx + 1,
                            cliente: limpiarNombreExpediente(op.cliente),
                            modalidad: op.modalidad || "INDIVIDUAL",
                            integrantes: Array.isArray(op.integrantes) ? op.integrantes : [],
                            monto: montoOp,
                            condicion: op.condicionReporte,
                            raw: op
                        });
                    });
                });

                return { filas, sumaDesembolsado, sumaPorDesembolsar, sumaGeneral, totalOperaciones: filas.length };
            }, [movimientos, expedientesCaja, mesActivo, diaCorteReporte]);

            const diasRangoMatriz = React.useMemo(() => {
                const fin = Math.max(1, Math.min(31, Number(diaCorteReporte) || 1));
                const inicio = Math.max(1, fin - cantidadDiasMatriz + 1);
                const lista = [];
                for (let d = inicio; d <= fin; d++) {
                    lista.push({ dia: d, tituloColumna: obtenerNombreDiaSemana(mesActivo, d) });
                }
                return lista;
            }, [diaCorteReporte, cantidadDiasMatriz, mesActivo]);

            const matrizSeguimientoAsesores = React.useMemo(() => {
                const filasAsesores = tablaAsesores.map(a => {
                    let opsSemana = 0;
                    let montoSemana = 0;
                    let diasConsecutivosSinDesembolsar = 0;

                    const porDia = diasRangoMatriz.map(dObj => {
                        const movsDia = movimientos.filter(
                            m => m.sede === a.sede && m.asesor === a.asesor && m.mesRegistro === mesActivo && Number(m.diaSistema) === dObj.dia
                        );
                        const cant = movsDia.length;
                        const mto = movsDia.reduce((s, x) => s + parseNum(x.monto), 0);
                        opsSemana += cant;
                        montoSemana += mto;

                        if (cant === 0) diasConsecutivosSinDesembolsar++;
                        else diasConsecutivosSinDesembolsar = 0;

                        return { dia: dObj.dia, operaciones: cant, monto: mto };
                    });

                    return {
                        key: a.key, asesor: a.asesor, usuarioCompleto: a.usuarioCompleto,
                        sede: a.sede, area: a.area, equipo: a.equipo, jefeAsignado: a.jefeAsignado,
                        metaMes: a.meta, avanceMes: a.desembolsado, avancePctMes: a.avancePct,
                        porDia, opsSemana, montoSemana, diasConsecutivosSinDesembolsar
                    };
                });

                const totalesPorDia = diasRangoMatriz.map(dObj => {
                    let totOps = 0, totMonto = 0;
                    filasAsesores.forEach(f => {
                        const celda = f.porDia.find(p => p.dia === dObj.dia);
                        if (celda) { totOps += celda.operaciones; totMonto += celda.monto; }
                    });
                    return { dia: dObj.dia, totOps, totMonto };
                });

                const granTotalOpsSemana = totalesPorDia.reduce((s, x) => s + x.totOps, 0);
                const granTotalMontoSemana = totalesPorDia.reduce((s, x) => s + x.totMonto, 0);

                return { filasAsesores, totalesPorDia, granTotalOpsSemana, granTotalMontoSemana };
            }, [tablaAsesores, movimientos, diasRangoMatriz, mesActivo]);

            const textoWhatsAppGenerado = React.useMemo(() => {
                const fechaTitulo = obtenerNombreDiaSemana(mesActivo, diaCorteReporte);
                const subFiltro = filtroJefeAsignado !== "TODOS"
                    ? ` — *Jefe de Equipo: ${filtroJefeAsignado}*`
                    : filtroEquipo !== "TODOS"
                        ? ` — *${filtroEquipo}*`
                        : "";
                const lineas = [];

                lineas.push(`🌟 *CREDIBAN PERÚ — REPORTE EJECUTIVO DE COLOCACIONES* 🍀`);
                lineas.push(`📍 *Agencia / Vista:* ${sedeMostrarTitulo}${subFiltro}`);
                lineas.push(`📅 *Fecha de Corte:* ${fechaTitulo} (${mesActivo})`);
                lineas.push(`━━━━━━━━━━━━━━━━━━━━━━`);

                if (tipoMensajeWA !== "CIERRE_FIN_SEMANA") {
                    lineas.push(`💸 *1. AVANCE DE DESEMBOLSOS DEL DÍA (${fechaTitulo}):*`);
                    if (datosCuadroDelDia.filas.length === 0) {
                        lineas.push(`• Aún no se registran desembolsos cerrados en el corte del día.`);
                    } else {
                        const resumenHoyAse = {};
                        datosCuadroDelDia.filas.forEach(f => {
                            if (!resumenHoyAse[f.asesor]) resumenHoyAse[f.asesor] = { ops: 0, desembolsado: 0, enPipeline: 0, clientes: [] };
                            resumenHoyAse[f.asesor].ops += 1;
                            if (f.condicion === "DESEMBOLSADO") resumenHoyAse[f.asesor].desembolsado += f.monto;
                            else resumenHoyAse[f.asesor].enPipeline += f.monto;
                            resumenHoyAse[f.asesor].clientes.push(`${f.cliente} (${formatShortSoles(f.monto)} - ${f.condicion})`);
                        });

                        Object.keys(resumenHoyAse).forEach(ase => {
                            const info = resumenHoyAse[ase];
                            lineas.push(`✅ *${ase}:* ${info.ops} op. | Desembolsado: *${formatMoney(info.desembolsado)}*${info.enPipeline > 0 ? ` | ⏳ En Cola/Eval.: *${formatMoney(info.enPipeline)}*` : ""}`);
                            lineas.push(`   ↳ _Detalle:_ ${info.clientes.join(", ")}`);
                        });
                    }
                    lineas.push(``);
                    lineas.push(`💰 *Total Desembolsado Hoy:* ${formatMoney(datosCuadroDelDia.sumaDesembolsado)}`);
                    if (datosCuadroDelDia.sumaPorDesembolsar > 0) {
                        lineas.push(`⏳ *En Caja / Por Aprobar / Por Presentar Hoy:* ${formatMoney(datosCuadroDelDia.sumaPorDesembolsar)}`);
                        lineas.push(`🚀 *Proyectado Total del Día:* ${formatMoney(datosCuadroDelDia.sumaGeneral)}`);
                    }
                    lineas.push(`━━━━━━━━━━━━━━━━━━━━━━`);
                }

                if (tipoMensajeWA === "DIARIO_Y_SEMANAL" || tipoMensajeWA === "CIERRE_FIN_SEMANA") {
                    const rangoTexto = diasRangoMatriz.length > 0
                        ? `del ${diasRangoMatriz[0].tituloColumna} al ${diasRangoMatriz[diasRangoMatriz.length - 1].tituloColumna}`
                        : "";
                    lineas.push(`📊 *2. RESUMEN ACUMULADO DEL PERIODO (${rangoTexto}):*`);

                    matrizSeguimientoAsesores.filasAsesores.forEach(f => {
                        const icono = f.montoSemana >= 10000 ? "🏆" : f.opsSemana > 0 ? "👏" : "💪";
                        lineas.push(`${icono} *${f.asesor} (${f.sede}):* ${f.opsSemana} op. en el tramo (*${formatMoney(f.montoSemana)}*) | Avance Mes: *${f.avancePctMes.toFixed(1)}%*`);
                    });
                    lineas.push(``);
                    lineas.push(`📈 *Total Acumulado del Tramo:* ${matrizSeguimientoAsesores.granTotalOpsSemana} operaciones por *${formatMoney(matrizSeguimientoAsesores.granTotalMontoSemana)}*`);
                    lineas.push(`━━━━━━━━━━━━━━━━━━━━━━`);
                }

                const destacados = matrizSeguimientoAsesores.filasAsesores.filter(f => f.opsSemana > 0).sort((a, b) => b.montoSemana - a.montoSemana);
                const sinDesembolsosRecientes = matrizSeguimientoAsesores.filasAsesores.filter(f => f.diasConsecutivosSinDesembolsar >= 2);

                lineas.push(`✨ *ANÁLISIS Y MENSAJE PARA EL EQUIPO:*`);
                if (destacados.length > 0) {
                    const nombresTop = destacados.slice(0, 3).map(d => `*${d.asesor}* (${formatShortSoles(d.montoSemana)})`).join(", ");
                    lineas.push(`🎉 ¡Muchas felicidades a ${nombresTop} por el excelente ritmo y compromiso demostrados! Sigamos sumando con esa misma energía. 🚀`);
                }

                if (sinDesembolsosRecientes.length > 0) {
                    const nombresAnimar = sinDesembolsosRecientes.map(s => `*${s.asesor}*`).join(", ");
                    lineas.push(``);
                    lineas.push(`🤝 Un saludo especial y todo nuestro respaldo para ${nombresAnimar}: sabemos del esfuerzo que vienen realizando en campo; revisemos juntos sus propuestas por presentar y por aprobar con su Jefe de Equipo para destrabarlas y lograr que mañana mismo salgan sus desembolsos. ¡Confiamos plenamente en su capacidad para revertir el marcador! 💪😊🍀`);
                } else {
                    lineas.push(`🤝 ¡Excelente trabajo en equipo! Sigamos enfocados en nuestras metas diarias, empezando a construir sueños juntos. 😊🍀`);
                }

                return lineas.join("\n");
            }, [mesActivo, diaCorteReporte, filtroEquipo, filtroJefeAsignado, sedeMostrarTitulo, tipoMensajeWA, datosCuadroDelDia, diasRangoMatriz, matrizSeguimientoAsesores]);

            const [textoEditableWA, setTextoEditableWA] = React.useState(textoWhatsAppGenerado);
            React.useEffect(() => {
                setTextoEditableWA(textoWhatsAppGenerado);
            }, [textoWhatsAppGenerado]);

            const copiarAlPortapapeles = () => {
                navigator.clipboard.writeText(textoEditableWA).then(() => {
                    setCopiadoExito(true);
                    setTimeout(() => setCopiadoExito(false), 3000);
                });
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="card-executive p-4 sm:p-5 rounded-3xl border-t-4 border-t-[#59B447] flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <span className="crediban-btn-primary text-white text-[10px] font-black px-3 py-0.5 rounded-full uppercase tracking-wider">
                                📲 Generador Ejecutivo de Cuadros Diarios, Semanales y WhatsApp
                            </span>
                            <h2 className="text-sm sm:text-base font-extrabold text-slate-900 mt-1">
                                Reporte Diario de Créditos Aprobados/Desembolsados y Matriz de Seguimiento por Asesor (NOMBRE.A)
                            </h2>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <div className="bg-slate-50 px-3.5 py-2 rounded-2xl border border-slate-200">
                                <label className="text-[10px] font-extrabold text-slate-500 uppercase block">📅 Día de Corte:</label>
                                <select value={diaCorteReporte} onChange={e => setDiaCorteReporte(Number(e.target.value))} className="font-black text-xs bg-transparent text-slate-900 outline-none">
                                    {Array.from({ length: 31 }, (_, i) => i + 1).map(d => (
                                        <option key={d} value={d}>{obtenerNombreDiaSemana(mesActivo, d)}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="bg-slate-50 px-3.5 py-2 rounded-2xl border border-slate-200">
                                <label className="text-[10px] font-extrabold text-slate-500 uppercase block">📆 Rango Matriz Seguimiento:</label>
                                <select value={cantidadDiasMatriz} onChange={e => setCantidadDiasMatriz(Number(e.target.value))} className="font-black text-xs bg-transparent text-slate-900 outline-none">
                                    <option value={3}>Últimos 3 Días (Ej: Lun, Mar, Mié)</option>
                                    <option value={4}>Últimos 4 Días</option>
                                    <option value={6}>Semana Completa (6 Días)</option>
                                    <option value={7}>7 Días Calendario</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <div className="lg:col-span-7 space-y-6">
                            {/* CUADRO EJECUTIVO 1 */}
                            <div className="card-executive rounded-3xl overflow-hidden">
                                <div className="crediban-header-gradient text-white px-5 py-3.5 flex flex-wrap justify-between items-center gap-2">
                                    <div>
                                        <div className="text-[10px] font-black text-emerald-300 uppercase tracking-wider">
                                            📋 CUADRO OFICIAL DEL DÍA — {obtenerNombreDiaSemana(mesActivo, diaCorteReporte)}
                                        </div>
                                        <h3 className="text-sm font-black uppercase">
                                            CRÉDITOS APROBADOS Y AVANCE DE DESEMBOLSOS ({sedeMostrarTitulo})
                                        </h3>
                                    </div>
                                    <span className="bg-white/15 px-3 py-1 rounded-full text-xs font-black">
                                        {datosCuadroDelDia.totalOperaciones} Operaciones
                                    </span>
                                </div>

                                {datosCuadroDelDia.filas.length === 0 ? (
                                    <div className="p-8 text-center text-slate-500 text-xs font-bold">
                                        No hay créditos registrados en el Día {diaCorteReporte} de {mesActivo}. Selecciona otro día arriba en "Día de Corte".
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs border-collapse">
                                            <thead>
                                                <tr className="bg-[#c5e0b4] text-slate-950 uppercase font-black border-b-2 border-slate-700">
                                                    <th className="p-2.5 text-left border-r border-slate-400">ASESOR (NOMBRE.A)</th>
                                                    <th className="p-2.5 text-center border-r border-slate-400 w-10">N°</th>
                                                    <th className="p-2.5 text-left border-r border-slate-400">CLIENTES / GRUPO</th>
                                                    <th className="p-2.5 text-right border-r border-slate-400">MONTO</th>
                                                    <th className="p-2.5 text-center">CONDICIÓN</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-300 font-bold">
                                                {datosCuadroDelDia.filas.map((f, idx) => {
                                                    const esDesembolsado = f.condicion === "DESEMBOLSADO";
                                                    return (
                                                        <tr key={idx} onClick={() => onVerPlan && onVerPlan(f.raw)} className={`cursor-pointer transition ${esDesembolsado ? "bg-[#f8cbad]/65 hover:bg-[#f8cbad]" : "bg-white hover:bg-amber-50"}`}>
                                                            <td className="p-2.5 font-black text-slate-900 border-r border-slate-300">{f.asesor}</td>
                                                            <td className="p-2.5 text-center font-black text-slate-800 border-r border-slate-300">{f.nroOperacionAsesor}</td>
                                                            <td className="p-2.5 font-extrabold text-slate-900 border-r border-slate-300">
                                                                <div>{f.cliente}</div>
                                                                {f.modalidad === "GRUPAL" && f.integrantes.length > 0 && (
                                                                    <div className="text-[10px] text-slate-700 font-semibold pl-2 border-l-2 border-slate-500 mt-0.5">
                                                                        {f.integrantes.map(i => `${i.nombre} (${formatShortSoles(i.monto)})`).join(" • ")}
                                                                    </div>
                                                                )}
                                                            </td>
                                                            <td className="p-2.5 text-right font-black text-slate-950 border-r border-slate-300">
                                                                {f.monto.toLocaleString('es-PE', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}
                                                            </td>
                                                            <td className="p-2.5 text-center">
                                                                {esDesembolsado ? (

                    if (rol === "ASESOR") {
                        localStorage.removeItem("crediban_desembolsos_session");

                    return parsed;

            const [filtroEtapaPipeline, setFiltroEtapaPipeline] = React.useState("TODAS");

            const [alertaDuplicadoModal, setAlertaDuplicadoModal] = React.useState(null);

            const [modalidadCredito, setModalidadCredito] = React.useState("INDIVIDUAL");

            const [nuevaSedeNombre, setNuevaSedeNombre] = React.useState("");

            const [metaSedeSelect, setMetaSedeSelect] = React.useState("HUACHO");

            const cargarDirectorioUsuarios = React.useCallback(() => {
                fetch(`${GAS_USUARIOS_URL}?action=getActiveUsers`)
                    .then(r => r.json())
                    .then(data => {
                        if (data && Array.isArray(data.usuarios) && data.usuarios.length > 0) {
                            setUsersRemote(data.usuarios);
                        }
                    })
                    .catch(() => {});
            }, []);

            React.useEffect(() => {
                cargarDirectorioUsuarios();
            }, [cargarDirectorioUsuarios]);

            const catalogoUsuariosOficial = React.useMemo(() => {
                const mapa = {};
                DIRECTORIO_USUARIOS_HOJA_BASE.forEach(b => {
                    const norm = normalizarRegistroUsuario(b);
                    mapa[norm.nombreCorto] = norm;
                });
                usersRemote.forEach(u => {
                    const norm = normalizarRegistroUsuario(u);
                    if (norm.nombreCorto) {
                        mapa[norm.nombreCorto] = { ...(mapa[norm.nombreCorto] || {}), ...norm };
                    }
                });
                Object.keys(overridesUsuarios).forEach(nc => {
                    if (mapa[nc]) {
                        mapa[nc] = { ...mapa[nc], ...overridesUsuarios[nc] };
                    }
                });
                return Object.values(mapa).filter(u => u.estado === "HABILITADO");
            }, [usersRemote, overridesUsuarios]);

            const listaAsesoresOficiales = React.useMemo(() => {
                return catalogoUsuariosOficial.filter(
                    u => clasificarRolEstricto(u.cargoOriginal, u.cargoOriginal, u) === "ASESOR"
                );
            }, [catalogoUsuariosOficial]);

            const sedesCatalogo = React.useMemo(() => {
                const mapaSedes = {};
                catalogoUsuariosOficial.forEach(u => {
                    if (u.sedePrincipal && u.sedePrincipal !== "TODAS") {
                        mapaSedes[u.sedePrincipal] = {
                            nombre: u.sedePrincipal,
                            metaOficina: METAS_OFICINA_POR_DEFECTO[u.sedePrincipal] || 100000,
                            estado: "ACTIVA"
                        };
                    }
                });
                sedesServidor.forEach(s => {
                    const nom = quitarTildes(s.nombre || "").trim().toUpperCase();
                    if (nom && nom !== "NUEVA OFICINA" && nom !== "ICA") {
                        mapaSedes[nom] = {
                            nombre: nom,
                            metaOficina: parseNum(s.metaOficina) || METAS_OFICINA_POR_DEFECTO[nom] || 100000,
                            estado: s.estado || "ACTIVA"
                        };
                    }
                });
                return Object.values(mapaSedes);
            }, [catalogoUsuariosOficial, sedesServidor]);

            const listaJefesAsignados = React.useMemo(() => {
                const setJefes = new Set();
                listaAsesoresOficiales.forEach(a => {
                    if (a.jefeAsignado && a.jefeAsignado.toUpperCase() !== "GERENCIA GENERAL") {
                        setJefes.add(a.jefeAsignado);
                    }
                });
                return Array.from(setJefes);
            }, [listaAsesoresOficiales]);

            const resolverAsesorOficial = React.useCallback((rawNombreAsesor, sedeMovimiento = "") => {
                if (!rawNombreAsesor) return null;
                const clean = quitarTildes(rawNombreAsesor).trim().toUpperCase();
                const sedeClean = quitarTildes(sedeMovimiento).trim().toUpperCase();
                const cortoCandidato = formatearNombreCorto(clean);

                let match = listaAsesoresOficiales.find(a =>
                    a.nombreCorto === cortoCandidato ||
                    a.usuarioUpper === clean
                );
                if (match) return match;

                const partes = clean.split(/[\s._-]+/).filter(Boolean);
                const p0 = partes[0] === "MELISA" ? "MELISSA" : partes[0] === "HEYDI" ? "HEIDY" : partes[0];
                match = listaAsesoresOficiales.find(a =>
                    (a.primerNombre === p0 || a.apellido === p0) &&
                    (!sedeClean || a.sedePrincipal === sedeClean)
                );
                if (match) return match;

                match = listaAsesoresOficiales.find(a => a.primerNombre === p0 || a.apellido === p0);
                return match || null;
            }, [listaAsesoresOficiales]);

            const movimientos = React.useMemo(() => {
                return movimientosRaw.map(m => {
                    const ofi = resolverAsesorOficial(m.asesor, m.sede);
                    return {
                        ...m,
                        asesorOriginalBD: m.asesor,
                        asesor: ofi ? ofi.nombreCorto : formatearNombreCorto(m.asesor),
                        sede: ofi ? ofi.sedePrincipal : quitarTildes(m.sede || "").trim().toUpperCase(),
                        esAsesorOficial: Boolean(ofi)
                    };
                }).filter(m => m.esAsesorOficial);
            }, [movimientosRaw, resolverAsesorOficial]);

            const expedientesCaja = React.useMemo(() => {
                return expedientesCajaRaw.map(m => {
                    const ofi = resolverAsesorOficial(m.asesor, m.sede);
                    const etapa = obtenerEtapaPipeline(m) || "EN_CAJA";
                    return {
                        ...m,
                        etapaPipeline: etapa,
                        asesorOriginalBD: m.asesor,
                        asesor: ofi ? ofi.nombreCorto : formatearNombreCorto(m.asesor),
                        sede: ofi ? ofi.sedePrincipal : quitarTildes(m.sede || "").trim().toUpperCase(),
                        esAsesorOficial: Boolean(ofi)
                    };
                }).filter(m => m.esAsesorOficial);
            }, [expedientesCajaRaw, resolverAsesorOficial]);

            const userRole = clasificarRolEstricto(session?.usuario?.cargo, session?.usuario?.cargoOriginal, session?.usuario);
            const userSede = quitarTildes(session?.usuario?.sedePrincipal || session?.usuario?.sede || "HUACHO").trim().toUpperCase();
            const userNombreOriginal = String(session?.usuario?.nombre || "").trim();

            const isGerente = userRole === "GERENTE";
            const isJefeZonal = userRole === "JEFE_ZONAL";
            const isAdmin = userRole === "ADMINISTRADOR";
            const isLiderEquipo = userRole === "LIDER_EQUIPO";
            const isJefeGrupal = userRole === "JEFE_CREDITO_GRUPAL";
            const isCajero = userRole === "CAJERO";

            const sedesPermitidasUsuario = React.useMemo(() => {
                if (isGerente) return ["TODAS", ...sedesCatalogo.map(s => s.nombre)];
                if (isJefeZonal) return extraerSedesZonal(session?.usuario?.sedePrincipal, session?.usuario?.sedesZona);
                return [userSede];
            }, [isGerente, isJefeZonal, sedesCatalogo, session, userSede]);

            const puedeDesembolsar = isCajero || isGerente;
            const puedeVerDetalleAvanzado = isGerente || isJefeZonal || isAdmin || isLiderEquipo || isJefeGrupal;
            const puedeRegistrarProyeccion = puedeDesembolsar || puedeVerDetalleAvanzado;

            React.useEffect(() => {
                if (filtroMes !== "TODOS") {
                    setMesCompResumen(obtenerMesAnterior(filtroMes));
                }
            }, [filtroMes]);

            const cargarDatosServidor = React.useCallback(async (tokenToUse) => {
                const tk = tokenToUse || session?.token;
                if (!tk) return;
                setLoadingData(true);
                setSyncMsg("Sincronizando con el Servidor...");
                cargarDirectorioUsuarios();
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "getSystemData", token: tk })
                    });
                    const data = await res.json();

                    if (data.status === "unauthorized") {
                        alert(data.message || "Sesión expirada.");
                        handleLogout();
                        return;
                    }

                    if (data.status === "ok") {
                        if (Array.isArray(data.sedes) && data.sedes.length > 0) setSedesServidor(data.sedes);
                        if (Array.isArray(data.metasAsesores)) setMetasAsesores(data.metasAsesores);
                        if (Array.isArray(data.movimientos)) {
                            setMovimientosRaw(data.movimientos.filter(m => m.formato === "DESEMBOLSO" && !esRegistroExpedienteCaja(m)));
                            setExpedientesCajaRaw(data.movimientos.filter(m => esRegistroExpedienteCaja(m)));
                        }
                        setSyncMsg("Conectado al Servidor ✅");
                    } else {
                        setSyncMsg("⚠️ " + (data.message || "Error al sincronizar"));
                    }
                } catch (e) {
                    setSyncMsg("⚠️ Error de red al consultar datos");
                } finally {
                    setLoadingData(false);
                }
            }, [session, cargarDirectorioUsuarios]);

            React.useEffect(() => {
                if (session && session.token) {

                const prefijo = etapaPipeline ? construirPrefijoEtapa(etapaPipeline) + " " : "";
                const nombreFinalGuardar = `${prefijo}${nombreLimpio}`;

                const payloadData = {

            const handleRegistrarDesembolso = (e) => { e.preventDefault(); guardarOperacionEnServidor(null, false); };
            const handleRegistrarEtapaPipeline = (e) => { e.preventDefault(); guardarOperacionEnServidor(etapaRegistrarForm, false); };

            const handleMoverEtapaOEjecutarDesembolso = async (exp, nuevaEtapa = null) => {

                const nombreGuardar = !nuevaEtapa ? nombreLimpio : `${construirPrefijoEtapa(nuevaEtapa)} ${nombreLimpio}`;

                    };

                    const resReg = await fetch(GAS_DESEMBOLSOS_URL, {

            const handleGuardarMetaMensual = async (e) => {

                const nombreBase = metaTipoSelect === "OFICINA" ? "__OFICINA__" : formatearNombreCorto(metaAsesorNombre);
                if (!nombreBase) { alert("Selecciona el asesor oficial."); return; }

                const claveAsesorMes = metaMesSelect === "TODOS" ? nombreBase : `${nombreBase}::${metaMesSelect}`;
                setLoadingData(true);
                try {
                    const res = await fetch(GAS_DESEMBOLSOS_URL, {

                    });
                    const data = await res.json();

                        alert(`✅ Meta de ${nombreBase} (${metaMesSelect}) guardada en ${formatMoney(metaAsesorMonto)}.`);
                        if (metaTipoSelect === "ASESOR") setMetaAsesorNombre("");

                } catch (e) { alert("Error al actualizar meta."); } finally { setLoadingData(false); }
